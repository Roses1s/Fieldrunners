<!DOCTYPE html>

<title>FIELD DEFENSE — Tower Defense</title>
<style>
/* ==========================================================================
   FIELD DEFENSE — стили оболочки (mobile first)
   Никаких внешних шрифтов/картинок: всё системное + процедурная графика.
   ========================================================================== */

:root {
  --hud-bg: rgba(18, 26, 48, 0.86);
  --hud-stroke: rgba(140, 180, 255, 0.35);
  --accent: #ffd23f;
  --accent-2: #4fd1ff;
  --danger: #ff5a5a;
  --ok: #6ee36e;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0f1e;
  color: #eaf1ff;
  font-family: "Trebuchet MS", "Segoe UI", Roboto, system-ui, sans-serif;
  /* Запрещаем все браузерные жесты: скролл, зум, выделение, контекстное меню */
  touch-action: none;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  position: fixed;
  inset: 0;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

/* Основной игровой canvas — на весь экран */
#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  image-rendering: auto;
}

/* ------------------------- Служебные оверлеи --------------------------- */

.overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
  padding: calc(24px + var(--safe-top)) calc(24px + var(--safe-right))
    calc(24px + var(--safe-bottom)) calc(24px + var(--safe-left));
  background: radial-gradient(circle at 50% 40%, #1b2a4d 0%, #080d1a 75%);
  text-align: center;
  z-index: 20;
}

.overlay.visible {
  display: flex;
}

.overlay h1 {
  font-size: clamp(22px, 5vw, 40px);
  letter-spacing: 1px;
  color: var(--accent);
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
}

.overlay p {
  font-size: clamp(14px, 3vw, 18px);
  opacity: 0.85;
  max-width: 460px;
  line-height: 1.5;
}

/* Иконка «поверните устройство» рисуется CSS-фигурой (без картинок) */
.rotate-icon {
  width: 58px;
  height: 96px;
  border: 4px solid var(--accent-2);
  border-radius: 10px;
  position: relative;
  animation: rotateHint 2.4s ease-in-out infinite;
}

.rotate-icon::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 6px;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  border-radius: 50%;
  background: var(--accent-2);
}

@keyframes rotateHint {
  0%, 18%   { transform: rotate(0deg); }
  62%, 100% { transform: rotate(-90deg); }
}

/* Экран загрузки */
#boot {
  z-index: 40;
  background: #0a0f1e;
}

#boot .bar {
  width: min(320px, 70vw);
  height: 10px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
}

#boot .bar > i {
  display: block;
  height: 100%;
  width: 35%;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  animation: bootSlide 1.1s ease-in-out infinite;
}

@keyframes bootSlide {
  0%   { transform: translateX(-110%); }
  100% { transform: translateX(320%); }
}

/* Отладочная плашка FPS */
#debug {
  position: absolute;
  left: calc(8px + var(--safe-left));
  bottom: calc(8px + var(--safe-bottom));
  z-index: 15;
  font: 11px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color: #9fffb0;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(159, 255, 176, 0.3);
  border-radius: 6px;
  padding: 4px 7px;
  pointer-events: none;
  display: none;
  white-space: pre;
}

#debug.visible { display: block; }

</style>

      <p>Генерация графики и звука…</p>
    </div>
  </div>
<script>
(function () {
'use strict';
/* FIELD DEFENSE — single-file build. Сгенерировано build.mjs, не править вручную. */

/* ==== js/utils/Constants.js ==== */
/* ==========================================================================
   Constants.js — глобальные константы и настройки игры
   Все числовые значения баланса вынесены сюда / в data/*.js, чтобы их можно
   было править в одном месте.
   ========================================================================== */

// Размер одной ячейки сетки в мировых пикселях (масштабируется камерой)
const CELL = 40;

// Типы ячеек сетки
const TILE = {
  EMPTY: 0,    // можно строить
  PATH: 1,     // дорога врагов (строить нельзя на картах с фикс. путём)
  BLOCKED: 2,  // декорации / непроходимое (строить нельзя)
  TOWER: 3,    // занято башней
  ENTRY: 4,    // точка входа врагов
  EXIT: 5      // точка выхода (что защищаем)
};

// Слои отрисовки (порядок важен)
const LAYER = {
  TERRAIN: 0,
  SHADOW: 1,
  GROUND: 2,
  UNIT: 3,
  AIR: 4,
  FX: 5,
  HUD: 6
};

// Режимы выбора цели башней
const TARGET_MODE = {
  FIRST: 'first',          // дальше всех продвинулся к выходу
  LAST: 'last',            // ближе всех к входу
  STRONGEST: 'strongest',  // максимум текущего HP
  WEAKEST: 'weakest',      // минимум текущего HP
  CLOSEST: 'closest'       // ближайший к башне
};

const TARGET_MODES = [
  TARGET_MODE.FIRST,
  TARGET_MODE.LAST,
  TARGET_MODE.STRONGEST,
  TARGET_MODE.WEAKEST,
  TARGET_MODE.CLOSEST
];

// Типы урона (используются для сопротивлений и подсветки в UI)
const DAMAGE_TYPE = {
  PHYSICAL: 'physical',
  EXPLOSIVE: 'explosive',
  ELECTRIC: 'electric',
  FIRE: 'fire',
  CHEMICAL: 'chemical',
  ENERGY: 'energy'
};

// Технические настройки
const CONFIG = {
  // Фиксированный шаг симуляции (1/60 с) — логика не зависит от FPS рендера
  FIXED_DT: 1 / 60,
  MAX_STEPS_PER_FRAME: 5,

  // Максимальный devicePixelRatio (A56 имеет DPR ~2.6 — ограничиваем ради FPS)
  MAX_DPR: 2,

  // Зум камеры относительно «вписывания карты в экран»
  MIN_ZOOM: 0.6,
  MAX_ZOOM: 2.6,

  // Экономика
  START_MONEY: 100,
  START_LIVES: 20,
  SELL_RATIO: 0.75,           // 75% от вложенного
  EARLY_SEND_RATIO: 0.5,      // монет за каждую оставшуюся секунду
  WAVE_BREAK_TIME: 15,        // пауза между волнами, с
  TOTAL_WAVES: 20,

  // Прогрессия сложности
  HP_SCALE_PER_WAVE: 1.15,    // HP врага *= 1.15^(wave-1)
  COUNT_SCALE_PER_WAVE: 1.1,  // количество *= 1.1^(wave-1) (для бесконечного режима)
  ARMOR_SCALE_PER_WAVE: 1.06,

  // Жизни
  BOSS_LIVES_COST: 5,
  DEFAULT_LIVES_COST: 1,

  // Звёзды за прохождение
  STAR_PERFECT_MAX_LEAKS: 0,
  STAR_GOOD_MAX_LEAKS: 5,

  // Производительность
  PARTICLE_POOL: 900,
  PROJECTILE_POOL: 400,
  EFFECT_POOL: 220,
  TEXT_POOL: 140,
  SPATIAL_CELL: 64,

  // «Батарейный» режим: при неактивности режем FPS до 30
  IDLE_DELAY: 25,             // секунд без ввода
  IDLE_FPS: 30,

  // Скорости игры
  SPEEDS: [1, 2, 3],

  // Биомы → палитры тайлов
  PALETTES: {
    grass: {
      ground: ['#79c64f', '#6fbb47', '#82cd57', '#74c04c'],
      groundDark: '#4f9536',
      path: '#d9a863',
      pathEdge: '#a97c42',
      pathSpeck: '#c1914f',
      fog: 'rgba(255,255,255,0.04)'
    },
    desert: {
      ground: ['#e9d494', '#e0c983', '#f0dda2', '#e5cf8c'],
      groundDark: '#b99f5f',
      path: '#cfa96a',
      pathEdge: '#a3803f',
      pathSpeck: '#b9954f',
      fog: 'rgba(255,220,160,0.05)'
    },
    lava: {
      ground: ['#4a4550', '#423d49', '#524c58', '#3b3742'],
      groundDark: '#2a2730',
      path: '#6b6470',
      pathEdge: '#3a3540',
      pathSpeck: '#7d7585',
      fog: 'rgba(255,90,40,0.05)'
    },
    city: {
      ground: ['#8e9aa6', '#86929e', '#96a2ae', '#7f8b97'],
      groundDark: '#5d6773',
      path: '#585f6b',
      pathEdge: '#3c424c',
      pathSpeck: '#6a7280',
      fog: 'rgba(255,255,255,0.03)'
    }
  },

  // Общая палитра UI
  UI: {
    panel: 'rgba(18, 26, 48, 0.9)',
    panelStroke: 'rgba(140, 180, 255, 0.35)',
    accent: '#ffd23f',
    accent2: '#4fd1ff',
    text: '#eaf1ff',
    dim: 'rgba(234, 241, 255, 0.55)',
    danger: '#ff5a5a',
    ok: '#6ee36e',
    button: '#2a3b66',
    buttonHi: '#3a5490',
    buttonDisabled: '#232a3d'
  }
};

// Ключ localStorage
const SAVE_KEY = 'field-defense-save-v1';

void { CELL, TILE, CONFIG, TARGET_MODE, TARGET_MODES, DAMAGE_TYPE, SAVE_KEY };


/* ==== js/utils/MathUtil.js ==== */
/* ==========================================================================
   MathUtil.js — математические хелперы (без аллокаций в горячих путях)
   ========================================================================== */

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

function clamp(v, a, b) {
  return v < a ? a : (v > b ? b : v);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function smoothstep(t) {
  t = clamp(t, 0, 1);
  return t * t * (3 - 2 * t);
}

function dist2(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  return dx * dx + dy * dy;
}

function dist(ax, ay, bx, by) {
  return Math.sqrt(dist2(ax, ay, bx, by));
}

/** Нормализация угла в диапазон (-PI, PI] */
function normAngle(a) {
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
}

/** Поворот к целевому углу с ограничением шага (используется для homing-ракет) */
function lerpAngle(a, b, t) {
  return a + normAngle(b - a) * clamp(t, 0, 1);
}

/** Шаг поворота с ограничением максимальной угловой скорости (рад/с) */
function rotateTowards(a, b, maxDelta) {
  const d = normAngle(b - a);
  if (Math.abs(d) <= maxDelta) return b;
  return a + Math.sign(d) * maxDelta;
}

function randRange(a, b) {
  return a + Math.random() * (b - a);
}

function randInt(a, b) {
  return Math.floor(a + Math.random() * (b - a + 1));
}

function pick(arr) {
  return arr[(Math.random() * arr.length) | 0];
}

/** Детерминированный PRNG (для фонов/декора — чтобы карта не «прыгала») */
function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return function rng() {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

/** Расстояние от точки до отрезка (для лучей/конусов) */
function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = clamp(t, 0, 1);
  return dist(px, py, ax + dx * t, ay + dy * t);
}

/** Форматирование чисел для HUD: 1200 -> "1.2K" */
function fmtNum(n) {
  n = Math.round(n);
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (Math.abs(n) >= 10000) return (n / 1000).toFixed(n >= 1e5 ? 0 : 1) + 'K';
  return String(n);
}

function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const m = (sec / 60) | 0;
  const s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

void {
  TAU, DEG, clamp, lerp, smoothstep, dist, dist2, normAngle, lerpAngle,
  rotateTowards, randRange, randInt, pick, makeRng, distToSegment, fmtNum, fmtTime
};


/* ==== js/utils/Vector2.js ==== */
/* ==========================================================================
   Vector2.js — минималистичный 2D-вектор.
   В горячих циклах (снаряды, частицы) используются «сырые» x/y, чтобы не
   плодить объекты под сборщик мусора; Vector2 — для читаемого кода логики.
   ========================================================================== */

class Vector2 {
  constructor(x = 0, y = 0) {
    this.x = x;
    this.y = y;
  }

  set(x, y) { this.x = x; this.y = y; return this; }
  copy(v) { this.x = v.x; this.y = v.y; return this; }
  clone() { return new Vector2(this.x, this.y); }

  add(v) { this.x += v.x; this.y += v.y; return this; }
  sub(v) { this.x -= v.x; this.y -= v.y; return this; }
  mul(s) { this.x *= s; this.y *= s; return this; }

  length() { return Math.hypot(this.x, this.y); }
  lengthSq() { return this.x * this.x + this.y * this.y; }

  normalize() {
    const l = this.length();
    if (l > 1e-9) { this.x /= l; this.y /= l; }
    return this;
  }

  distanceTo(v) { return Math.hypot(v.x - this.x, v.y - this.y); }
  angle() { return Math.atan2(this.y, this.x); }

  static fromAngle(a, len = 1) {
    return new Vector2(Math.cos(a) * len, Math.sin(a) * len);
  }

  static add(a, b) { return new Vector2(a.x + b.x, a.y + b.y); }
  static sub(a, b) { return new Vector2(a.x - b.x, a.y - b.y); }
}

void Vector2;


/* ==== js/utils/SpriteSheet.js ==== */
/* ==========================================================================
   SpriteSheet.js — процедурная генерация ВСЕЙ графики игры через Canvas 2D.
   Никаких внешних картинок: каждый спрайт рисуется кодом и кэшируется
   в offscreen-canvas при первом обращении (ленивая генерация).

   Соглашения:
     • тайлы и декор            — якорь bottom-center, если не сказано иное
     • турели башен             — центр в (w/2, h/2), «смотрят» вправо (0 рад)
     • враги                    — центр в (w/2, h/2), «смотрят» вправо
     • кадры анимации           — массив canvas одинакового размера
   ========================================================================== */


const OUTLINE = '#241f2a';
const cache = new Map();       // key -> canvas | canvas[]
const builders = new Map();    // key -> fn()

const hasDom = typeof document !== 'undefined';

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  return c;
}

function ctxOf(c) {
  const g = c.getContext('2d');
  g.lineJoin = 'round';
  g.lineCap = 'round';
  return g;
}

/* ----------------------------- примитивы ------------------------------- */

function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function fillRR(g, x, y, w, h, r, fill, lw, stroke) {
  rr(g, x, y, w, h, r);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (lw) { g.lineWidth = lw; g.strokeStyle = stroke || OUTLINE; g.stroke(); }
}

function circle(g, x, y, r, fill, lw, stroke) {
  g.beginPath();
  g.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (lw) { g.lineWidth = lw; g.strokeStyle = stroke || OUTLINE; g.stroke(); }
}

function poly(g, pts, fill, lw, stroke) {
  g.beginPath();
  g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (lw) { g.lineWidth = lw; g.strokeStyle = stroke || OUTLINE; g.stroke(); }
}

function vgrad(g, x, y, w, h, c0, c1) {
  const lg = g.createLinearGradient(x, y, x, y + h);
  lg.addColorStop(0, c0);
  lg.addColorStop(1, c1);
  return lg;
}

function shade(hex, amt) {
  // amt > 0 — светлее, < 0 — темнее
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= (1 + amt); g *= (1 + amt); b *= (1 + amt); }
  const to = (v) => ('0' + Math.round(Math.max(0, Math.min(255, v))).toString(16)).slice(-2);
  return '#' + to(r) + to(g) + to(b);
}

/* ============================ ТАЙЛЫ ЗЕМЛИ ============================== */

function buildTile(biome, variant) {
  const pal = CONFIG.PALETTES[biome] || CONFIG.PALETTES.grass;
  const S = CELL * 2; // генерим в 2x для чёткости при зуме
  const c = makeCanvas(S, S), g = ctxOf(c);
  const rng = makeRng(1337 + variant * 91 + biome.length * 17);

  g.fillStyle = pal.ground[variant % pal.ground.length];
  g.fillRect(0, 0, S, S);

  // Мягкие пятна травы/песка
  for (let i = 0; i < 26; i++) {
    const x = rng() * S, y = rng() * S, r = 3 + rng() * 10;
    g.fillStyle = pal.ground[(variant + 1 + ((rng() * 3) | 0)) % pal.ground.length];
    g.globalAlpha = 0.35 + rng() * 0.3;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;

  if (biome === 'grass') {
    // травинки
    g.strokeStyle = shade(pal.groundDark, 0.18);
    g.lineWidth = 1.6;
    for (let i = 0; i < 22; i++) {
      const x = rng() * S, y = rng() * S, h = 3 + rng() * 5, a = (rng() - 0.5) * 0.7;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + a * 3, y - h * 0.6, x + a * 6, y - h);
      g.stroke();
    }
  } else if (biome === 'desert') {
    // рябь песка
    g.strokeStyle = 'rgba(255,255,255,0.16)';
    g.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const y = rng() * S, x = rng() * S;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + 8, y - 3, x + 16, y);
      g.stroke();
    }
  } else if (biome === 'lava') {
    // трещины в камне
    g.strokeStyle = 'rgba(0,0,0,0.35)';
    g.lineWidth = 1.6;
    for (let i = 0; i < 8; i++) {
      let x = rng() * S, y = rng() * S;
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 3; k++) { x += (rng() - 0.5) * 18; y += (rng() - 0.5) * 18; g.lineTo(x, y); }
      g.stroke();
    }
    if (rng() < 0.3) { // тлеющая жилка
      g.strokeStyle = 'rgba(255,90,30,0.5)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(rng() * S, rng() * S); g.lineTo(rng() * S, rng() * S); g.stroke();
    }
  } else { // city
    // асфальтовая крошка / плитка
    g.strokeStyle = 'rgba(0,0,0,0.12)';
    g.lineWidth = 1.4;
    for (let i = 0; i <= 2; i++) {
      g.beginPath(); g.moveTo(i * S / 2, 0); g.lineTo(i * S / 2, S); g.stroke();
      g.beginPath(); g.moveTo(0, i * S / 2); g.lineTo(S, i * S / 2); g.stroke();
    }
  }

  // лёгкая виньетка клетки для читаемости сетки
  g.strokeStyle = 'rgba(0,0,0,0.06)';
  g.lineWidth = 2;
  g.strokeRect(1, 1, S - 2, S - 2);
  return c;
}

/* ============================== ДЕКОР ================================== */

function buildTree() {
  const W = 44, H = 52;
  const c = makeCanvas(W, H), g = ctxOf(c);
  const cx = W / 2;
  // тень
  g.fillStyle = 'rgba(0,0,0,0.18)';
  g.beginPath(); g.ellipse(cx, H - 4, 13, 5, 0, 0, Math.PI * 2); g.fill();
  // ствол
  fillRR(g, cx - 4, H - 22, 8, 20, 3, '#8a5a34', 2);
  // крона — три «облака»
  const blobs = [[cx, H - 34, 15], [cx - 10, H - 26, 11], [cx + 10, H - 27, 11]];
  for (const [x, y, r] of blobs) circle(g, x, y, r, '#2f7a34', 2.4);
  for (const [x, y, r] of blobs) {
    circle(g, x - r * 0.25, y - r * 0.3, r * 0.62, '#4aa344');
  }
  circle(g, cx - 6, H - 40, 4, 'rgba(255,255,255,0.22)');
  return c;
}

function buildPine() {
  const W = 36, H = 52;
  const c = makeCanvas(W, H), g = ctxOf(c);
  const cx = W / 2;
  g.fillStyle = 'rgba(0,0,0,0.18)';
  g.beginPath(); g.ellipse(cx, H - 4, 10, 4, 0, 0, Math.PI * 2); g.fill();
  fillRR(g, cx - 3, H - 16, 6, 14, 2, '#7a4f2c', 2);
  for (let i = 0; i < 3; i++) {
    const y = H - 14 - i * 12, w = 26 - i * 6;
    poly(g, [cx - w / 2, y, cx + w / 2, y, cx, y - 16], i % 2 ? '#2e7d3a' : '#379144', 2.2);

}

function buildBush() {

function buildRock() {

function buildFlower() {

function buildBuilding(seed) {
  const W = 62, H = 74;
  const c = makeCanvas(W, H), g = ctxOf(c);
  const rng = makeRng(seed || 7);
  const hue = ['#9aa6b4', '#b09a8a', '#8fa0a6', '#a8a0b4'][(rng() * 4) | 0];
  const h = 44 + rng() * 22;
  g.fillStyle = 'rgba(0,0,0,0.2)';
  g.beginPath(); g.ellipse(W / 2, H - 4, 24, 6, 0, 0, Math.PI * 2); g.fill();
  fillRR(g, 8, H - h, 46, h, 3, hue, 2.4);
  fillRR(g, 8, H - h, 46, 7, 3, shade(hue, 0.18), 2);
  // окна
  for (let y = H - h + 12; y < H - 10; y += 12) {
    for (let x = 14; x < 48; x += 11) {
      fillRR(g, x, y, 7, 8, 1.5, rng() < 0.3 ? '#ffe9a3' : '#3c4a5c', 1.2);

  // дверь
  fillRR(g, 26, H - 16, 10, 16, 2, '#4a3a2c', 1.8);
  return c;
}

function buildLavaPool() {

  lg.addColorStop(0.35, '#ff9a1f');

    g.ellipse(rng() * S, rng() * S, 3 + rng() * 7, 2 + rng() * 4, rng() * 3, 0, Math.PI * 2);

}

/* ============================ БАЗЫ БАШЕН =============================== */

const LEVEL_TRIM = ['#b07a3c', '#c3ccd8', '#ffd23f']; // бронза / серебро / золото

function buildTowerBase(level) {
  const S = 48;
  const c = makeCanvas(S, S), g = ctxOf(c);
  const cx = S / 2;
  // тень
  g.fillStyle = 'rgba(0,0,0,0.24)';
  g.beginPath(); g.ellipse(cx, S - 7, 17, 6, 0, 0, Math.PI * 2); g.fill();
  // плита
  fillRR(g, 6, 10, 36, 32, 6, vgrad(g, 6, 10, 36, 32, '#9aa3b2', '#6b7382'), 2.4);
  // «газонок» под плитой
  g.fillStyle = 'rgba(0,0,0,0.12)';
  rr(g, 9, 13, 30, 26, 5); g.fill();
  fillRR(g, 10, 13, 28, 24, 5, vgrad(g, 10, 13, 28, 24, '#b9c1cd', '#828a99'), 2);

  g.strokeStyle = LEVEL_TRIM[level] || LEVEL_TRIM[0];
  g.lineWidth = 2.4;
  rr(g, 8, 11, 32, 30, 6); g.stroke();
  // пипки уровня
  for (let i = 0; i <= level; i++) {
    circle(g, cx - 6 + i * 6, S - 8, 2, LEVEL_TRIM[level], 1, 'rgba(0,0,0,0.5)');

/* ============================== ТУРЕЛИ ================================= */

function buildGatlingTurret(level) {
  const S = 52;
  const c = makeCanvas(S, S), g = ctxOf(c);
  const cy = S / 2, x0 = 10;
  const metal = level === 2 ? '#8b7a4a' : (level === 1 ? '#7d8798' : '#6f7a8c');
  // корпус
  fillRR(g, x0, cy - 11, 22, 22, 5, vgrad(g, x0, cy - 11, 22, 22, shade(metal, 0.28), shade(metal, -0.18)), 2.2);
  // магазин
  fillRR(g, x0 - 4, cy + 4, 12, 10, 3, '#59606e', 2);
  // блок стволов
  const barrels = 3 + level;
  for (let i = 0; i < barrels; i++) {
    const off = (i - (barrels - 1) / 2) * 4.2;
    fillRR(g, x0 + 18, cy + off - 1.8, 20, 3.6, 1.8, i % 2 ? '#4c5260' : '#5d6472', 1.4);
  }
  // муфта
  circle(g, x0 + 18, cy, 6.5, shade(metal, 0.1), 2);
  circle(g, x0 + 18, cy, 3, '#3a4050', 1.4);
  // блик
  g.fillStyle = 'rgba(255,255,255,0.28)';
  rr(g, x0 + 3, cy - 9, 16, 4, 2); g.fill();
  return c;
}

function buildGlueTurret(level) {
  const S = 52;
  const c = makeCanvas(S, S), g = ctxOf(c);

  g.fillStyle = 'rgba(255,255,255,0.35)';
  rr(g, 11, cy - 10, 5, 18, 2.5); g.fill();
  // пузыри
  circle(g, 21, cy - 4, 2.4, 'rgba(255,255,255,0.55)');
  circle(g, 17, cy + 5, 1.8, 'rgba(255,255,255,0.45)');
  // сопло
  const ncol = level === 2 ? '#ffd23f' : (level === 1 ? '#c3ccd8' : '#8b95a5');
  poly(g, [28, cy - 6, 40, cy - 3, 40, cy + 3, 28, cy + 6], ncol, 2.2);
  // капля на конце
  circle(g, 41, cy, 3.4, '#bff0ff', 1.6);
  // шланг
  g.strokeStyle = '#3f6f8a'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(18, cy - 13); g.quadraticCurveTo(24, cy - 22, 32, cy - 12); g.stroke();

}

function buildMissileTurret(level) {
  const S = 56;
  const c = makeCanvas(S, S), g = ctxOf(c);
  const cy = S / 2 + 4;
  // поворотная платформа
  circle(g, 18, cy, 10, '#6d7482', 2.2);
  circle(g, 18, cy, 5, '#565d6b', 1.6);
  // пакет труб
  const tubes = 2 + level;
  g.save();
  g.translate(18, cy);
  g.rotate(-0.42);
  for (let i = 0; i < tubes; i++) {
    const off = (i - (tubes - 1) / 2) * 7;
    fillRR(g, 2, off - 3.2, 26, 6.4, 3, i % 2 ? '#8a6f4f' : '#9c7f5c', 2);
    circle(g, 28, off, 3.2, '#3b3226', 1.4);
    // боеголовка торчит
    poly(g, [26, off - 3, 32, off, 26, off + 3], '#ff7a3c', 1.4);
  }
  g.restore();
  // рама
  fillRR(g, 8, cy + 4, 20, 8, 3, '#5b6270', 2);
  return c;
}

function buildTeslaTurret(level) {
  const S = 54;
  const c = makeCanvas(S, S), g = ctxOf(c);
  const cy = S / 2 + 2;
  // основание-катушка
  fillRR(g, 12, cy - 4, 18, 16, 4, vgrad(g, 12, cy - 4, 18, 16, '#6d7bb0', '#3f4a75'), 2.2);
  // витки
  g.strokeStyle = '#c9a227'; g.lineWidth = 1.8;
  for (let i = 0; i < 4; i++) {
    g.beginPath(); g.moveTo(13, cy - 2 + i * 3.4); g.lineTo(29, cy - 2 + i * 3.4); g.stroke();
  }
  // два электрода
  const trim = level === 2 ? '#ffd23f' : (level === 1 ? '#dfe7f2' : '#9fe8ff');
  g.strokeStyle = '#b9c4d6'; g.lineWidth = 3;
  g.beginPath();
  g.moveTo(16, cy - 4); g.quadraticCurveTo(14, cy - 18, 24, cy - 22);
  g.moveTo(26, cy - 4); g.quadraticCurveTo(30, cy - 18, 24, cy - 22);
  g.stroke();
  // шар разряда
  const lg = g.createRadialGradient(24, cy - 23, 1, 24, cy - 23, 9 + level * 1.5);
  lg.addColorStop(0, '#ffffff');
  lg.addColorStop(0.4, trim);
  lg.addColorStop(1, 'rgba(90,180,255,0)');
  g.fillStyle = lg;
  g.beginPath(); g.arc(24, cy - 23, 9 + level * 1.5, 0, Math.PI * 2); g.fill();
  circle(g, 24, cy - 23, 3.6, '#eaf9ff', 1.6, '#5aa8d8');
  return c;
}

/* ============================== ВРАГИ ================================== */

/** Универсальный пехотинец: 6 кадров ходьбы. size — сторона canvas. */
function buildHumanoidFrames(tint, opts = {}) {
  const S = opts.size || 30;
  const frames = opts.frames || 6;
  const dark = shade(tint, -0.32);
  const light = shade(tint, 0.22);
  const skin = '#e8b48c';
  const metal = '#4b5260';
  const out = [];

  for (let f = 0; f < frames; f++) {
    const c = makeCanvas(S, S), g = ctxOf(c);
    const cx = S / 2;
    const t = f / frames;
    const swing = Math.sin(t * Math.PI * 2);
    const bob = Math.abs(Math.cos(t * Math.PI * 2)) * 1.4;
    const feet = S - 4;
    const hip = feet - 8 - bob;

    // тень
    g.fillStyle = 'rgba(0,0,0,0.22)';
    g.beginPath(); g.ellipse(cx, S - 3, 7.5, 2.8, 0, 0, Math.PI * 2); g.fill();

    // ноги
    g.strokeStyle = dark; g.lineWidth = 3.6;
    g.beginPath();
    g.moveTo(cx, hip); g.lineTo(cx + swing * 4.6, feet);
    g.moveTo(cx, hip); g.lineTo(cx - swing * 4.6, feet);
    g.stroke();
    // ботинки
    g.fillStyle = '#2f3540';
    fillRR(g, cx + swing * 4.6 - 3, feet - 2.5, 6.5, 3.2, 1.4, '#2f3540', 0);
    fillRR(g, cx - swing * 4.6 - 3.5, feet - 2.5, 6.5, 3.2, 1.4, '#2f3540', 0);

    // торс
    const torsoTop = hip - 11;
    fillRR(g, cx - 5.5, torsoTop, 11, 12, 3.5, vgrad(g, cx - 5.5, torsoTop, 11, 12, light, tint), 2);
    // разгрузка
    g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(cx - 4, torsoTop + 4); g.lineTo(cx + 4, torsoTop + 4); g.stroke();

    // рюкзак
    fillRR(g, cx - 9, torsoTop + 1, 5, 8, 2, dark, 1.6);

    // руки + оружие
    g.strokeStyle = tint; g.lineWidth = 3;
    const armY = torsoTop + 4;
    g.beginPath(); g.moveTo(cx, armY); g.lineTo(cx + 6 + swing, armY + 2); g.stroke();
    // винтовка
    if (!opts.noGun) {
      fillRR(g, cx + 3, armY - 1.4, 13, 3, 1.4, metal, 1.4);
      fillRR(g, cx + 6, armY + 1, 3, 4, 1, '#3a404c', 1);
    }

    // голова
    const hy = torsoTop - 4.5;
    circle(g, cx + 1, hy, 4.6, skin, 2);
    // шлем
    g.fillStyle = opts.helm || dark;
    g.beginPath();
    g.arc(cx + 1, hy - 0.6, 5.1, Math.PI * 1.02, Math.PI * 2.02);
    g.closePath();
    g.lineWidth = 2; g.strokeStyle = OUTLINE; g.stroke(); g.fill();
    // глаз
    circle(g, cx + 3.4, hy + 0.6, 0.9, '#22262e', 0);

    // «след скорости» для бегуна
    if (opts.speedLines) {
      g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1.4;
      for (let i = 0; i < 3; i++) {
        g.beginPath();
        g.moveTo(cx - 8 - i * 3, torsoTop + 2 + i * 3.5);
        g.lineTo(cx - 14 - i * 3, torsoTop + 2 + i * 3.5);
        g.stroke();
      }
    }
    out.push(c);
  }
  return out;
}

function buildBikerFrames() {
  const S = 38, frames = 4, out = [];
  for (let f = 0; f < frames; f++) {
    const c = makeCanvas(S, S), g = ctxOf(c);
    const cy = S / 2 + 4;
    const wob = Math.sin((f / frames) * Math.PI * 2) * 0.7;
    g.fillStyle = 'rgba(0,0,0,0.22)';
    g.beginPath(); g.ellipse(S / 2, S - 3, 13, 3, 0, 0, Math.PI * 2); g.fill();
    // колёса
    for (const wx of [8, 28]) {
      circle(g, wx, cy + 5, 5.4, '#22262e', 2);
      circle(g, wx, cy + 5, 2.2, '#8d95a3', 1.2);
      g.save(); g.translate(wx, cy + 5); g.rotate(f * 0.9);
      g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(-4, 0); g.lineTo(4, 0); g.moveTo(0, -4); g.lineTo(0, 4); g.stroke();
      g.restore();
    }
    // рама
    poly(g, [8, cy + 5, 16, cy - 3, 26, cy - 3, 28, cy + 5], null, 3, '#c8862a');
    fillRR(g, 14, cy - 6, 12, 5, 2, '#e0952f', 2);
    // rider
    g.save(); g.translate(18, cy - 8); g.rotate(-0.16 + wob * 0.05);
    fillRR(g, -4, -8, 9, 10, 3, vgrad(g, -4, -8, 9, 10, '#e0674a', '#b3402a'), 2);
    circle(g, 1, -12, 4.4, '#dfe6f0', 2);   // шлем
    g.fillStyle = 'rgba(60,90,130,0.9)';
    rr(g, 1.5, -13.5, 4, 3, 1.2); g.fill();
    g.strokeStyle = '#b3402a'; g.lineWidth = 2.6;
    g.beginPath(); g.moveTo(0, -6); g.lineTo(7, -3); g.stroke();
    g.restore();
    out.push(c);
  }
  return out;
}

function buildCopterSprite() {
  const S = 46;

function buildTankFrames() {
  const S = 44, frames = 4, out = [];
  for (let f = 0; f < frames; f++) {
    const c = makeCanvas(S, S), g = ctxOf(c);
    const cy = S / 2 + 5;
    g.fillStyle = 'rgba(0,0,0,0.24)';
    g.beginPath(); g.ellipse(S / 2, S - 3, 16, 3.4, 0, 0, Math.PI * 2); g.fill();
    // гусеницы
    fillRR(g, 5, cy, 34, 11, 5, '#2f3540', 2.2);
    for (let i = 0; i < 6; i++) {
      const x = 8 + ((i * 6 + f * 2) % 30);
      g.fillStyle = 'rgba(255,255,255,0.14)';
      g.fillRect(x, cy + 1.5, 2.4, 8);
    }
    circle(g, 10, cy + 5.5, 3, '#5d6472', 1.4);
    circle(g, 34, cy + 5.5, 3, '#5d6472', 1.4);
    // корпус
    poly(g, [7, cy, 12, cy - 11, 34, cy - 11, 38, cy], '#6b7a52', 2.4);
    fillRR(g, 12, cy - 11, 22, 4, 2, '#7d8c60', 1.6);
    // башня
    fillRR(g, 15, cy - 19, 15, 9, 3, vgrad(g, 15, cy - 19, 15, 9, '#7f8f63', '#5b6b45'), 2.2);
    fillRR(g, 29, cy - 16.5, 13, 4, 2, '#4e5a3c', 2);
    // люк + антенна
    circle(g, 21, cy - 19, 2.4, '#4e5a3c', 1.4);
    g.strokeStyle = '#3d4733'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(17, cy - 19); g.lineTo(15, cy - 26); g.stroke();
    out.push(c);
  }
  return out;
}

function buildTransportFrames() {
  const S = 46, frames = 4, out = [];
  for (let f = 0; f < frames; f++) {
    const c = makeCanvas(S, S), g = ctxOf(c);
    const cy = S / 2 + 6;
    g.fillStyle = 'rgba(0,0,0,0.24)';
    g.beginPath(); g.ellipse(S / 2, S - 3, 17, 3.4, 0, 0, Math.PI * 2); g.fill();
    // колёса
    for (const wx of [12, 33]) {
      circle(g, wx, cy + 4, 5.2, '#22262e', 2);
      circle(g, wx, cy + 4, 2, '#8d95a3', 1.2);
      g.save(); g.translate(wx, cy + 4); g.rotate(f * 1.2);
      g.strokeStyle = 'rgba(255,255,255,0.3)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(-3.6, 0); g.lineTo(3.6, 0); g.stroke();
      g.restore();
    }
    // кузов
    fillRR(g, 4, cy - 14, 26, 16, 3, vgrad(g, 4, cy - 14, 26, 16, '#8d7c58', '#6b5c3f'), 2.4);
    // тент
    g.strokeStyle = 'rgba(0,0,0,0.22)'; g.lineWidth = 1.6;
    for (let i = 0; i < 4; i++) {
      g.beginPath(); g.moveTo(8 + i * 6, cy - 14); g.lineTo(8 + i * 6, cy + 2); g.stroke();
    }
    // кабина
    fillRR(g, 30, cy - 12, 13, 14, 3, vgrad(g, 30, cy - 12, 13, 14, '#9c8a63', '#75653f'), 2.4);
    g.fillStyle = 'rgba(180,225,255,0.85)';
    rr(g, 33, cy - 10, 8, 5, 1.6); g.fill();
    g.strokeStyle = OUTLINE; g.lineWidth = 1.4; g.stroke();
    // мигалка
    circle(g, 36, cy - 14, 2, f % 2 ? '#ffd23f' : '#ff7a3c', 1.2);
    out.push(c);
  }
  return out;
}

function buildBossFrames() {
  const S = 84, frames = 6, out = [];
  for (let f = 0; f < frames; f++) {
    const c = makeCanvas(S, S), g = ctxOf(c);
    const cx = S / 2, t = f / frames;
    const step = Math.sin(t * Math.PI * 2);
    const bob = Math.abs(Math.cos(t * Math.PI * 2)) * 2.2;
    const feet = S - 8;
    g.fillStyle = 'rgba(0,0,0,0.28)';
    g.beginPath(); g.ellipse(cx, S - 5, 26, 6, 0, 0, Math.PI * 2); g.fill();

    // ноги-опоры
    for (const s of [-1, 1]) {
      const kx = cx + s * 13 + step * s * 5;
      g.strokeStyle = '#4a3a44'; g.lineWidth = 8;
      g.beginPath();
      g.moveTo(cx + s * 8, feet - 26 - bob);
      g.lineTo(kx, feet - 12);
      g.lineTo(kx + s * 2, feet);
      g.stroke();
      fillRR(g, kx - 7, feet - 5, 15, 6, 2.5, '#3b2f37', 2);
    }

    // корпус
    const bodyTop = feet - 46 - bob;
    fillRR(g, cx - 21, bodyTop, 42, 30, 8, vgrad(g, cx - 21, bodyTop, 42, 30, '#8a5670', '#5b3446'), 2.8);
    // бронеплиты
    g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx - 21, bodyTop + 10); g.lineTo(cx + 21, bodyTop + 10); g.stroke();
    fillRR(g, cx - 14, bodyTop + 13, 28, 10, 3, '#6d4155', 1.8);
    // «глаз»
    const glow = g.createRadialGradient(cx + 12, bodyTop + 6, 1, cx + 12, bodyTop + 6, 8);
    glow.addColorStop(0, '#fff'); glow.addColorStop(0.4, '#ff5a3c'); glow.addColorStop(1, 'rgba(255,90,60,0)');
    g.fillStyle = glow; g.beginPath(); g.arc(cx + 12, bodyTop + 6, 8, 0, Math.PI * 2); g.fill();
    circle(g, cx + 12, bodyTop + 6, 3, '#ffd0c0', 1.4, '#8a2f1f');

    // пушка на плече
    g.save();
    g.translate(cx - 14, bodyTop + 4);
    g.rotate(-0.12);
    fillRR(g, -18, -4, 20, 8, 3, '#4b5260', 2.2);
    circle(g, -18, 0, 4.4, '#333a46', 1.8);
    g.restore();

    // антенны/рога
    g.strokeStyle = '#3b2f37'; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(cx - 8, bodyTop); g.lineTo(cx - 13, bodyTop - 10);
    g.moveTo(cx + 6, bodyTop); g.lineTo(cx + 10, bodyTop - 12);
    g.stroke();
    circle(g, cx + 10, bodyTop - 13, 2.6, f % 2 ? '#ffd23f' : '#ff7a3c', 1.2);
    out.push(c);
  }
  return out;
}

/* ============================ СНАРЯДЫ ================================== */

function buildBullet() {
  const S = 12;
  const c = makeCanvas(S, S), g = ctxOf(c);
  const lg = g.createRadialGradient(S / 2, S / 2, 0.5, S / 2, S / 2, S / 2);
  lg.addColorStop(0, '#fffbe0');
  lg.addColorStop(0.4, '#ffd23f');
  lg.addColorStop(1, 'rgba(255,160,40,0)');
  g.fillStyle = lg;
  g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2); g.fill();
  return c;
}

function buildMissile() {
  const W = 22, H = 10;
  const c = makeCanvas(W, H), g = ctxOf(c);
  const cy = H / 2;
  fillRR(g, 3, cy - 2.6, 13, 5.2, 2.4, vgrad(g, 3, cy - 2.6, 13, 5.2, '#e8edf5', '#9aa4b4'), 1.6);
  poly(g, [16, cy - 2.6, 21, cy, 16, cy + 2.6], '#ff7a3c', 1.4);
  poly(g, [3, cy - 4.2, 7, cy - 2.4, 3, cy - 2.4], '#c0563a', 1.2);
  poly(g, [3, cy + 4.2, 7, cy + 2.4, 3, cy + 2.4], '#c0563a', 1.2);
  circle(g, 2, cy, 2.2, 'rgba(255,200,120,0.9)', 0);
  return c;
}

function buildGlueBlob() {
  const S = 14;
  const c = makeCanvas(S, S), g = ctxOf(c);
  const lg = g.createRadialGradient(S / 2 - 1, S / 2 - 2, 1, S / 2, S / 2, S / 2);
  lg.addColorStop(0, '#e6fbff');
  lg.addColorStop(0.5, '#63cdf2');
  lg.addColorStop(1, '#2f8fc0');
  g.fillStyle = lg;
  g.beginPath();
  g.moveTo(S / 2, 1);
  g.quadraticCurveTo(S - 1, S / 2 + 2, S / 2, S - 1);
  g.quadraticCurveTo(1, S / 2 + 2, S / 2, 1);
  g.fill();
  g.lineWidth = 1.4; g.strokeStyle = 'rgba(20,60,90,0.7)'; g.stroke();
  return c;
}

function buildBee() {
  const S = 10;
  const c = makeCanvas(S, S), g = ctxOf(c);
  g.fillStyle = '#ffd23f';
  g.beginPath(); g.ellipse(S / 2, S / 2, 3.2, 2.4, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#22262e'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(S / 2 - 0.5, S / 2 - 2.4); g.lineTo(S / 2 - 0.5, S / 2 + 2.4); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.7)';
  g.beginPath(); g.ellipse(S / 2 + 1, S / 2 - 2.6, 2.2, 1.2, -0.4, 0, Math.PI * 2); g.fill();
  return c;
}

/* ============================== ИКОНКИ ================================= */

function iconCanvas(S, draw) {
  const c = makeCanvas(S, S), g = ctxOf(c);
  draw(g, S);
  return c;
}

function buildCoin() {
  return iconCanvas(28, (g, S) => {
    const cx = S / 2, cy = S / 2;
    circle(g, cx, cy + 1, 11, '#b8860b', 0);
    circle(g, cx, cy, 11, vgrad(g, cx - 11, cy - 11, 22, 22, '#ffe98a', '#e8a92a'), 2.2, '#8a5f12');
    circle(g, cx, cy, 7.4, null, 1.6, 'rgba(138,95,18,0.55)');
    g.fillStyle = '#8a5f12';
    g.font = 'bold 13px "Trebuchet MS", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('$', cx, cy + 1);
    g.fillStyle = 'rgba(255,255,255,0.5)';
    g.beginPath(); g.ellipse(cx - 4, cy - 5, 3, 1.6, -0.6, 0, Math.PI * 2); g.fill();
  });
}

function buildHeart() {
  return iconCanvas(28, (g, S) => {
    const cx = S / 2;
    g.beginPath();
    g.moveTo(cx, S - 5);
    g.bezierCurveTo(cx - 16, S / 2 - 2, cx - 8, 2, cx, 9);
    g.bezierCurveTo(cx + 8, 2, cx + 16, S / 2 - 2, cx, S - 5);
    g.closePath();
    g.fillStyle = vgrad(g, 0, 2, S, S, '#ff8a8a', '#d92b2b');
    g.fill();
    g.lineWidth = 2.2; g.strokeStyle = '#7d1414'; g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.beginPath(); g.ellipse(cx - 4.5, 9, 2.6, 1.6, -0.5, 0, Math.PI * 2); g.fill();
  });
}

function buildStar(filled) {
  return iconCanvas(30, (g, S) => {
    const cx = S / 2, cy = S / 2 + 1, R = 12, r = 5.2;
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      const rad = i % 2 ? r : R;
      const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
    g.fillStyle = filled ? vgrad(g, 0, 0, S, S, '#fff3b0', '#f0a92a') : 'rgba(255,255,255,0.12)';
    g.fill();
    g.lineWidth = 2; g.strokeStyle = filled ? '#8a5f12' : 'rgba(255,255,255,0.3)'; g.stroke();
  });
}

function buildGlyphIcon(kind) {
  return iconCanvas(28, (g, S) => {
    g.strokeStyle = '#eaf1ff'; g.fillStyle = '#eaf1ff';
    g.lineWidth = 2.6; g.lineCap = 'round';
    const cx = S / 2, cy = S / 2;
    switch (kind) {
      case 'play':
        poly(g, [9, 5, 23, 14, 9, 23], '#eaf1ff', 2.4);
        break;
      case 'pause':
        fillRR(g, 8, 6, 4.6, 16, 2, '#eaf1ff', 0);
        fillRR(g, 15.4, 6, 4.6, 16, 2, '#eaf1ff', 0);
        break;
      case 'ff':
        poly(g, [5, 6, 14, 14, 5, 22], '#eaf1ff', 2);
        poly(g, [14, 6, 23, 14, 14, 22], '#eaf1ff', 2);
        break;
      case 'gear':
        circle(g, cx, cy, 5, null, 2.6, '#eaf1ff');
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          g.beginPath();
          g.moveTo(cx + Math.cos(a) * 7.5, cy + Math.sin(a) * 7.5);
          g.lineTo(cx + Math.cos(a) * 11, cy + Math.sin(a) * 11);
          g.stroke();
        }
        break;
      case 'home':
        poly(g, [4, 13, 14, 4, 24, 13], null, 2.6, '#eaf1ff');
        fillRR(g, 7, 13, 14, 11, 2, null, 2.6, '#eaf1ff');
        break;
      case 'restart':
        g.beginPath(); g.arc(cx, cy, 8, -0.6, Math.PI * 1.5); g.stroke();
        poly(g, [cx + 5, cy - 11, cx + 12, cy - 6, cx + 3, cy - 3], '#eaf1ff', 1.6);
        break;
      case 'sell':
        g.beginPath(); g.arc(cx, cy + 2, 7, 0, Math.PI * 2); g.stroke();
        g.font = 'bold 11px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('$', cx, cy + 3);
        poly(g, [cx - 4, cy - 9, cx, cy - 14, cx + 4, cy - 9], '#6ee36e', 1.6);
        break;
      case 'up':
        poly(g, [5, 17, 14, 7, 23, 17], null, 3, '#6ee36e');
        g.beginPath(); g.moveTo(6, 22); g.lineTo(22, 22); g.stroke();
        break;
      case 'target':
        circle(g, cx, cy, 8, null, 2.2, '#eaf1ff');
        g.beginPath();
        g.moveTo(cx - 12, cy); g.lineTo(cx - 4, cy);
        g.moveTo(cx + 4, cy); g.lineTo(cx + 12, cy);
        g.moveTo(cx, cy - 12); g.lineTo(cx, cy - 4);
        g.moveTo(cx, cy + 4); g.lineTo(cx, cy + 12);
        g.stroke();
        circle(g, cx, cy, 1.8, '#ff5a5a', 0);
        break;
      case 'lock':
        fillRR(g, 6, 12, 16, 12, 3, '#eaf1ff', 0);
        g.beginPath(); g.arc(cx, 12, 5.5, Math.PI, 0); g.lineWidth = 2.6; g.stroke();
        circle(g, cx, 18, 1.8, '#1b2440', 0);
        break;
      case 'sound':
        poly(g, [5, 11, 10, 11, 16, 5, 16, 23, 10, 17, 5, 17], '#eaf1ff', 2);
        g.beginPath(); g.arc(17, 14, 5, -0.9, 0.9); g.stroke();
        g.beginPath(); g.arc(17, 14, 9, -0.8, 0.8); g.stroke();
        break;
      case 'mute':
        poly(g, [5, 11, 10, 11, 16, 5, 16, 23, 10, 17, 5, 17], '#eaf1ff', 2);
        g.beginPath(); g.moveTo(19, 9); g.lineTo(26, 19); g.moveTo(26, 9); g.lineTo(19, 19); g.stroke();
        break;
      case 'close':
        g.beginPath(); g.moveTo(7, 7); g.lineTo(21, 21); g.moveTo(21, 7); g.lineTo(7, 21); g.stroke();
        break;
      case 'wave':
        g.beginPath();
        g.moveTo(3, 18);
        g.bezierCurveTo(8, 6, 12, 26, 17, 13);
        g.bezierCurveTo(20, 6, 23, 18, 25, 15);
        g.stroke();
        break;
      case 'skull':
        circle(g, cx, cy - 1, 8, '#eaf1ff', 2);
        fillRR(g, cx - 5, cy + 4, 10, 6, 2, '#eaf1ff', 2);
        circle(g, cx - 3, cy - 2, 2.2, '#1b2440', 0);
        circle(g, cx + 3, cy - 2, 2.2, '#1b2440', 0);
        break;
    }
  });
}

/* ============================== ПУБЛИЧНОЕ API =========================== */

const Sprites = {
  /** Одиночный спрайт (ленивая генерация + кэш) */
  get(key) {
    if (!hasDom) return null;
    let v = cache.get(key);
    if (v === undefined) {
      const b = builders.get(key);
      v = b ? b() : null;
      cache.set(key, v);
    }
    return v;
  },

  /** Массив кадров анимации */
  getFrames(key) {
    const v = Sprites.get(key);
    return Array.isArray(v) ? v : (v ? [v] : []);
  },

  /** Есть ли билдер (для проверки опечаток в ключах) */
  has(key) { return builders.has(key); },

  /**
   * Белый силуэт кадра — используется для вспышки при попадании.
   * Генерируется один раз и кэшируется (композит 'source-in').
   */
  getSilhouette(key, frame, color = '#ffffff') {
    if (!hasDom) return null;
    const frames = Sprites.getFrames(key);
    if (!frames.length) return null;
    const idx = ((frame | 0) % frames.length + frames.length) % frames.length;
    const ck = `sil:${key}:${idx}:${color}`;
    let v = cache.get(ck);
    if (v !== undefined) return v;
    const src = frames[idx];
    const c = makeCanvas(src.width, src.height);
    const g = ctxOf(c);
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, c.width, c.height);
    cache.set(ck, c);
    return c;
  },

  /**
   * Нарисовать спрайт с поворотом/отражением.
   * align: 'center' | 'bottom' (якорь по нижней точке — для юнитов/декора)
   */
  draw(g, key, x, y, opts) {
    const img = Sprites.get(key);
    if (!img) return;
    const o = opts || {};
    const rot = o.rot || 0;
    const s = o.scale || 1;
    const flip = o.flip ? -1 : 1;
    const w = img.width * s, h = img.height * s;
    g.save();
    g.translate(x, y);
    if (o.alpha !== undefined) g.globalAlpha = o.alpha;
    if (rot) g.rotate(rot);
    if (flip !== 1) g.scale(flip, 1);
    const oy = o.align === 'bottom' ? -h : -h / 2;
    g.drawImage(img, -w / 2, oy, w, h);
    g.restore();
  },

  /** Нарисовать кадр анимации */
  drawFrame(g, key, frame, x, y, opts) {
    const frames = Sprites.getFrames(key);
    if (!frames.length) return;
    const img = frames[((frame | 0) % frames.length + frames.length) % frames.length];
    const o = opts || {};
    const s = o.scale || 1;
    const w = img.width * s, h = img.height * s;
    g.save();
    g.translate(x, y);
    if (o.alpha !== undefined) g.globalAlpha = o.alpha;
    if (o.rot) g.rotate(o.rot);
    if (o.flip) g.scale(-1, 1);
    g.drawImage(img, -w / 2, o.align === 'bottom' ? -h : -h / 2, w, h);
    g.restore();
  },

  /** Очистка кэша (например, при смене DPR-стратегии) */
  clear() { cache.clear(); }
};

void Sprites;


/* ==== js/utils/Camera.js ==== */
/* ==========================================================================
   Camera.js — мировые координаты <-> экранные, зум, панорама, тряска.
   Хранит «базовый» zoom (карта вписана в экран) и множитель пользователя.
   ========================================================================== */


class Camera {
  constructor() {
    this.x = 0;            // мировая координата левого верхнего угла экрана
    this.y = 0;
    this.zoom = 1;         // итоговый масштаб (base * user)
    this.baseZoom = 1;     // масштаб «вписать карту»
    this.userZoom = 1;     // множитель от pinch/колеса
    this.viewW = 800;
    this.viewH = 480;
    this.worldW = 800;
    this.worldH = 480;
    this.shakeT = 0;
    this.shakeAmp = 0;
    this.offX = 0;         // смещение тряски (экранные px)
    this.offY = 0;
  }

  /** Привязка к размеру экрана и мира; сразу вписывает карту */
  resize(viewW, viewH, worldW, worldH) {
    this.viewW = viewW;
    this.viewH = viewH;
    this.worldW = worldW;
    this.worldH = worldH;
    this.fit();
  }

  /** Подобрать базовый зум так, чтобы карта целиком помещалась на экране */
  fit(padding = 8) {
    const zx = (this.viewW - padding * 2) / this.worldW;
    const zy = (this.viewH - padding * 2) / this.worldH;
    this.baseZoom = Math.max(0.35, Math.min(zx, zy));
    this.applyZoom();
    this.center();
  }

  applyZoom() {
    this.zoom = this.baseZoom * this.userZoom;
  }

  center() {
    // центрируем карту; если она меньше экрана — по центру экрана
    const scaledW = this.worldW * this.zoom;
    const scaledH = this.worldH * this.zoom;
    this.x = scaledW <= this.viewW
      ? (scaledW - this.viewW) / 2
      : clamp(this.x, 0, scaledW - this.viewW);
    this.y = scaledH <= this.viewH
      ? (scaledH - this.viewH) / 2
      : clamp(this.y, 0, scaledH - this.viewH);
  }

  /** Зум с якорем в экранной точке (px, py) */
  zoomAt(factor, px, py) {
    const before = this.zoom;
    this.userZoom = clamp(this.userZoom * factor, CONFIG.MIN_ZOOM, CONFIG.MAX_ZOOM);
    this.applyZoom();
    const after = this.zoom;
    if (Math.abs(after - before) < 1e-6) return;
    // мировая точка под пальцем должна остаться под пальцем
    const wx = this.x + px / before;
    const wy = this.y + py / before;
    this.x = wx - px / after;
    this.y = wy - py / after;
    this.clamp();
  }

  setUserZoom(z) {
    this.userZoom = clamp(z, CONFIG.MIN_ZOOM, CONFIG.MAX_ZOOM);
    this.applyZoom();
    this.clamp();
  }

  pan(dxScreen, dyScreen) {
    this.x -= dxScreen / this.zoom;
    this.y -= dyScreen / this.zoom;
    this.clamp();
  }

  clamp() {
    const scaledW = this.worldW * this.zoom;
    const scaledH = this.worldH * this.zoom;
    if (scaledW <= this.viewW) this.x = (scaledW - this.viewW) / 2;
    else this.x = clamp(this.x, 0, scaledW - this.viewW);
    if (scaledH <= this.viewH) this.y = (scaledH - this.viewH) / 2;
    else this.y = clamp(this.y, 0, scaledH - this.viewH);
  }

  screenToWorld(sx, sy, out) {
    const o = out || { x: 0, y: 0 };
    o.x = this.x + (sx - this.offX) / this.zoom;
    o.y = this.y + (sy - this.offY) / this.zoom;
    return o;
  }

  worldToScreen(wx, wy, out) {
    const o = out || { x: 0, y: 0 };
    o.x = (wx - this.x) * this.zoom + this.offX;
    o.y = (wy - this.y) * this.zoom + this.offY;
    return o;
  }

  /** Видимый мировой прямоугольник (для culling) */
  get viewRect() {
    return {
      x: this.x - 40 / this.zoom,
      y: this.y - 40 / this.zoom,
      w: this.viewW / this.zoom + 80 / this.zoom,
      h: this.viewH / this.zoom + 80 / this.zoom
    };
  }

  shake(amp = 6, time = 0.3) {
    this.shakeAmp = Math.max(this.shakeAmp, amp);
    this.shakeT = Math.max(this.shakeT, time);
  }

  update(dt) {
    if (this.shakeT > 0) {
      this.shakeT -= dt;
      const k = Math.max(0, this.shakeT) * this.shakeAmp;
      this.offX = randRange(-k, k);
      this.offY = randRange(-k, k);
      if (this.shakeT <= 0) {
        this.shakeT = 0;
        this.shakeAmp = 0;
        this.offX = 0;
        this.offY = 0;
      }
    }
  }

  /** Применить трансформацию к контексту (дальше рисуем в мировых координатах) */
  applyTransform(g, dpr) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.translate(this.offX, this.offY);
    g.scale(this.zoom, this.zoom);
    g.translate(-this.x, -this.y);
  }

  /** Сбросить трансформацию в экранные CSS-пиксели (для HUD) */
  applyScreen(g, dpr) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}

void Camera;


/* ==== js/utils/Draw.js ==== */
/* ==========================================================================
   Draw.js — примитивы интерфейса (панели, кнопки, текст, полоски).
   Всё рисуется процедурно: никаких картинок и шрифтов извне.
   Кнопки возвращают/принимают объект-описание, чтобы один и тот же объект
   использовался и для отрисовки, и для проверки попадания тапа.
   ========================================================================== */


const UI = CONFIG.UI;
const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';

function roundRect(g, x, y, w, h, r) { rr(g, x, y, w, h, r); }

function panel(g, x, y, w, h, r = 14, opts = {}) {
  g.save();
  // тень
  if (opts.shadow !== false) {
    g.shadowColor = 'rgba(0,0,0,0.45)';
    g.shadowBlur = opts.blur ?? 16;
    g.shadowOffsetY = opts.offsetY ?? 4;
  }
  rr(g, x, y, w, h, r);
  g.fillStyle = opts.fill || UI.panel;
  g.fill();
  g.shadowColor = 'transparent';
  g.shadowBlur = 0;
  g.shadowOffsetY = 0;
  if (opts.stroke !== false) {
    g.lineWidth = opts.lineWidth ?? 2;
    g.strokeStyle = opts.strokeColor || UI.panelStroke;
    g.stroke();
  }
  g.restore();
}

/**
 * Кнопка. b = { x, y, w, h, label, icon, sub, enabled, pressed, accent, r }
 * Возвращает b (тот же объект используется для hit-test).
 */
function button(g, b, opts = {}) {
  const disabled = b.enabled === false;
  const r = b.r ?? 12;
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.4)';
  g.shadowBlur = 10;
  g.shadowOffsetY = 3;
  rr(g, b.x, b.y + (b.pressed ? 2 : 0), b.w, b.h, r);
  const base = disabled ? UI.buttonDisabled
    : (b.accent ? '#3f6bb5' : (b.pressed ? UI.buttonHi : UI.button));
  g.fillStyle = typeof base === 'string' ? base : UI.button;
  g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;

  // верхний блик
  const lg = g.createLinearGradient(0, b.y, 0, b.y + b.h);
  lg.addColorStop(0, 'rgba(255,255,255,0.18)');
  lg.addColorStop(0.5, 'rgba(255,255,255,0.02)');
  lg.addColorStop(1, 'rgba(0,0,0,0.16)');
  rr(g, b.x, b.y + (b.pressed ? 2 : 0), b.w, b.h, r);
  g.fillStyle = lg;
  g.fill();

  g.lineWidth = 2;
  g.strokeStyle = disabled ? 'rgba(255,255,255,0.08)'
    : (b.accent ? 'rgba(255,210,63,0.85)' : UI.panelStroke);
  rr(g, b.x, b.y + (b.pressed ? 2 : 0), b.w, b.h, r);
  g.stroke();

  const cy = b.y + b.h / 2 + (b.pressed ? 2 : 0);
  let tx = b.x + b.w / 2;

  if (b.icon) {
    const isz = Math.min(b.h * 0.52, 26);
    const ix = b.label ? b.x + 12 + isz / 2 : b.x + b.w / 2;
    g.globalAlpha = disabled ? 0.35 : 1;
    Sprites.draw(g, b.icon, ix, cy, { scale: isz / 28 });
    if (b.label) tx = b.x + 12 + isz + 8 + (b.w - 24 - isz - 8) / 2;
    g.globalAlpha = 1;
  }

  if (b.label) {
    g.font = `${b.bold === false ? '700' : '900'} ${(b.size || Math.min(18, b.h * 0.4)).toFixed(0)}px ${FONT}`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.globalAlpha = disabled ? 0.4 : 1;
    g.fillStyle = b.color || (b.accent ? UI.accent : UI.text);
    g.fillText(b.label, tx, cy - (b.sub ? 7 : 0));
    if (b.sub) {
      g.font = `700 ${Math.max(9, (b.size || 15) * 0.62).toFixed(0)}px ${FONT}`;
      g.fillStyle = b.subColor || UI.dim;
      g.fillText(b.sub, tx, cy + 9);
    }
    g.globalAlpha = 1;
  }
  g.restore();
  return b;
}

/** Круглая иконочная кнопка (пауза, скорость) */
function roundButton(g, b) {
  const cx = b.x + b.r2, cy = b.y + b.r2;
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.4)';
  g.shadowBlur = 8;
  g.shadowOffsetY = 2;
  g.beginPath();
  g.arc(cx, cy, b.r2, 0, Math.PI * 2);
  g.fillStyle = b.enabled === false ? UI.buttonDisabled : (b.pressed ? UI.buttonHi : UI.button);
  g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.lineWidth = 2;
  g.strokeStyle = b.ring || UI.panelStroke;
  g.stroke();
  const img = b.icon ? Sprites.get(b.icon) : null;
  if (img) {
    const s = (b.r2 * 1.15) / img.width;
    g.globalAlpha = b.enabled === false ? 0.4 : 1;
    g.drawImage(img, cx - img.width * s / 2, cy - img.height * s / 2, img.width * s, img.height * s);
    g.globalAlpha = 1;
  } else if (b.label) {
    g.font = `900 ${(b.r2 * 0.85).toFixed(0)}px ${FONT}`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = b.color || UI.text;
    g.fillText(b.label, cx, cy + 1);
  }
  g.restore();
  return b;
}

function text(g, str, x, y, o = {}) {
  g.save();
  g.font = `${o.weight || 900} ${(o.size || 16)}px ${FONT}`;
  g.textAlign = o.align || 'left';
  g.textBaseline = o.baseline || 'middle';
  if (o.stroke !== false) {
    g.lineWidth = o.strokeWidth || Math.max(2, (o.size || 16) * 0.16);
    g.strokeStyle = o.strokeColor || 'rgba(0,0,0,0.6)';
    g.lineJoin = 'round';
    g.strokeText(str, x, y);
  }
  g.fillStyle = o.color || UI.text;
  if (o.alpha !== undefined) g.globalAlpha = o.alpha;
  g.fillText(str, x, y);
  g.restore();
}

function measure(g, str, size, weight = 900) {
  g.font = `${weight} ${size}px ${FONT}`;
  return g.measureText(str).width;
}

/** Полоска прогресса с рамкой */
function bar(g, x, y, w, h, value, o = {}) {
  const v = clamp(value, 0, 1);
  g.save();
  rr(g, x, y, w, h, h / 2);
  g.fillStyle = o.bg || 'rgba(0,0,0,0.5)';
  g.fill();
  if (v > 0) {
    rr(g, x + 1.5, y + 1.5, Math.max(h - 3, (w - 3) * v), h - 3, (h - 3) / 2);
    g.fillStyle = o.fill || UI.accent2;
    g.fill();
    if (o.gloss !== false) {
      rr(g, x + 1.5, y + 1.5, Math.max(h - 3, (w - 3) * v), (h - 3) * 0.45, (h - 3) / 2);
      g.fillStyle = 'rgba(255,255,255,0.22)';
      g.fill();
    }
  }
  if (o.border !== false) {
    rr(g, x, y, w, h, h / 2);
    g.lineWidth = 1.5;
    g.strokeStyle = o.border || 'rgba(255,255,255,0.22)';
    g.stroke();
  }
  g.restore();
}

/** Звёздочка рейтинга */
function star(g, x, y, r, filled, alpha = 1) {
  const img = Sprites.get(filled ? 'icon.star' : 'icon.starEmpty');
  if (!img) return;
  g.save();
  g.globalAlpha = alpha;
  g.drawImage(img, x - r, y - r, r * 2, r * 2);
  g.restore();
}

/** Логотип игры: градиентный текст с тенью и обводкой */
function logo(g, cx, cy, size, title = 'FIELD', subtitle = 'DEFENSE') {
  g.save();
  g.textAlign = 'center';
  g.textBaseline = 'middle';

  const drawWord = (word, y, s, colors) => {
    g.font = `900 ${s}px ${FONT}`;
    const w = g.measureText(word).width;
    // тень-подложка
    g.fillStyle = 'rgba(0,0,0,0.45)';
    g.fillText(word, cx + 3, y + 5);
    const lg = g.createLinearGradient(cx - w / 2, y - s / 2, cx + w / 2, y + s / 2);
    lg.addColorStop(0, colors[0]);
    lg.addColorStop(0.5, colors[1]);
    lg.addColorStop(1, colors[2]);
    g.lineWidth = Math.max(3, s * 0.09);
    g.strokeStyle = 'rgba(16,22,40,0.95)';
    g.lineJoin = 'round';
    g.strokeText(word, cx, y);
    g.fillStyle = lg;
    g.fillText(word, cx, y);
    // блик
    g.save();
    g.beginPath();
    g.rect(cx - w / 2, y - s / 2, w, s * 0.42);
    g.clip();
    g.fillStyle = 'rgba(255,255,255,0.16)';
    g.fillText(word, cx, y);
    g.restore();
  };

  drawWord(title, cy - size * 0.42, size, ['#fff6c9', '#ffd23f', '#f08a1f']);
  drawWord(subtitle, cy + size * 0.42, size * 0.72, ['#d9f4ff', '#4fd1ff', '#2b7fd4']);
  g.restore();
}

function hit(b, x, y, pad = 0) {
  if (!b) return false;
  if (b.r2 !== undefined) {
    const cx = b.x + b.r2, cy = b.y + b.r2;
    return (x - cx) ** 2 + (y - cy) ** 2 <= (b.r2 + pad) ** 2;
  }
  return x >= b.x - pad && x <= b.x + b.w + pad && y >= b.y - pad && y <= b.y + b.h + pad;
}

function icon(g, key, x, y, size = 24, alpha = 1) {
  const img = Sprites.get(key);
  if (!img) return;
  g.save();
  g.globalAlpha = alpha;
  g.drawImage(img, x - size / 2, y - size / 2, size, size);
  g.restore();
}

const Draw = {
  roundRect, panel, button, roundButton, text, measure, bar, star, logo, hit, icon, FONT
};

void Draw;


/* ==== js/utils/TouchInput.js ==== */
/* ==========================================================================
   TouchInput.js — единая обработка тач/мыши/пера.
   Жесты:
     • TAP          — короткое нажатие без смещения  → scene.onTap(x, y)
     • DRAG (1 палец) — панорама карты               → scene.onDrag(dx, dy)
     • PINCH (2 пальца) — зум                         → scene.onPinch(k, cx, cy)
     • HOVER (мышь)  — подсветка клетки               → scene.onHover(x, y)
   Все координаты — CSS-пиксели относительно canvas.
   ========================================================================== */

const TAP_MOVE_LIMIT = 12;   // px — больше считаем драгом
const TAP_TIME_LIMIT = 380;  // ms
const PINCH_MIN_DIST = 14;

class TouchInput {
  constructor(canvas) {
    this.canvas = canvas;
    this.target = null;         // активная сцена
    this.pointers = new Map();  // pointerId -> {x, y, sx, sy, t, moved}
    this.pinchDist = 0;
    this.isPinching = false;
    this.isDragging = false;
    this.dragId = null;
    this.lastX = 0;
    this.lastY = 0;
    this.hoverX = -1;
    this.hoverY = -1;
    this.enabled = true;
    this.lastActivity = performance.now();
    this.multiTapCount = 0;
    this.multiTapTimer = 0;

    this._bind();
  }

  setTarget(scene) {
    this.target = scene;
    this.pointers.clear();
    this.isPinching = false;
    this.isDragging = false;
    this.dragId = null;
  }

  _bind() {
    const c = this.canvas;
    const opts = { passive: false };

    c.addEventListener('pointerdown', (e) => this._down(e), opts);
    c.addEventListener('pointermove', (e) => this._move(e), opts);
    c.addEventListener('pointerup', (e) => this._up(e), opts);
    c.addEventListener('pointercancel', (e) => this._up(e), opts);
    c.addEventListener('pointerleave', () => { this.hoverX = -1; this.hoverY = -1; }, opts);
    // Зум колесом на десктопе
    c.addEventListener('wheel', (e) => this._wheel(e), opts);
    c.addEventListener('contextmenu', (e) => e.preventDefault());

    // Блокируем системные жесты браузера (свайп «назад», pull-to-refresh)
    document.addEventListener('gesturestart', (e) => e.preventDefault(), opts);
    document.addEventListener('touchmove', (e) => e.preventDefault(), opts);
    document.addEventListener('dblclick', (e) => e.preventDefault(), opts);

    // Клавиатура — для отладки на десктопе
    window.addEventListener('keydown', (e) => this._key(e, true));
    window.addEventListener('keyup', (e) => this._key(e, false));
  }

  _pos(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  _touch() { this.lastActivity = performance.now(); }

  _down(e) {
    if (!this.enabled) return;
    this._touch();
    e.preventDefault();
    try { this.canvas.setPointerCapture(e.pointerId); } catch (_) { /* noop */ }

    const p = this._pos(e);
    this.pointers.set(e.pointerId, {
      x: p.x, y: p.y, sx: p.x, sy: p.y, t: performance.now(), moved: false
    });

    if (this.pointers.size === 1) {
      this.dragId = e.pointerId;
      this.lastX = p.x;
      this.lastY = p.y;
      this.isDragging = false;
      this.target?.onDown?.(p.x, p.y);
    } else if (this.pointers.size === 2) {
      // переход в режим pinch — отменяем драг
      this.isDragging = false;
      this.dragId = null;
      const [a, b] = [...this.pointers.values()];
      this.pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
      this.isPinching = this.pinchDist > PINCH_MIN_DIST;
      this.target?.onDragEnd?.();
    }
  }

  _move(e) {
    if (!this.enabled) return;
    const p = this._pos(e);

    if (e.pointerType === 'mouse') {
      this.hoverX = p.x;
      this.hoverY = p.y;
      this.target?.onHover?.(p.x, p.y);
    }

    const rec = this.pointers.get(e.pointerId);
    if (!rec) return;
    this._touch();
    e.preventDefault();

    rec.x = p.x;
    rec.y = p.y;
    if (Math.hypot(p.x - rec.sx, p.y - rec.sy) > TAP_MOVE_LIMIT) rec.moved = true;

    if (this.pointers.size >= 2 && this.isPinching) {
      const [a, b] = [...this.pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      if (d > PINCH_MIN_DIST && this.pinchDist > PINCH_MIN_DIST) {
        this.target?.onPinch?.(d / this.pinchDist, cx, cy);
      }
      this.pinchDist = d;
      return;
    }

    if (this.pointers.size === 1 && rec.moved) {
      if (!this.isDragging) {
        this.isDragging = true;
        this.target?.onDragStart?.(p.x, p.y);
      }
      const dx = p.x - this.lastX;
      const dy = p.y - this.lastY;
      this.lastX = p.x;
      this.lastY = p.y;
      this.target?.onDrag?.(dx, dy, p.x, p.y);
    }
  }

  _up(e) {
    if (!this.enabled) return;
    this._touch();
    const rec = this.pointers.get(e.pointerId);
    this.pointers.delete(e.pointerId);
    try { this.canvas.releasePointerCapture(e.pointerId); } catch (_) { /* noop */ }

    if (this.pointers.size < 2) this.isPinching = false;

    if (!rec) return;

    if (this.pointers.size === 0) {
      if (this.isDragging) {
        this.isDragging = false;
        this.target?.onDragEnd?.();
      } else {
        const dt = performance.now() - rec.t;
        if (!rec.moved && dt < TAP_TIME_LIMIT) {
          // Двойной тап (для десктопа/быстрой игры)
          const now = performance.now();
          if (now - this.multiTapTimer < 300) this.multiTapCount++;
          else this.multiTapCount = 1;
          this.multiTapTimer = now;
          this.target?.onTap?.(rec.x, rec.y, this.multiTapCount);
        }
      }
      this.target?.onUp?.(rec.x, rec.y);
      this.dragId = null;
    } else {
      // Остался один палец — переустанавливаем точку отсчёта для драга
      const [rem] = [...this.pointers.values()];
      this.lastX = rem.x;
      this.lastY = rem.y;
    }
  }

  _wheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this._touch();
    const p = this._pos(e);
    const k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    this.target?.onPinch?.(k, p.x, p.y);
  }

  _key(e, down) {
    if (!down) return;
    this._touch();
    this.target?.onKey?.(e.key, e);
  }

  /** Секунд с последнего действия пользователя (для «батарейного» режима) */
  idleSeconds() {
    return (performance.now() - this.lastActivity) / 1000;
  }
}

void TouchInput;


/* ==== js/data/TowerData.js ==== */
/* ==========================================================================
   TowerData.js — таблица баланса башен.
   Числа выверены по публичным гайдам/вики жанра-первоисточника:
   цены в «долларах» маленькие ( Gatling $5, апгрейд $4 ), DPS растёт
