/* ==== js/systems/ParticleSystem.js ==== */
/* ==========================================================================
   ParticleSystem.js — пул частиц + пул всплывающих текстов урона/денег.
   Всё переиспользуется: за бой не создаётся ни одного нового объекта
   (важно для мобильного GC и стабильных 60 FPS).
   ========================================================================== */


const P_MAX = CONFIG.PARTICLE_POOL;
const T_MAX = CONFIG.TEXT_POOL;

// Типы частиц
const PT = {
  DOT: 0,       // круг
  SPARK: 1,     // вытянутая искра по направлению движения
  SMOKE: 2,     // растущее полупрозрачное облако
  SHARD: 3,     // вращающийся осколок (квадрат)
  RING: 4,      // расширяющееся кольцо
  FLAME: 5      // огонёк (жёлтый → красный → дым)
};

class ParticleSystem {
  constructor() {
    this.x = new Float32Array(P_MAX);
    this.y = new Float32Array(P_MAX);
    this.vx = new Float32Array(P_MAX);
    this.vy = new Float32Array(P_MAX);
    this.life = new Float32Array(P_MAX);
    this.maxLife = new Float32Array(P_MAX);
    this.size = new Float32Array(P_MAX);
    this.grow = new Float32Array(P_MAX);
    this.rot = new Float32Array(P_MAX);
    this.vr = new Float32Array(P_MAX);
    this.grav = new Float32Array(P_MAX);
    this.drag = new Float32Array(P_MAX);
    this.type = new Uint8Array(P_MAX);
    this.color = new Array(P_MAX).fill('#ffffff');
    this.alive = new Uint8Array(P_MAX);
    this.cursor = 0;
    this.count = 0;

    // Всплывающие тексты
    this.tx = new Float32Array(T_MAX);
    this.ty = new Float32Array(T_MAX);
    this.tvy = new Float32Array(T_MAX);
    this.tlife = new Float32Array(T_MAX);
    this.tmax = new Float32Array(T_MAX);
    this.tsize = new Float32Array(T_MAX);
    this.ttext = new Array(T_MAX).fill('');
    this.tcolor = new Array(T_MAX).fill('#fff');
    this.talive = new Uint8Array(T_MAX);
    this.tcursor = 0;
    this.tcount = 0;
  }

  /* ------------------------------ частицы ------------------------------ */

  _alloc() {
    // ищем свободный слот, иначе вытесняем самый старый (round-robin)
    for (let k = 0; k < P_MAX; k++) {
      const i = (this.cursor + k) % P_MAX;
      if (!this.alive[i]) {
        this.cursor = (i + 1) % P_MAX;
        this.alive[i] = 1;
        this.count++;
        return i;
      }
    }
    const i = this.cursor;
    this.cursor = (i + 1) % P_MAX;
    return i;
  }

  /**
   * o = { count, color | colors[], speed:[a,b], angle:[a,b] (рад), life:[a,b],
   *       size:[a,b], grow, gravity, drag, type, spin }
   */
  burst(x, y, o = {}) {
    const n = o.count ?? 8;
    const type = o.type ?? PT.DOT;
    const colors = o.colors || (o.color ? [o.color] : ['#ffffff']);
    for (let k = 0; k < n; k++) {
      const i = this._alloc();
      const a = o.angle
        ? randRange(o.angle[0], o.angle[1])
        : (o.dir !== undefined ? o.dir + randRange(-o.spread || -0.4, o.spread || 0.4) : randRange(0, Math.PI * 2));
      const sp = o.speed ? randRange(o.speed[0], o.speed[1]) : randRange(20, 80);
      this.x[i] = x + (o.jitter ? randRange(-o.jitter, o.jitter) : 0);
      this.y[i] = y + (o.jitter ? randRange(-o.jitter, o.jitter) : 0);
      this.vx[i] = Math.cos(a) * sp;
      this.vy[i] = Math.sin(a) * sp;
      this.maxLife[i] = this.life[i] = o.life ? randRange(o.life[0], o.life[1]) : randRange(0.3, 0.7);
      this.size[i] = o.size ? randRange(o.size[0], o.size[1]) : randRange(1.5, 3.5);
      this.grow[i] = o.grow ?? 0;
      this.grav[i] = o.gravity ?? 0;
      this.drag[i] = o.drag ?? 1.2;
      this.rot[i] = randRange(0, Math.PI * 2);
      this.vr[i] = o.spin ? randRange(-o.spin, o.spin) : 0;
      this.type[i] = type;
      this.color[i] = colors[(Math.random() * colors.length) | 0];
    }
  }

  /** Одиночная частица (для дымовых следов ракет, непрерывного огня) */
  emit(x, y, vx, vy, life, size, color, type = PT.SMOKE, grow = 6, gravity = -12) {
    const i = this._alloc();
    this.x[i] = x; this.y[i] = y;
    this.vx[i] = vx; this.vy[i] = vy;
    this.maxLife[i] = this.life[i] = life;
    this.size[i] = size;
    this.grow[i] = grow;
    this.grav[i] = gravity;
    this.drag[i] = 1.6;
    this.rot[i] = 0; this.vr[i] = 0;
    this.type[i] = type;
    this.color[i] = color;
  }

  /** Расширяющееся кольцо (взрыв, ударная волна) */
  ring(x, y, size, grow, life, color, width = 3) {
    const i = this._alloc();
    this.x[i] = x; this.y[i] = y;
    this.vx[i] = 0; this.vy[i] = 0;
    this.maxLife[i] = this.life[i] = life;
    this.size[i] = size;
    this.grow[i] = grow;
    this.grav[i] = 0; this.drag[i] = 0;
    this.type[i] = PT.RING;
    this.color[i] = color;
    this.rot[i] = width;   // у кольца в rot храним толщину линии
    this.vr[i] = 0;
  }

  update(dt) {
    let alive = 0;
    for (let i = 0; i < P_MAX; i++) {
      if (!this.alive[i]) continue;
      this.life[i] -= dt;
      if (this.life[i] <= 0) { this.alive[i] = 0; continue; }
      alive++;
      const d = Math.exp(-this.drag[i] * dt);
      this.vx[i] *= d;
      this.vy[i] = this.vy[i] * d + this.grav[i] * dt;
      this.x[i] += this.vx[i] * dt;
      this.y[i] += this.vy[i] * dt;
      this.size[i] += this.grow[i] * dt;
      if (this.size[i] < 0.1) this.size[i] = 0.1;
      this.rot[i] += this.vr[i] * dt;
    }
    this.count = alive;

    let talive = 0;
    for (let i = 0; i < T_MAX; i++) {
      if (!this.talive[i]) continue;
      this.tlife[i] -= dt;
      if (this.tlife[i] <= 0) { this.talive[i] = 0; continue; }
      talive++;
      this.ty[i] += this.tvy[i] * dt;
      this.tvy[i] *= Math.exp(-1.6 * dt);
    }
    this.tcount = talive;
  }

  /* ------------------------------- тексты ------------------------------ */

  spawnText(x, y, text, color = '#ffd23f', size = 13, life = 0.95) {
    let idx = -1;
    for (let k = 0; k < T_MAX; k++) {
      const i = (this.tcursor + k) % T_MAX;
      if (!this.talive[i]) { idx = i; break; }
    }
    if (idx < 0) { idx = this.tcursor; }
    this.tcursor = (idx + 1) % T_MAX;
    this.tx[idx] = x;
    this.ty[idx] = y;
    this.tvy[idx] = -34;
    this.tlife[idx] = this.tmax[idx] = life;
    this.tsize[idx] = size;
    this.ttext[idx] = text;
    this.tcolor[idx] = color;
    this.talive[idx] = 1;
  }

  /* ---------------------------- отрисовка ------------------------------ */

  render(g) {
    for (let i = 0; i < P_MAX; i++) {
      if (!this.alive[i]) continue;
      const t = clamp(this.life[i] / this.maxLife[i], 0, 1);
      const s = this.size[i];
      g.globalAlpha = this.type[i] === PT.SMOKE ? t * 0.5 : t;
      g.fillStyle = this.color[i];

      switch (this.type[i]) {
        case PT.SPARK: {
          g.save();
          g.translate(this.x[i], this.y[i]);
          g.rotate(Math.atan2(this.vy[i], this.vx[i]));
          g.fillRect(-s * 2.4, -s * 0.4, s * 4.8, s * 0.8);
          g.restore();
          break;
        }
        case PT.SMOKE: {
          g.beginPath();
          g.arc(this.x[i], this.y[i], s, 0, Math.PI * 2);
          g.fill();
          break;
        }
        case PT.SHARD: {
          g.save();
          g.translate(this.x[i], this.y[i]);
          g.rotate(this.rot[i]);
          g.fillRect(-s, -s, s * 2, s * 2);
          g.restore();
          break;
        }
        case PT.RING: {
          g.globalAlpha = t * 0.9;
          g.strokeStyle = this.color[i];
          g.lineWidth = this.rot[i] * t + 0.5;
          g.beginPath();
          g.arc(this.x[i], this.y[i], s, 0, Math.PI * 2);
          g.stroke();
          break;
        }
        case PT.FLAME: {
          g.globalAlpha = t * 0.85;
          g.beginPath();
          g.arc(this.x[i], this.y[i], s * (0.5 + t * 0.7), 0, Math.PI * 2);
          g.fill();
          break;
        }
        default: {
          g.beginPath();
          g.arc(this.x[i], this.y[i], s, 0, Math.PI * 2);
          g.fill();
        }
      }
    }
    g.globalAlpha = 1;
  }

  renderTexts(g, cam) {
    // тексты рисуем в мировом пространстве, но с постоянным экранным размером
    const inv = 1 / (cam ? cam.zoom : 1);
    for (let i = 0; i < T_MAX; i++) {
      if (!this.talive[i]) continue;
      const t = clamp(this.tlife[i] / this.tmax[i], 0, 1);
      const size = this.tsize[i] * inv;
      g.globalAlpha = t > 0.7 ? (1 - t) / 0.3 : t / 0.7;
      g.font = `900 ${size.toFixed(1)}px "Trebuchet MS", sans-serif`;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.lineWidth = size * 0.22;
      g.strokeStyle = 'rgba(0,0,0,0.65)';
      g.strokeText(this.ttext[i], this.tx[i], this.ty[i]);
      g.fillStyle = this.tcolor[i];
      g.fillText(this.ttext[i], this.tx[i], this.ty[i]);
    }
    g.globalAlpha = 1;
  }

  clear() {
    this.alive.fill(0);
    this.talive.fill(0);
    this.count = 0;
    this.tcount = 0;
  }
}

void ParticleSystem;


/* ==== js/entities/Effect.js ==== */
/* ==========================================================================
   Effect.js — пул короткоживущих визуальных эффектов.
   Объекты создаются один раз при старте и переиспользуются (без GC-пауз).

   Типы:
     LIGHTNING — цепная молния (ломаная с свечением)
     EXPLOSION — огненный шар + кольцо
     MUZZLE    — вспышка выстрела
     BUILD     — материализация башни (снизу вверх)
     SPLAT     — лужа клея на земле
     SCORCH    — подпалина
     SHOCKWAVE — тонкое быстро расширяющееся кольцо
     MUSHROOM  — ядерный гриб (вспышка → ножка → шляпка → волна)
     FLASH     — белая вспышка-экран
   ========================================================================== */


const FX = {
  LIGHTNING: 0,
  EXPLOSION: 1,
  MUZZLE: 2,
  BUILD: 3,
  SPLAT: 4,
  SCORCH: 5,
  SHOCKWAVE: 6,
  MUSHROOM: 7,
  FLASH: 8
};

const FX_MAX = CONFIG.EFFECT_POOL;
const PTS = 24;   // максимум точек ломаной молнии

class Effect {
  constructor() {
    this.active = false;
    this.type = 0;
    this.x = 0; this.y = 0;
    this.x2 = 0; this.y2 = 0;
    this.t = 0; this.life = 1;
    this.size = 10; this.size2 = 0;
    this.width = 2;
    this.angle = 0; this.arc = 1;
    this.color = '#fff'; this.color2 = '#000';
    this.pts = new Float32Array(PTS * 2);
    this.npts = 0;
    this.seed = 0;
  }
}

class EffectPool {
  constructor() {
    this.pool = new Array(FX_MAX);
    for (let i = 0; i < FX_MAX; i++) this.pool[i] = new Effect();
    this.cursor = 0;
    this.count = 0;
  }

  _alloc() {
    for (let k = 0; k < FX_MAX; k++) {
      const i = (this.cursor + k) % FX_MAX;
      if (!this.pool[i].active) { this.cursor = (i + 1) % FX_MAX; return this.pool[i]; }
    }
    const e = this.pool[this.cursor];
    this.cursor = (this.cursor + 1) % FX_MAX;
    return e;
  }

  spawn(type, o = {}) {
    const e = this._alloc();
    e.active = true;
    e.type = type;
    e.x = o.x || 0; e.y = o.y || 0;
    e.x2 = o.x2 || 0; e.y2 = o.y2 || 0;
    e.t = 0;
    e.life = o.life || 0.4;
    e.size = o.size || 12;
    e.size2 = o.size2 || 0;
    e.width = o.width || 2;
    e.angle = o.angle || 0;
    e.arc = o.arc || 1;
    e.color = o.color || '#ffffff';
    e.color2 = o.color2 || '#ff7a3c';
    e.seed = Math.random() * 1000;
    e.npts = 0;

    if (type === FX.LIGHTNING) this._buildLightning(e, o.jitter ?? 6, o.segments ?? 7);
    return e;
  }

  /** Ломаная между (x,y) и (x2,y2) с случайным смещением */
  _buildLightning(e, jitter, segments) {
    const n = clamp(segments, 2, PTS - 1);
    const dx = e.x2 - e.x, dy = e.y2 - e.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    e.npts = n + 1;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const off = (i === 0 || i === n) ? 0 : randRange(-jitter, jitter) * (1 - Math.abs(t - 0.5) * 0.6);
      e.pts[i * 2] = e.x + dx * t + nx * off;
      e.pts[i * 2 + 1] = e.y + dy * t + ny * off;
    }
  }

  update(dt) {
    let n = 0;
    for (let i = 0; i < FX_MAX; i++) {
      const e = this.pool[i];
      if (!e.active) continue;
      e.t += dt;
      if (e.t >= e.life) { e.active = false; continue; }
      n++;
    }
    this.count = n;
  }

  render(g) {
    for (let i = 0; i < FX_MAX; i++) {
      const e = this.pool[i];
      if (!e.active) continue;
      const p = e.t / e.life;             // 0..1
      switch (e.type) {
        case FX.LIGHTNING: this._lightning(g, e, p); break;
        case FX.EXPLOSION: this._explosion(g, e, p); break;
        case FX.MUZZLE: this._muzzle(g, e, p); break;
        case FX.BUILD: this._build(g, e, p); break;
        case FX.SPLAT: this._splat(g, e, p); break;
        case FX.SCORCH: this._scorch(g, e, p); break;
        case FX.SHOCKWAVE: this._shockwave(g, e, p); break;
        case FX.MUSHROOM: this._mushroom(g, e, p); break;
        case FX.FLASH: this._flash(g, e, p); break;
      }
    }
  }

  /* ------------------------------ рендеры ------------------------------ */

  _lightning(g, e, p) {
    if (e.npts < 2) return;
    const a = (1 - p) * (0.7 + 0.3 * Math.sin(e.seed + p * 60));
    g.save();
    g.globalCompositeOperation = 'lighter';
    // внешнее свечение
    g.strokeStyle = e.color2;
    g.globalAlpha = a * 0.35;
    g.lineWidth = e.width * 4.5;
    this._stroke(g, e);
    // среднее
    g.strokeStyle = e.color;
    g.globalAlpha = a * 0.75;
    g.lineWidth = e.width * 2;
    this._stroke(g, e);
    // ядро
    g.strokeStyle = '#ffffff';
    g.globalAlpha = a;
    g.lineWidth = e.width;
    this._stroke(g, e);
    g.restore();
  }

  _stroke(g, e) {
    g.beginPath();
    g.moveTo(e.pts[0], e.pts[1]);
    for (let i = 1; i < e.npts; i++) g.lineTo(e.pts[i * 2], e.pts[i * 2 + 1]);
    g.stroke();
  }

  _explosion(g, e, p) {
    const r = e.size * (0.35 + p * 0.95);
    const a = 1 - p;
    g.save();
    g.globalCompositeOperation = 'lighter';
    const lg = g.createRadialGradient(e.x, e.y, r * 0.1, e.x, e.y, r);
    lg.addColorStop(0, `rgba(255,255,240,${0.95 * a})`);
    lg.addColorStop(0.35, `rgba(255,190,80,${0.75 * a})`);
    lg.addColorStop(0.7, `rgba(255,90,30,${0.4 * a})`);
    lg.addColorStop(1, 'rgba(120,30,10,0)');
    g.fillStyle = lg;
    g.beginPath(); g.arc(e.x, e.y, r, 0, Math.PI * 2); g.fill();
    g.restore();

    // ударное кольцо
    g.save();
    g.globalAlpha = a * 0.8;
    g.strokeStyle = e.color;
    g.lineWidth = Math.max(1, e.width * (1 - p));
    g.beginPath();
    g.arc(e.x, e.y, r * 1.25, 0, Math.PI * 2);
    g.stroke();
    g.restore();
  }

  _muzzle(g, e, p) {
    const a = 1 - p;
    const r = e.size * (1 + p * 1.4);
    g.save();
    g.translate(e.x, e.y);
    g.rotate(e.angle);
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = a;
    const lg = g.createRadialGradient(0, 0, 0.5, 0, 0, r);
    lg.addColorStop(0, 'rgba(255,255,235,0.95)');
    lg.addColorStop(0.45, 'rgba(255,200,90,0.55)');
    lg.addColorStop(1, 'rgba(255,140,40,0)');
    g.fillStyle = lg;
    g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
    // «звезда» вспышки
    g.fillStyle = `rgba(255,240,200,${0.85 * a})`;
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(r * 1.5, -r * 0.28);
    g.lineTo(r * 1.9, 0);
    g.lineTo(r * 1.5, r * 0.28);
    g.closePath();
    g.fill();
    g.restore();
  }

  _build(g, e, p) {
    // столб света снизу вверх + кольцо у основания
    const h = e.size2 || 60;
    const a = Math.sin(clamp(p, 0, 1) * Math.PI);
    g.save();
    g.globalCompositeOperation = 'lighter';
    const lg = g.createLinearGradient(e.x, e.y + 8, e.x, e.y + 8 - h);
    lg.addColorStop(0, `rgba(140,220,255,${0.5 * a})`);
    lg.addColorStop(1, 'rgba(140,220,255,0)');
    g.fillStyle = lg;
    const w = e.size * (1 - p * 0.55);
    g.fillRect(e.x - w / 2, e.y + 8 - h, w, h);
    g.strokeStyle = `rgba(190,240,255,${0.8 * a})`;
    g.lineWidth = 2.4;
    g.beginPath();
    g.ellipse(e.x, e.y + 8, e.size * (0.5 + p * 1.1), e.size * (0.22 + p * 0.45), 0, 0, Math.PI * 2);
    g.stroke();
    g.restore();
  }

  _splat(g, e, p) {
    const a = clamp(1 - p * p, 0, 1) * 0.75;
    g.save();
    g.globalAlpha = a;
    g.fillStyle = e.color;
    g.beginPath();
    g.ellipse(e.x, e.y, e.size * (0.6 + p * 0.5), e.size * (0.3 + p * 0.25), e.angle, 0, Math.PI * 2);
    g.fill();
    g.globalAlpha = a * 0.5;
    g.fillStyle = '#ffffff';
    g.beginPath();
    g.ellipse(e.x - e.size * 0.2, e.y - e.size * 0.1, e.size * 0.18, e.size * 0.09, 0, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  _scorch(g, e, p) {
    const a = clamp(1 - p, 0, 1) * 0.55;
    g.save();
    g.globalAlpha = a;
    g.fillStyle = '#1b1512';
    g.beginPath();
    g.ellipse(e.x, e.y, e.size, e.size * 0.55, e.angle, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  _shockwave(g, e, p) {
    const a = (1 - p) * 0.85;
    const r = e.size + (e.size2 - e.size) * p;
    g.save();
    g.globalAlpha = a;
    g.strokeStyle = e.color;
    g.lineWidth = Math.max(1, e.width * (1 - p * 0.8));
    g.beginPath();
    g.arc(e.x, e.y, r, 0, Math.PI * 2);
    g.stroke();
    g.restore();
  }

  _mushroom(g, e, p) {
    const R = e.size;
    g.save();
    // 1) ослепляющая вспышка
    if (p < 0.22) {
      const a = 1 - p / 0.22;
      g.globalCompositeOperation = 'lighter';
      const lg = g.createRadialGradient(e.x, e.y, 1, e.x, e.y, R * (0.4 + p * 3));
      lg.addColorStop(0, `rgba(255,255,240,${a})`);
      lg.addColorStop(0.5, `rgba(255,190,90,${a * 0.55})`);
      lg.addColorStop(1, 'rgba(255,120,40,0)');
      g.fillStyle = lg;
      g.beginPath(); g.arc(e.x, e.y, R * (0.4 + p * 3), 0, Math.PI * 2); g.fill();
    }
    // 2) ножка
    const stemH = R * 1.5 * clamp(p * 1.6, 0, 1);
    const stemW = R * 0.32 * (1 - p * 0.35);
    const lg2 = g.createLinearGradient(e.x - stemW, 0, e.x + stemW, 0);
    lg2.addColorStop(0, 'rgba(120,60,30,0.75)');
    lg2.addColorStop(0.4, 'rgba(255,200,120,0.9)');
    lg2.addColorStop(1, 'rgba(110,50,25,0.7)');
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = clamp(1.25 - p, 0, 1);
    g.fillStyle = lg2;
    g.beginPath();
    g.moveTo(e.x - stemW, e.y);
    g.quadraticCurveTo(e.x - stemW * 0.5, e.y - stemH * 0.6, e.x - stemW * 1.1, e.y - stemH);
    g.lineTo(e.x + stemW * 1.1, e.y - stemH);
    g.quadraticCurveTo(e.x + stemW * 0.5, e.y - stemH * 0.6, e.x + stemW, e.y);
    g.closePath();
    g.fill();
    // 3) шляпка
    if (p > 0.14) {
      const capP = clamp((p - 0.14) / 0.5, 0, 1);
      const capR = R * (0.5 + capP * 0.85);
      const cy = e.y - stemH;
      const lg3 = g.createRadialGradient(e.x - capR * 0.25, cy - capR * 0.3, capR * 0.1, e.x, cy, capR);
      lg3.addColorStop(0, 'rgba(255,240,190,0.95)');
      lg3.addColorStop(0.45, 'rgba(255,150,60,0.9)');
      lg3.addColorStop(1, 'rgba(120,50,25,0.55)');
      g.fillStyle = lg3;
      g.beginPath();
      g.ellipse(e.x, cy, capR, capR * 0.72, 0, 0, Math.PI * 2);
      g.fill();
      // клубы
      g.globalAlpha = clamp(1.25 - p, 0, 1) * 0.6;
      g.fillStyle = 'rgba(90,60,50,0.7)';
      for (let i = 0; i < 5; i++) {
        const a = e.seed + i * 1.7 + p * 2;
        g.beginPath();
        g.arc(e.x + Math.cos(a) * capR * 0.7, cy + Math.sin(a) * capR * 0.4, capR * 0.28, 0, Math.PI * 2);
        g.fill();
      }
    }
    g.restore();
  }

  _flash(g, e, p) {
    g.save();
    g.globalAlpha = (1 - p) * 0.6;
    g.fillStyle = e.color;
    g.fillRect(e.x - e.size, e.y - e.size, e.size * 2, e.size * 2);
    g.restore();
  }

  clear() {
    for (let i = 0; i < FX_MAX; i++) this.pool[i].active = false;
    this.count = 0;
  }
}

void EffectPool;


/* ==== js/entities/Projectile.js ==== */
/* ==========================================================================
   Projectile.js — пул снарядов.

   Типы:
     BULLET  — быстрая трассирующая пуля (гатлинг), попадание по достижении
     MISSILE — самонаводящаяся ракета: каждый шаг доворачивает угол к цели
               (rotateTowards с ограничением угловой скорости), взрыв по площади
     GLUE    — комок клея: замедляет цель и (на 2–3 уровнях) соседей
     BEE     — пчела из улья: догоняет цель, кусает и возвращается к башне

   Все объекты переиспользуются — за бой не создаётся новых.
   ========================================================================== */


const PROJ = {
  BULLET: 0,
  MISSILE: 1,
  GLUE: 2,
  BEE: 3,
  SHELL: 4
};

const PROJ_MAX = CONFIG.PROJECTILE_POOL;

class Projectile {
  constructor() {
    this.active = false;
    this.type = 0;
    this.x = 0; this.y = 0;
    this.vx = 0; this.vy = 0;
    this.angle = 0;
    this.speed = 300;
    this.turn = 6;            // рад/с (для homing)
    this.target = null;
    this.damage = 0;
    this.splash = 0;
    this.damageType = 'physical';
    this.pierceArmor = 0;
    this.life = 2;
    this.t = 0;
    this.owner = null;
    this.slow = 0;
    this.slowTime = 0;
    this.slowTargets = 1;
    this.trail = 0;
    this.size = 1;
    this.color = '#ffd23f';
    this.homing = false;
    this.returning = false;
    this.homeX = 0; this.homeY = 0;
    this.hitRadius = 4;
    this.dead = false;
  }
}

class ProjectilePool {
  constructor(game) {
    this.game = game;
    this.pool = new Array(PROJ_MAX);
    for (let i = 0; i < PROJ_MAX; i++) this.pool[i] = new Projectile();
    this.cursor = 0;
    this.count = 0;
  }

  _alloc() {
    for (let k = 0; k < PROJ_MAX; k++) {
      const i = (this.cursor + k) % PROJ_MAX;
      if (!this.pool[i].active) { this.cursor = (i + 1) % PROJ_MAX; return this.pool[i]; }
    }
    const p = this.pool[this.cursor];
    this.cursor = (this.cursor + 1) % PROJ_MAX;
    return p;
  }

  /**
   * o = { type, x, y, target, speed, damage, splash, damageType, pierceArmor,
   *       slow, slowTime, slowTargets, owner, color, size, turn, life, angle }
   */
  spawn(o) {
    const p = this._alloc();
    p.active = true;
    p.dead = false;
    p.type = o.type ?? PROJ.BULLET;
    p.x = o.x; p.y = o.y;
    p.target = o.target || null;
    p.speed = o.speed ?? 480;
    p.damage = o.damage ?? 1;
    p.splash = o.splash ?? 0;
    p.damageType = o.damageType ?? 'physical';
    p.pierceArmor = o.pierceArmor ?? 0;
    p.slow = o.slow ?? 0;
    p.slowTime = o.slowTime ?? 0;
    p.slowTargets = o.slowTargets ?? 1;
    p.owner = o.owner || null;
    p.color = o.color ?? '#ffd23f';
    p.size = o.size ?? 1;
    p.turn = o.turn ?? 6;
    p.life = o.life ?? 2.5;
    p.t = 0;
    p.trail = 0;
    p.homing = p.type === PROJ.MISSILE || p.type === PROJ.BEE || !!o.homing;
    p.returning = false;
    p.homeX = o.homeX ?? p.x;
    p.homeY = o.homeY ?? p.y;
    p.hitRadius = o.hitRadius ?? 4;
    p.angle = o.angle !== undefined
      ? o.angle
      : (p.target ? Math.atan2(p.target.y - p.y, p.target.x - p.x) : 0);
    const s = Math.sin(p.angle), c = Math.cos(p.angle);
    p.vx = c * p.speed;
    p.vy = s * p.speed;
    return p;
  }

  update(dt) {
    const g = this.game;
    let n = 0;
    for (let i = 0; i < PROJ_MAX; i++) {
      const p = this.pool[i];
      if (!p.active) continue;
      p.t += dt;
      if (p.t > p.life) { p.active = false; continue; }
      n++;

      // ---- наведение ----
      if (p.homing && !p.returning) {
        const tgt = p.target;
        if (!tgt || !tgt.alive) {
          // цель мертва: ракета летит прямо и взрывается в конце жизни
          if (p.type === PROJ.MISSILE) p.life = Math.min(p.life, p.t + 0.22);
          p.homing = false;
        } else {
          const want = Math.atan2(tgt.y - p.y, tgt.x - p.x);
          p.angle = rotateTowards(p.angle, want, p.turn * dt);
          p.vx = Math.cos(p.angle) * p.speed;
          p.vy = Math.sin(p.angle) * p.speed;
        }
      }

      // ---- движение ----
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // ---- следы ----
      if (p.type === PROJ.MISSILE) {
        p.trail -= dt;
        if (p.trail <= 0) {
          p.trail = 0.016;
          g.particles.emit(
            p.x - Math.cos(p.angle) * 6, p.y - Math.sin(p.angle) * 6,
            randRange(-12, 12), randRange(-16, 4),
            randRange(0.3, 0.6), randRange(1.6, 3.2),
            Math.random() < 0.5 ? '#d8d8d8' : '#ffb46b',
            PT.SMOKE, 9, -8
          );
        }
      } else if (p.type === PROJ.BULLET) {
        p.trail -= dt;
        if (p.trail <= 0) {
          p.trail = 0.03;
          g.particles.emit(p.x, p.y, 0, 0, 0.09, 1.3, 'rgba(255,220,140,0.9)', PT.DOT, 0, 0);
        }
      }

      // ---- возвращение пчелы ----
      if (p.returning) {
        const d = dist(p.x, p.y, p.homeX, p.homeY);
        if (d < 8) { p.active = false; continue; }
        const want = Math.atan2(p.homeY - p.y, p.homeX - p.x);
        p.angle = rotateTowards(p.angle, want, p.turn * dt);
        p.vx = Math.cos(p.angle) * p.speed;
        p.vy = Math.sin(p.angle) * p.speed;
        continue;
      }

      // ---- попадание ----
      const tgt = p.target;
      if (tgt && tgt.alive) {
        const rr = tgt.radius + p.hitRadius;
        if (dist(p.x, p.y, tgt.x, tgt.y) <= rr) {
          this._impact(p, tgt);
          continue;
        }
      } else if (!p.homing) {
        // без цели снаряд просто гаснет (пули летят строго в свою цель)
        p.active = false;
        continue;
      }

      // вылет за пределы мира
      if (p.x < -60 || p.y < -60 || p.x > g.worldW + 60 || p.y > g.worldH + 60) {
        p.active = false;
      }
    }
    this.count = n;
  }

  _impact(p, tgt) {
    const g = this.game;
    switch (p.type) {
      case PROJ.BULLET: {
        g.damageEnemy(tgt, p.damage, p.damageType, { pierceArmor: p.pierceArmor, source: p.owner });
        g.particles.burst(p.x, p.y, {
          count: 3, colors: ['#fff2b0', '#ffb45a'], speed: [20, 70],
          life: [0.1, 0.22], size: [0.8, 1.8], type: PT.SPARK, drag: 3
        });
        p.active = false;
        break;
      }
      case PROJ.MISSILE: {
        this.explode(p, p.x, p.y);
        p.active = false;
        break;
      }
      case PROJ.GLUE: {
        g.effects.spawn(4 /* SPLAT */, {
          x: tgt.x, y: tgt.y + tgt.radius * 0.5, size: tgt.radius * 1.5,
          life: Math.max(0.6, p.slowTime * 0.5), color: 'rgba(110,215,250,0.85)',
          angle: randRange(0, Math.PI)
        });
        // основная цель
        tgt.applySlow(p.slow, p.slowTime);
        if (p.damage > 0) g.damageEnemy(tgt, p.damage, p.damageType, { source: p.owner });
        // соседи (сплэш-замедление на 2–3 уровне)
        if (p.slowTargets > 1 && p.splash > 0) {
          const near = g.collision.queryCircle(tgt.x, tgt.y, p.splash, true);
          let c = 0;
          for (let i = 0; i < near.length && c < p.slowTargets; i++) {
            const e = near[i];
            if (e === tgt || !e.alive) continue;
            e.applySlow(p.slow * 0.85, p.slowTime * 0.85);
            c++;
            g.effects.spawn(4, {
              x: e.x, y: e.y + e.radius * 0.5, size: e.radius * 1.3,
              life: 0.5, color: 'rgba(110,215,250,0.7)'
            });
          }
        }
        g.particles.burst(p.x, p.y, {
          count: 9, colors: ['#bff0ff', '#63cdf2', '#e6fbff'], speed: [25, 85],
          life: [0.25, 0.5], size: [1.5, 3.4], gravity: 90, drag: 2
        });
        p.active = false;
        break;
      }
      case PROJ.BEE: {
        g.damageEnemy(tgt, p.damage, p.damageType, { source: p.owner });
        g.particles.burst(p.x, p.y, { count: 3, colors: ['#ffe66d', '#c9a227'], speed: [20, 60], life: [0.1, 0.25], size: [1, 2] });
        // пчела возвращается к улью
        p.returning = true;
        p.homing = false;
        p.target = null;
        p.speed *= 1.25;
        p.life = p.t + 3;
        break;
      }
      default: {
        g.damageEnemy(tgt, p.damage, p.damageType, { source: p.owner });
        p.active = false;
      }
    }
  }

  /** Взрыв с уроном по площади (ракеты, ядерный заряд) */
  explode(p, x, y) {
    const g = this.game;
    const big = p.splash > 70;
    g.effects.spawn(1 /* EXPLOSION */, {
      x, y, size: Math.max(10, p.splash * 0.85), life: big ? 0.62 : 0.34,
      color: '#ffd9a0', width: big ? 4 : 2.4
    });
    g.effects.spawn(6 /* SHOCKWAVE */, {
      x, y, size: p.splash * 0.4, size2: p.splash * (big ? 1.9 : 1.35),
      life: big ? 0.5 : 0.28, color: 'rgba(255,220,170,0.9)', width: big ? 5 : 3
    });
    g.particles.burst(x, y, {
      count: big ? 34 : 16,
      colors: ['#fff0b0', '#ffb45a', '#ff6b2c', '#7a3a20'],
      speed: big ? [60, 260] : [40, 150],
      life: [0.25, 0.7], size: [1.5, 4], gravity: 40, drag: 1.8, type: PT.DOT
    });
    g.particles.burst(x, y, {
      count: big ? 16 : 8, colors: ['#6b6b6b', '#8d8d8d'],
      speed: [15, 60], life: [0.6, 1.2], size: [3, 7], gravity: -14, drag: 1.1, type: PT.SMOKE
    });
    g.effects.spawn(5 /* SCORCH */, {
      x, y: y + 2, size: p.splash * 0.55, life: big ? 6 : 3, angle: randRange(0, 3)
    });
    g.audio?.play(big ? 'nuke' : 'explosion', { big });
    if (big) g.camera?.shake(9, 0.5);
    else g.camera?.shake(2.2, 0.16);

    // урон по площади с затуханием к краю
    const list = g.collision.queryCircle(x, y, p.splash, false);
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e.alive) continue;
      const d = dist(x, y, e.x, e.y);
      const k = clamp(1 - (d / (p.splash + e.radius)) * 0.65, 0.35, 1);
      g.damageEnemy(e, p.damage * k, p.damageType, { pierceArmor: p.pierceArmor, source: p.owner });
    }
  }

  render(g) {
    for (let i = 0; i < PROJ_MAX; i++) {
      const p = this.pool[i];
      if (!p.active) continue;
      switch (p.type) {
        case PROJ.BULLET: {
          // трассер: вытянутая светящаяся полоска
          g.save();
          g.globalCompositeOperation = 'lighter';
          g.translate(p.x, p.y);
          g.rotate(p.angle);
          const len = 8 * p.size;
          const lg = g.createLinearGradient(-len, 0, len * 0.6, 0);
          lg.addColorStop(0, 'rgba(255,180,80,0)');
          lg.addColorStop(0.6, 'rgba(255,220,140,0.85)');
          lg.addColorStop(1, 'rgba(255,255,235,1)');
          g.fillStyle = lg;
          g.fillRect(-len, -1.1 * p.size, len * 1.6, 2.2 * p.size);
          g.restore();
          break;
        }
        case PROJ.MISSILE: {
          Sprites.draw(g, 'proj.missile', p.x, p.y, { rot: p.angle, scale: 0.95 * p.size });
          break;
        }
        case PROJ.GLUE: {
          Sprites.draw(g, 'proj.glue', p.x, p.y, { rot: p.angle, scale: p.size });
          break;
        }
        case PROJ.BEE: {
          const wob = Math.sin(p.t * 40) * 2.2;
          Sprites.draw(g, 'proj.bee', p.x, p.y + wob, { rot: p.angle, scale: p.size });
          break;
        }
        default: {
          g.fillStyle = p.color;
          g.beginPath(); g.arc(p.x, p.y, 2.5 * p.size, 0, Math.PI * 2); g.fill();
        }
      }
    }
  }

  clear() {
    for (let i = 0; i < PROJ_MAX; i++) this.pool[i].active = false;
    this.count = 0;
  }
}

void ProjectilePool;


/* ==== js/entities/Tower.js ==== */
/* ==========================================================================
   Tower.js — базовый класс башни.

   Ответственность базы:
     • хранение уровня, цены, вложенных денег
     • выбор цели по режиму (FIRST / LAST / STRONGEST / WEAKEST / CLOSEST)
     • поворот турели с ограничением угловой скорости
     • откат перезарядки, отдача, анимация постройки
     • отрисовка: плита + турель + обводка уровня + радиус при выделении

   Подклассы переопределяют fire(target) — саму механику выстрела.
   ========================================================================== */


class Tower {
  /**
   * @param {GameScene} game
   * @param {object} def — запись из TOWER_DEFS
   * @param {number} cx, cy — клетка сетки
   */
  constructor(game, def, cx, cy) {
    this.game = game;
    this.def = def;
    this.id = def.id;
    this.cx = cx;
    this.cy = cy;
    this.x = cx * CELL + CELL / 2;
    this.y = cy * CELL + CELL / 2;

    this.level = 1;
    this.invested = def.cost;
    this.targetMode = TARGET_MODE.FIRST;

    this.cooldown = 0;
    this.angle = -Math.PI / 2;      // турель смотрит «вверх»
    this.recoil = 0;
    this.spin = 0;                  // для вращающихся стволов
    this.buildAnim = 1;             // 1 → 0: материализация
    this.selected = false;
    this.target = null;
    this.firing = 0;                // >0 — визуально стреляет
    this.shotsFired = 0;
    this.damageDealt = 0;
    this.kills = 0;
    this.timeAlive = 0;
    this.pulse = Math.random() * 6; // фаза для «дыхания» подсветки

    this.applyLevel();
  }

  /** Подтянуть параметры текущего уровня из таблиц */
  applyLevel() {
    const d = this.def;
    const i = this.level - 1;
    this.damage = d.dmg[i];
    this.rate = d.rate[i];
    this.range = d.range[i];
    this.interval = 1 / Math.max(0.01, this.rate);
    this.splash = d.splash ? d.splash[i] : 0;
    this.slow = d.slow ? d.slow[i] : 0;
    this.slowTime = d.slowTime ? d.slowTime[i] : 0;
    this.chain = d.chain ? d.chain[i] : 0;
    this.cone = d.cone ? d.cone[i] * Math.PI / 180 : 0;
    this.bees = d.bees ? d.bees[i] : 0;
    this.dpsRef = d.dps ? d.dps[i] : this.damage * this.rate;
  }

  get canTargetAir() { return this.def.targets === 'both'; }
  get name() { return this.def.name; }

  /** Точка поворота турели внутри спрайта (у каждого типа своя) */
  get turretPivot() { return [26, 26]; }

  /** Позиция дула в мировых координатах (для вспышек и спавна снарядов) */
  muzzle(out) {
    const o = out || { x: 0, y: 0 };
    const d = this.def.muzzleDist ?? 18;
    o.x = this.x + Math.cos(this.angle) * d;
    o.y = this.y + Math.sin(this.angle) * d;
    return o;
  }

  /* ----------------------------- выбор цели ---------------------------- */

  canTarget(e) {
    if (!e || !e.alive) return false;
    if (e.flying && !this.canTargetAir) return false;
    if (e.invuln > 0) return false;
    return true;
  }

  /** Найти цель в радиусе по текущему режиму прицеливания */
  findTarget() {
    const g = this.game;
    const list = g.collision.queryCircle(this.x, this.y, this.range, !this.canTargetAir);
    if (!list.length) return null;

    let best = null;
    let bestScore = -Infinity;
    const mode = this.targetMode;

    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!this.canTarget(e)) continue;
      let s;
      switch (mode) {
        case TARGET_MODE.LAST: s = -e.progress; break;
        case TARGET_MODE.STRONGEST: s = e.hp; break;
        case TARGET_MODE.WEAKEST: s = -e.hp; break;
        case TARGET_MODE.CLOSEST: s = -dist(this.x, this.y, e.x, e.y); break;
        case TARGET_MODE.FIRST:
        default: s = e.progress; break;
      }
      if (s > bestScore) { bestScore = s; best = e; }
    }
    return best;
  }

  /* ------------------------------- апдейт ------------------------------ */

  update(dt) {
    this.timeAlive += dt;
    this.pulse += dt;
    if (this.buildAnim > 0) this.buildAnim = Math.max(0, this.buildAnim - dt / 0.45);
    if (this.recoil > 0) this.recoil = Math.max(0, this.recoil - dt * 14);
    if (this.firing > 0) this.firing = Math.max(0, this.firing - dt * 6);
    this.cooldown -= dt;

    const target = this.findTarget();
    this.target = target;
    if (!target) {
      // вхолостую турель медленно возвращается «на север»
      this.angle = rotateTowards(this.angle, -Math.PI / 2, (this.def.turnSpeed || 6) * dt * 0.35);
      return;
    }

    // доворот к цели
    const want = Math.atan2(target.y - this.y, target.x - this.x);
    const before = this.angle;
    this.angle = rotateTowards(this.angle, want, (this.def.turnSpeed || 6) * dt);
    const aligned = Math.abs(normAngle(want - this.angle)) < 0.3;

    if (this.cooldown <= 0 && aligned && this.buildAnim < 0.55) {
      this.fire(target);
      this.cooldown = this.interval;
      this.shotsFired++;
      this.recoil = this.def.recoil ?? 1.5;
      this.firing = 1;
    } else if (!aligned && this.cooldown < -0.4) {
      this.cooldown = -0.4;
    }
    // вращение блока стволов у гатлинга
    if (this.def.behavior === 'gatling') {
      this.spin += dt * (this.firing > 0 ? 26 : lerp(6, 0, 0.5));
    }
    void before;
  }

  /** Базовый выстрел — пуля. Подклассы переопределяют. */
  fire(target) {
    const m = this.muzzle({ x: 0, y: 0 });
    this.game.projectiles.spawn({
      type: PROJ.BULLET,
      x: m.x, y: m.y,
      target,
      speed: 640,
      damage: this.damage,
      damageType: this.def.damageType,
      owner: this,
      color: this.def.accent,
      life: 1.2
    });
    this.game.audio?.play(this.def.sfx || 'shot');
  }

  /** Урон засчитан башне (для статистики) */
  registerDamage(amount) { this.damageDealt += amount; }
  registerKill() { this.kills++; }

  /* ------------------------------ отрисовка ---------------------------- */

  render(g, time) {
    const grow = 1 - this.buildAnim;                 // 0 → 1
    const s = 0.55 + 0.45 * clamp(grow * 1.25, 0, 1);
    const lift = (1 - clamp(grow * 1.4, 0, 1)) * 10;

    g.save();
    g.translate(this.x, this.y + lift);

    // плита
    g.globalAlpha = clamp(grow * 2, 0, 1);
    Sprites.draw(g, `tower.base.${this.level - 1}`, 0, 0, { scale: s });
    g.globalAlpha = 1;

    // турель
    const img = Sprites.get(`tower.${this.def.behavior}.${this.level - 1}`);
    if (img) {
      const [px, py] = this.turretPivot;
      const rec = this.recoil;
      g.save();
      g.rotate(this.angle);
      g.translate(-rec, 0);
      g.drawImage(img, -px * s, -py * s, img.width * s, img.height * s);
      g.restore();
    }

    // подсветка уровня 3 (золотое «дыхание»)
    if (this.level === 3) {
      const a = 0.16 + 0.1 * Math.sin(this.pulse * 2.4);
      g.globalAlpha = a;
      g.strokeStyle = '#ffd23f';
      g.lineWidth = 2;
      g.beginPath();
      g.arc(0, 0, 19, 0, Math.PI * 2);
      g.stroke();
      g.globalAlpha = 1;
    }

    g.restore();

    // кольцо «строится»
    if (this.buildAnim > 0) {
      g.save();
      g.globalAlpha = this.buildAnim * 0.8;
      g.strokeStyle = '#8ce8ff';
      g.lineWidth = 2;
      g.beginPath();
      g.ellipse(this.x, this.y + 10, 20 * (1.4 - this.buildAnim * 0.4), 9 * (1.4 - this.buildAnim * 0.4), 0, 0, Math.PI * 2);
      g.stroke();
      g.restore();
    }
    void time;
  }

  /** Круг радиуса (при выделении/постройке) */
  renderRange(g, color = 'rgba(120,220,255,0.85)', fill = 'rgba(90,190,255,0.10)') {
    g.save();
    g.beginPath();
    g.arc(this.x, this.y, this.range, 0, Math.PI * 2);
    g.fillStyle = fill;
    g.fill();
    g.setLineDash([7, 6]);
    g.lineDashOffset = -(this.game.time || 0) * 22;
    g.lineWidth = 2;
    g.strokeStyle = color;
    g.stroke();
    g.setLineDash([]);
    g.restore();
  }
}

/* ==========================================================================
   Фабрика: behavior-строка из TOWER_DEFS → класс
   ========================================================================== */

const TOWER_REGISTRY = Object.create(null);

function registerTower(behavior, cls) { TOWER_REGISTRY[behavior] = cls; }

/**
 * Создать башню по её определению. Фабрика живёт в towers/index.js —
 * она импортирует все подклассы (и тем самым регистрирует их).
 */
function createTowerHere(game, def, cx, cy) {
  const Cls = TOWER_REGISTRY[def.behavior] || Tower;
  return new Cls(game, def, cx, cy);
}

function towerSupported(def) { return !!TOWER_REGISTRY[def.behavior]; }

void Tower;


/* ==== js/entities/towers/GatlingTower.js ==== */
/* ==========================================================================
   GatlingTower.js — пулемётная башня.
   Самая дешёвая ($5, апгрейд $4), DPS 35/70/105, радиус 2.5 клетки.
   Механика: быстрые трассирующие пули (почти hitscan), вращающийся блок
   стволов, вспышка выстрела, вылет гильз, отдача корпуса.
   ========================================================================== */


class GatlingTower extends Tower {
  get turretPivot() { return [21, 26]; }

  fire(target) {
    const g = this.game;
    const m = this.muzzle({ x: 0, y: 0 });
    const spread = this.def.spread || 0.05;
    const a = this.angle + (Math.random() - 0.5) * spread;

    g.projectiles.spawn({
      type: PROJ.BULLET,
      x: m.x, y: m.y,
      target,
      angle: a,
      speed: 680,
      damage: this.damage * randRange(0.92, 1.08),
      damageType: this.def.damageType,
      owner: this,
      life: 0.9,
      size: 0.9 + this.level * 0.12
    });

    g.effects.spawn(FX.MUZZLE, {
      x: m.x, y: m.y, angle: a, size: 5 + this.level, life: 0.07, color: '#fff2c0'
    });

    // гильза вылетает вбок-назад
    g.particles.emit(
      this.x - Math.cos(this.angle) * 6 + randRange(-4, 4),
      this.y - Math.sin(this.angle) * 6,
      randRange(-45, -12), randRange(-75, -22),
      0.5, 1.4, '#d8b45a', PT.SHARD, 0, 240
    );

    g.audio?.play('shot');
  }
}

registerTower('gatling', GatlingTower);
void GatlingTower;

/* ==== js/entities/towers/MissileTower.js ==== */
/* ==========================================================================
   MissileTower.js — ракетная башня ($20, апгрейд $15).
   Самонаводящаяся ракета: каждый шаг доворачивает угол к цели с ограничением
   угловой скорости (rotateTowards), оставляет дымный след, взрывается
   по площади. Бьёт и по наземным, и по воздушным целям.
   ========================================================================== */


class MissileTower extends Tower {
  get turretPivot() { return [18, 32]; }

  fire(target) {
    const g = this.game;
    const d = this.def;
    const a = this.angle - 0.42;              // пакет труб наклонён вверх
    const mx = this.x + Math.cos(this.angle) * 16;
    const my = this.y + Math.sin(this.angle) * 16 - 6;

    g.projectiles.spawn({
      type: PROJ.MISSILE,
      x: mx, y: my,
      target,
      angle: a,
      speed: d.projSpeed || 210,
      turn: d.projTurn || 4.2,
      damage: this.damage,
      splash: this.splash,
      damageType: d.damageType,
      owner: this,
      size: 0.9 + this.level * 0.1,
      life: 3.2,
      hitRadius: 5
    });

    // выхлоп при пуске
    g.particles.burst(mx, my, {
      count: 10, colors: ['#e8e8e8', '#b9b9b9', '#ffb46b'],
      speed: [15, 70], life: [0.3, 0.8], size: [2.5, 6],
      gravity: -10, drag: 2.2, type: PT.SMOKE, dir: a + Math.PI, spread: 0.9
    });
    g.effects.spawn(FX.MUZZLE, { x: mx, y: my, angle: a, size: 9, life: 0.1, color: '#ffd9a0' });
    g.camera?.shake(1.4, 0.1);
    g.audio?.play('missile');
    void randRange;
  }
}

registerTower('missile', MissileTower);
void MissileTower;


/* ==== js/entities/towers/TeslaTower.js ==== */
/* ==========================================================================
   TeslaTower.js — электрическая башня ($70, апгрейд $50).
   Мгновенный разряд без снаряда: 2 разряда/с × 350/700/1050 урона
   → 700/1400/2100 DPS по одной цели. Молния перескакивает на 2/3/4 цели,
   каждая следующая получает 75% урона предыдущей. Пробивает 60% брони.
   ========================================================================== */


class TeslaTower extends Tower {
  get turretPivot() { return [24, 29]; }

  fire(target) {
    const g = this.game;
    const d = this.def;
    const maxChain = this.chain || 1;
    const falloff = d.chainFalloff ?? 0.75;
    const chainRange = d.chainRange ?? 70;

    const hit = [];
    let cur = target;
    let dmg = this.damage;
    let fromX = this.x + Math.cos(this.angle) * 6;
    let fromY = this.y - 16;      // разрядный шар над катушкой

    for (let k = 0; k < maxChain && cur; k++) {
      hit.push(cur);

      g.effects.spawn(FX.LIGHTNING, {
        x: fromX, y: fromY, x2: cur.x, y2: cur.y,
        life: 0.16 + k * 0.02, width: 2.4 - k * 0.3,
        color: '#eaf9ff', color2: '#5aa8ff', jitter: 7 - k
      });

      g.damageEnemy(cur, dmg, d.damageType, { pierceArmor: d.pierceArmor || 0, source: this });

      g.particles.burst(cur.x, cur.y, {
        count: 6, colors: ['#ffffff', '#9fe8ff', '#5aa8ff'],
        speed: [40, 150], life: [0.12, 0.3], size: [0.8, 2], type: PT.SPARK, drag: 4
      });

      // следующая цель цепи — ближайшая ещё не поражённая
      fromX = cur.x; fromY = cur.y;
      dmg *= falloff;
      const near = g.collision.queryCircle(fromX, fromY, chainRange, false);
      let next = null, bestD = Infinity;
      for (let i = 0; i < near.length; i++) {
        const e = near[i];
        if (!this.canTarget(e) || hit.indexOf(e) !== -1) continue;
        const dd = dist(fromX, fromY, e.x, e.y);
        if (dd < bestD) { bestD = dd; next = e; }
      }
      cur = next;
    }

    g.effects.spawn(FX.MUZZLE, { x: this.x, y: this.y - 18, size: 8 + this.level * 2, life: 0.12, color: '#dff6ff' });
    g.camera?.shake(0.9, 0.08);
    g.audio?.play('zap');
  }
}

registerTower('tesla', TeslaTower);
void TeslaTower;

/* ==== js/entities/Enemy.js ==== */
/* ==========================================================================
   Enemy.js — базовый класс врага.

   Движение: единая модель «шаг по клеткам» для обоих типов карт.
     • fixed-карты — проходимы только клетки PATH, поэтому flow field
       автоматически ведёт врага ровно по нарисованной дороге;
     • maze-карты — flow field пересчитывается при постройке башни, и ВСЕ
       враги мгновенно перестраивают маршрут (barrage/mazing).
   Воздушные юниты flow field игнорируют и летят по прямой к выходу.

   Статусы:
     • замедление НЕ стакается — берётся максимальный активный процент;
     • горение тикает раз в 0.5 с (burnDamage = burnDps * 0.5);
     • броня вычитается из каждого попадания: dmg = max(1, dmg - armor).
   ========================================================================== */


class Enemy {
  /**
   * @param {GameScene} game
   * @param {object} def — запись из ENEMY_DEFS
   * @param {number} entryIdx — индекс точки входа
   * @param {number} wave
   * @param {object} mods — { hpMul, armorMul, speedMul, isBoss }
   */
  constructor(game, def, entryIdx, wave, mods = {}) {
    this.game = game;
    this.def = def;
    this.id = def.id;
    this.wave = wave;
    this.alive = true;
    this.reachedEnd = false;

    const grid = game.grid;
    const path = game.path;
    const entry = grid.entries[clamp(entryIdx | 0, 0, grid.entries.length - 1)] || grid.entries[0];

    // ---- масштабирование по волне ----
    const hpScale = Math.pow(game.hpScale, Math.max(0, wave - 1));
    this.maxHp = Math.max(1, Math.round(def.hp * hpScale * (mods.hpMul || 1)));
    this.hp = this.maxHp;
    this.armor = Math.round(def.armor * Math.pow(game.armorScale, Math.max(0, wave - 1)) * (mods.armorMul || 1));
    this.baseSpeed = def.speed * (mods.speedMul || 1) * (game.speedScale || 1);
    this.reward = def.reward;
    this.livesCost = def.isBoss || mods.isBoss ? 5 : (def.livesCost || 1);
    this.radius = def.radius;
    this.flying = !!def.flying;
    this.slowImmune = !!def.slowImmune;
    this.regen = def.regen || 0;
    this.scale = def.scale || 1;
    this.frames = def.frames || 4;
    this.spriteKey = `enemy.${def.id}`;

    // ---- позиция на пути ----
    this.cellIdx = grid.idx(entry.cx, entry.cy);
    this.anchorIdx = this.cellIdx;
    const c = { x: 0, y: 0 };
    grid.center(this.cellIdx, c);
    this.x = c.x;
    this.y = c.y;
    this.altitude = this.flying ? 16 : 0;
    this.angle = 0;                 // направление взгляда
    this.moveAngle = 0;
    this.progress = 0;              // сколько мировых px пройдено (для FIRST/LAST)
    this.remain = 0;                // клеток до выхода
    this.pathVersion = path.version;

    // ---- статусы ----
    this.slowPct = 0;
    this.slowTimer = 0;
    this.burnDps = 0;
    this.burnTimer = 0;
    this.burnTick = 0;
    this.hitFlash = 0;
    this.invuln = 0;
    this.spawnAnim = 1;             // 1 → 0: появление
    this.animT = Math.random() * 10;
    this.deadAnim = 0;
    this.lastDamageBy = null;

    // воздушные цели летят по прямой к ближайшему выходу
    if (this.flying) {
      let best = null, bd = Infinity;
      for (const e of grid.exits) {
        const ex = grid.centerX(e.cx), ey = grid.centerY(e.cy);
        const d = dist(this.x, this.y, ex, ey);
        if (d < bd) { bd = d; best = { x: ex, y: ey }; }
      }
      this.flyTarget = best || { x: this.x, y: this.y };
      this.moveAngle = Math.atan2(this.flyTarget.y - this.y, this.flyTarget.x - this.x);
      this.angle = this.moveAngle;
      this.progress = 0;
      this.remain = bd / CELL;
    } else {
      this._refreshAnchor(true);
    }
  }

  get speed() {
    const s = this.slowPct > 0 ? this.baseSpeed * (1 - this.slowPct) : this.baseSpeed;
    return s;
  }

  /* ------------------------------- движение ---------------------------- */

  /** Пересчитать целевую клетку по flow field */
  _refreshAnchor(initial = false) {
    const path = this.game.path;
    this.pathVersion = path.version;
    if (initial) {
      this.anchorIdx = path.nextFrom(this.cellIdx);
    } else {
      // если целевая клетка внезапно занята башней — отступаем в текущую
      if (!this.game.grid.isWalkable(this.anchorIdx)) {
        this.anchorIdx = this.cellIdx;
      }
    }
    this.remain = path.distToExit(this.anchorIdx < 0 ? this.cellIdx : this.anchorIdx);
  }

  update(dt) {
    if (!this.alive) return;

    if (this.spawnAnim > 0) this.spawnAnim = Math.max(0, this.spawnAnim - dt * 2.6);
    if (this.hitFlash > 0) this.hitFlash = Math.max(0, this.hitFlash - dt * 10);
    if (this.invuln > 0) this.invuln = Math.max(0, this.invuln - dt);
    this.animT += dt * (0.6 + this.speed / 42);

    // ---- статусы ----
    if (this.slowTimer > 0) {
      this.slowTimer -= dt;
      if (this.slowTimer <= 0) { this.slowTimer = 0; this.slowPct = 0; }
    }
    if (this.burnTimer > 0) {
      this.burnTimer -= dt;
      this.burnTick -= dt;
      if (this.burnTick <= 0) {
        this.burnTick = 0.5;
        this.takeDamage(this.burnDps * 0.5, 'fire', { noArmor: false, ignoreFlash: true });
      }
      if (this.burnTimer <= 0) { this.burnDps = 0; this.burnTimer = 0; }
      else if (Math.random() < dt * 14) {
        this.game.particles.emit(
          this.x + randRange(-this.radius * 0.6, this.radius * 0.6),
          this.y - this.altitude + randRange(-2, 4),
          randRange(-6, 6), randRange(-38, -18),
          randRange(0.25, 0.5), randRange(1.4, 3),
          Math.random() < 0.5 ? '#ff9b3d' : '#ffd23f', PT.FLAME, -1.5, -14
        );
      }
    }
    if (this.regen > 0 && this.hp < this.maxHp) {
      this.hp = Math.min(this.maxHp, this.hp + this.maxHp * this.regen * dt);
    }

    this.updateVfx(dt);

    // ---- пересчёт маршрута при изменении сетки ----
    if (!this.flying && this.pathVersion !== this.game.path.version) {
      this._refreshAnchor(false);
    }

    if (this.flying) this._updateFlying(dt);
    else this._updateGround(dt);

    if (this.hp <= 0) this.die();
  }

  _updateGround(dt) {
    const grid = this.game.grid;
    const path = this.game.path;

    if (this.anchorIdx < 0) {
      // стоим на выходе
      this.leak();
      return;
    }

    const t = grid.center(this.anchorIdx, { x: 0, y: 0 });
    const dx = t.x - this.x, dy = t.y - this.y;
    const d = Math.hypot(dx, dy);
    const step = this.speed * dt;

    if (d <= Math.max(0.6, step)) {
      // дошли до клетки
      this.x = t.x; this.y = t.y;
      this.progress += d;
      this.cellIdx = this.anchorIdx;
      const nxt = path.nextFrom(this.cellIdx);
      if (nxt < 0) {
        this.leak();
        return;
      }
      this.anchorIdx = nxt;
      this.remain = path.distToExit(nxt);
    } else {
      this.x += (dx / d) * step;
      this.y += (dy / d) * step;
      this.progress += step;
      this.moveAngle = Math.atan2(dy, dx);
    }
    // плавный доворот спрайта
    this.angle = lerpAngle(this.angle, this.moveAngle, clamp(dt * 12, 0, 1));
  }

  _updateFlying(dt) {
    const ft = this.flyTarget;
    const dx = ft.x - this.x, dy = ft.y - this.y;
    const d = Math.hypot(dx, dy);
    const step = this.speed * dt;
    this.moveAngle = Math.atan2(dy, dx);
    this.angle = lerpAngle(this.angle, this.moveAngle, clamp(dt * 4, 0, 1));
    this.progress += step;
    this.remain = d / CELL;

    // лёгкое покачивание
    this.altitude = 16 + Math.sin(this.animT * 2.2) * 2.2;

    if (d <= Math.max(1, step)) {
      this.x = ft.x; this.y = ft.y;
      this.leak();
      return;
    }
    this.x += (dx / d) * step;
    this.y += (dy / d) * step;
  }

  /**
   * Переставить врага в произвольную точку мира (используется для десанта
   * из транспорта). Опорная клетка и следующая клетка пересчитываются.
   */
  placeAt(x, y) {
    const grid = this.game.grid;
    const path = this.game.path;
    this.x = x;
    this.y = y;
    if (this.flying) return this;
    let c = grid.cellFromWorld(x, y);
    if (!grid.inBounds(c.cx, c.cy)) c = grid.cellFromIdx(this.cellIdx);
    let idx = grid.idx(c.cx, c.cy);
    if (!grid.isWalkable(idx)) {
      // ищем ближайшую проходимую клетку рядом
      let best = -1, bd = Infinity;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const nx = c.cx + dx, ny = c.cy + dy;
          if (!grid.inBounds(nx, ny)) continue;
          const ni = grid.idx(nx, ny);
          if (!grid.isWalkable(ni)) continue;
          const d = Math.abs(dx) + Math.abs(dy);
          if (d < bd) { bd = d; best = ni; }
        }
      }
      if (best >= 0) idx = best;
      else idx = this.cellIdx;
      const cc = grid.center(idx, { x: 0, y: 0 });
      this.x = cc.x;
      this.y = cc.y;
    }
    this.cellIdx = idx;
    this.anchorIdx = path.nextFrom(idx);
    if (this.anchorIdx < 0) this.anchorIdx = idx;
    this.remain = path.distToExit(this.anchorIdx);
    this.pathVersion = path.version;
    return this;
  }

  /** Хук для подклассов: дым, пыль, следы */
  updateVfx(dt) { void dt; }

  /* ------------------------------- статусы ----------------------------- */

  /** Замедление: берётся максимальный процент, время — наибольшее */
  applySlow(pct, time) {
    if (this.slowImmune || pct <= 0) {
      if (this.slowImmune && pct > 0) {
        this.game.texts?.spawn(this.x, this.y - this.radius - 12, 'IMMUNE', '#9fb4d8', 10, 0.6);
      }
      return false;
    }
    const p = clamp(pct, 0, 0.92);
    if (p >= this.slowPct) this.slowPct = p;
    this.slowTimer = Math.max(this.slowTimer, time);
    return true;
  }

  applyBurn(dps, time) {
    this.burnDps = Math.max(this.burnDps, dps);
    this.burnTimer = Math.max(this.burnTimer, time);
    if (this.burnTick <= 0) this.burnTick = 0.5;
  }

  /* -------------------------------- урон ------------------------------- */

  /**
   * @param {number} amount — «сырой» урон
   * @param {string} type — тип урона
   * @param {object} o — { pierceArmor, source, ignoreFlash }
   * @returns {number} фактически нанесённый урон
   */
  takeDamage(amount, type = 'physical', o = {}) {
    if (!this.alive || this.invuln > 0) return 0;
    const pierce = clamp(o.pierceArmor || 0, 0, 1);
    const armor = this.armor * (1 - pierce);
    const dmg = Math.max(1, amount - armor);
    this.hp -= dmg;
    if (!o.ignoreFlash) this.hitFlash = 1;
    this.lastDamageBy = o.source || null;
    if (o.source?.registerDamage) o.source.registerDamage(dmg);
    return dmg;
  }

  /* -------------------------------- смерть ------------------------------ */

  die() {
    if (!this.alive) return;
    this.alive = false;
    const g = this.game;
    const def = this.def;

    // награда
    g.economy.killReward(def, this.wave, this.x, this.y - this.altitude - 10);
    g.economy.kills++;
    g.waves.onEnemyKilled();
    if (this.lastDamageBy?.registerKill) this.lastDamageBy.registerKill();

    // эффекты смерти
    if (def.isBoss) {
      g.effects.spawn(FX.EXPLOSION, { x: this.x, y: this.y, size: 46, life: 0.8, color: '#ffd9a0', width: 5 });
      g.effects.spawn(FX.SHOCKWAVE, { x: this.x, y: this.y, size: 20, size2: 130, life: 0.6, color: 'rgba(255,220,170,0.9)', width: 6 });
      g.particles.burst(this.x, this.y, {
        count: 46, colors: ['#fff0b0', '#ff9b3d', '#ff5a2c', '#6b6b6b'],
        speed: [50, 240], life: [0.4, 1.1], size: [2, 6], gravity: 90, drag: 1.4
      });
      g.camera.shake(10, 0.6);
      g.audio?.play('kill', { big: true });
      g.audio?.play('explosion', { big: true });
      g.texts?.spawn(this.x, this.y - 40, 'БОСС УНИЧТОЖЕН', '#ffd23f', 18, 1.4);
    } else if (this.radius >= 13) {
      // техника — взрыв
      g.effects.spawn(FX.EXPLOSION, { x: this.x, y: this.y, size: 20, life: 0.4, color: '#ffd9a0', width: 3 });
      g.particles.burst(this.x, this.y, {
        count: 18, colors: ['#fff0b0', '#ff9b3d', '#6b6b6b', '#3a3a3a'],
        speed: [40, 150], life: [0.3, 0.8], size: [1.6, 4.4], gravity: 110, drag: 1.6
      });
      g.particles.burst(this.x, this.y, {
        count: 7, colors: ['#5a5a5a', '#7d7d7d'], speed: [10, 40],
        life: [0.6, 1.2], size: [3, 7], gravity: -16, drag: 1.2, type: PT.SMOKE
      });
      g.audio?.play('kill', { big: true });
      g.camera.shake(2, 0.14);
    } else {
      // пехота — «пуф»
      g.particles.burst(this.x, this.y - 4, {
        count: 10, colors: [def.tint, '#ffffff', '#ffd23f'],
        speed: [30, 110], life: [0.2, 0.5], size: [1.4, 3.2], gravity: 130, drag: 2
      });
      g.audio?.play('kill');
    }

    // десант из транспорта
    if (def.onDeath && def.onDeath.spawn) {
      g.spawnSquad({
        type: def.onDeath.spawn,
        count: def.onDeath.count || 2,
        at: { x: this.x, y: this.y },
        cellIdx: this.cellIdx,
        spread: def.onDeath.spread || 6,
        wave: this.wave
      });
    }

    g.onEnemyRemoved(this);
  }

  /** Дошёл до выхода — минус жизнь */
  leak() {
    if (!this.alive) return;
    this.alive = false;
    this.reachedEnd = true;
    const g = this.game;
    g.economy.leak(this.livesCost, this.x, this.y - this.altitude - 14);
    g.waves.onEnemyLeaked();
    g.effects.spawn(FX.SHOCKWAVE, {
      x: this.x, y: this.y, size: 6, size2: 44, life: 0.4,
      color: 'rgba(255,90,90,0.9)', width: 4
    });
    g.particles.burst(this.x, this.y, {
      count: 14, colors: ['#ff6b6b', '#ffd23f'], speed: [30, 110],
      life: [0.25, 0.6], size: [1.6, 3.4], gravity: 60
    });
    g.camera.shake(4, 0.25);
    g.audio?.play('leak');
    g.onEnemyRemoved(this);
  }

  /** Клетка, в которой сейчас стоит враг (для запрета строительства поверх) */
  occupiedCells(out) {
    out = out || [];
    out.length = 0;
    if (this.flying) return out;
    out.push(this.cellIdx);
    if (this.anchorIdx >= 0 && this.anchorIdx !== this.cellIdx) out.push(this.anchorIdx);
    return out;
  }

  /* ------------------------------ отрисовка ---------------------------- */

  render(g) {
    if (!this.alive) return;
    const drawY = this.y - this.altitude;
    const s = this.scale * (this.spawnAnim > 0 ? (1 + this.spawnAnim * 0.25) : 1);
    const frame = Math.floor(this.animT * 8) % this.frames;
    const flip = Math.cos(this.angle) < 0;

    // тень
    g.save();
    g.globalAlpha = this.flying ? 0.22 : 0.3;
    g.fillStyle = '#000';
    g.beginPath();
    g.ellipse(this.x, this.y + this.radius * 0.5, this.radius * (this.flying ? 0.85 : 1), this.radius * 0.42, 0, 0, Math.PI * 2);
    g.fill();
    g.restore();

    // появление: полупрозрачность + выезд снизу
    const appear = this.spawnAnim > 0 ? 1 - this.spawnAnim : 1;

    Sprites.drawFrame(g, this.spriteKey, frame, this.x, drawY + (this.spawnAnim * 6), {
      scale: s, flip, alpha: clamp(appear * 1.6, 0, 1), align: 'center'
    });

    this.renderExtra(g, frame, flip, s, drawY);

    // белая вспышка при попадании (силуэт через кэш)
    if (this.hitFlash > 0) {
      const sil = Sprites.getSilhouette(this.spriteKey, frame);
      if (sil) {
        g.save();
        g.globalAlpha = clamp(this.hitFlash * 0.85, 0, 0.85);
        g.globalCompositeOperation = 'lighter';
        const w = sil.width * s, h = sil.height * s;
        g.translate(this.x, drawY + this.spawnAnim * 6);
        if (flip) g.scale(-1, 1);
        g.drawImage(sil, -w / 2, -h / 2, w, h);
        g.restore();
      }
    }

    // индикатор замедления
    if (this.slowPct > 0) {
      g.save();
      g.globalAlpha = 0.5;
      g.strokeStyle = '#7fe4ff';
      g.lineWidth = 2;
      g.beginPath();
      g.ellipse(this.x, this.y + this.radius * 0.45, this.radius * 1.05, this.radius * 0.5, 0, 0, Math.PI * 2);
      g.stroke();
      g.globalAlpha = 0.22;
      g.fillStyle = '#7fe4ff';
      g.fill();
      g.restore();
    }

    this.renderHealthBar(g, drawY);
  }

  renderExtra(g, frame, flip, s, drawY) {
    void g; void frame; void flip; void s; void drawY;
  }

  renderHealthBar(g, drawY) {
    if (this.hp >= this.maxHp && !this.def.isBoss) return;
    const w = Math.max(20, this.radius * 2.6);
    const h = this.def.isBoss ? 6 : 4;
    const x = this.x - w / 2;
    const y = drawY - this.radius * this.scale - (this.def.isBoss ? 22 : 13);
    const p = clamp(this.hp / this.maxHp, 0, 1);

    g.save();
    g.fillStyle = 'rgba(0,0,0,0.6)';
    g.fillRect(x - 1, y - 1, w + 2, h + 2);
    // зелёный → жёлтый → красный
    const col = p > 0.6 ? '#6ee36e' : (p > 0.3 ? '#ffd23f' : '#ff5a5a');
    g.fillStyle = col;
    g.fillRect(x, y, w * p, h);
    g.fillStyle = 'rgba(255,255,255,0.28)';
    g.fillRect(x, y, w * p, h * 0.42);
    if (this.def.isBoss) {
      g.strokeStyle = 'rgba(255,210,63,0.85)';
      g.lineWidth = 1.4;
      g.strokeRect(x - 1.5, y - 1.5, w + 3, h + 3);
    }
    g.restore();
  }
}

void Enemy;

/* ==========================================================================
   Реестр поведений врагов: ENEMY_DEFS[id].behavior → класс.
   Подклассы регистрируют себя при импорте (см. enemies/index.js).
   ========================================================================== */

const ENEMY_REGISTRY = Object.create(null);

function registerEnemy(behavior, cls) { ENEMY_REGISTRY[behavior] = cls; }

function createEnemyHere(game, def, entryIdx, wave, mods) {
  const Cls = ENEMY_REGISTRY[def.behavior] || Enemy;
  return new Cls(game, def, entryIdx, wave, mods);
}

function enemySupported(def) { return !!ENEMY_REGISTRY[def.behavior]; }


/* ==== js/entities/enemies/Soldier.js ==== */
/* ==========================================================================
   Soldier.js — пехотинец (Grunt). HP 20, скорость 42 px/с, награда $2.
   Базовое поведение, лёгкая пыльца из-под ботинок при ходьбе.
   ========================================================================== */


class Soldier extends Enemy {
  updateVfx(dt) {
    // пыль при ходьбе (только на земле и на скорости)
    if (this.flying || this.slowPct > 0.5) return;
    this._dust = (this._dust || 0) - dt;
    if (this._dust <= 0) {
      this._dust = 0.26;
      this.game.particles.emit(
        this.x - Math.cos(this.angle) * 4, this.y + this.radius * 0.45,
        -Math.cos(this.angle) * 8, -6,
        0.4, 1.6, 'rgba(210,190,150,0.55)', PT.SMOKE, 3, -4
      );
    }
  }
}

registerEnemy('soldier', Soldier);
void Soldier;


/* ==== js/entities/enemies/FastRunner.js ==== */
/* ==========================================================================
   FastRunner.js — быстрый бегун. HP 12, скорость 84 px/с (вдвое быстрее
   пехоты), награда $2. Оставляет «след скорости», из-за чего визуально
   читается как угроза на длинных прямых.
   ========================================================================== */


class FastRunner extends Enemy {
  updateVfx(dt) {
    this._trail = (this._trail || 0) - dt;
    if (this._trail <= 0) {
      this._trail = 0.045;
      const g = this.game;
      g.particles.emit(
        this.x - Math.cos(this.angle) * 6, this.y - 4 - this.altitude,
        -Math.cos(this.angle) * 26, -Math.sin(this.angle) * 12,

/* ==== js/systems/GridSystem.js ==== */
/* ==========================================================================
   GridSystem.js — сетка карты: типы клеток, башни, входы/выходы, декор.
   Единая модель для обоих типов карт:
     • fixed  — враги ходят только по клеткам PATH (путь нарисован на карте)
     • maze   — враги идут кратчайшим маршрутом через EMPTY, игрок строит
                лабиринт башнями (barrage/mazing)
   ========================================================================== */


class GridSystem {
  /**
   * @param {object} mapDef — данные карты из maps/*.js
   */
  constructor(mapDef) {
    this.def = mapDef;
    this.cols = mapDef.cols;
    this.rows = mapDef.rows;
    this.maze = !!mapDef.maze;
    this.biome = mapDef.biome || 'grass';

    const n = this.cols * this.rows;
    this.tiles = new Uint8Array(n).fill(TILE.EMPTY);
    this.towers = new Array(n).fill(null);
    this.dirty = true;           // флаг перерисовки статичного фона

    this.entries = (mapDef.entries || []).map((e) => ({ cx: e[0], cy: e[1] }));
    this.exits = (mapDef.exits || []).map((e) => ({ cx: e[0], cy: e[1] }));

    this.pathCells = [];         // клетки фиксированного пути (в порядке обхода)
    this.decor = mapDef.decor || [];

    this._buildTiles();
  }

  /* ------------------------------ доступ ------------------------------- */

  idx(cx, cy) { return cy * this.cols + cx; }
  inBounds(cx, cy) { return cx >= 0 && cy >= 0 && cx < this.cols && cy < this.rows; }
  tileAt(cx, cy) { return this.inBounds(cx, cy) ? this.tiles[this.idx(cx, cy)] : TILE.BLOCKED; }
  tileByIdx(i) { return this.tiles[i]; }
  towerAt(cx, cy) { return this.inBounds(cx, cy) ? this.towers[this.idx(cx, cy)] : null; }
  towerByIdx(i) { return this.towers[i]; }

  cellOf(cx, cy) { return { cx, cy }; }
  cellFromIdx(i) { return { cx: i % this.cols, cy: (i / this.cols) | 0 }; }

  /** Центр клетки в мировых координатах */
  centerX(cx) { return cx * CELL + CELL / 2; }
  centerY(cy) { return cy * CELL + CELL / 2; }
  center(i, out) {
    const cx = i % this.cols, cy = (i / this.cols) | 0;
    const o = out || { x: 0, y: 0 };
    o.x = cx * CELL + CELL / 2;
    o.y = cy * CELL + CELL / 2;
    return o;
  }

  cellFromWorld(wx, wy) {
    return { cx: Math.floor(wx / CELL), cy: Math.floor(wy / CELL) };
  }

  get worldW() { return this.cols * CELL; }
  get worldH() { return this.rows * CELL; }

  /* --------------------------- заполнение ------------------------------ */

  _buildTiles() {
    const d = this.def;

    // Зоны-прямоугольники: { x, y, w, h, kind } — непроходимые и незастраиваемые
    this.zones = (d.zones || []).map((z) => Object.assign({ kind: 'rock' }, z));
    for (const z of this.zones) this._fillRect(z.x, z.y, z.w, z.h, TILE.BLOCKED);

    // Дополнительные способы задать запрет строительства
    for (const b of (d.blockedRects || [])) this._fillRect(b[0], b[1], b[2], b[3], TILE.BLOCKED);
    for (const b of (d.blockedCells || [])) this._set(b[0], b[1], TILE.BLOCKED);

    // Декор занимает клетку (если не помечен как «чистый»)
    for (const dec of this.decor) {
      if (dec.solid !== false) this._set(dec.cx, dec.cy, TILE.BLOCKED);
    }

    // Фиксированный путь: разворачиваем путевые точки в список клеток
    if (d.path && d.path.length) {
      this.pathCells = this._expandPath(d.path);
      for (const i of this.pathCells) {
        if (this.tiles[i] !== TILE.ENTRY && this.tiles[i] !== TILE.EXIT) this.tiles[i] = TILE.PATH;
      }
    }

    // Входы и выходы
    for (const e of this.entries) this._set(e.cx, e.cy, TILE.ENTRY);
    for (const e of this.exits) this._set(e.cx, e.cy, TILE.EXIT);

    // В maze-режиме «дороги» как таковой нет — ENTRY/EXIT стоят на EMPTY
    if (this.maze && !this.pathCells.length) {
      // стартовая «тропа» от входа до выхода нужна только для подсказки
      this.pathCells = [];
    }
  }

  _set(cx, cy, v) {
    if (!this.inBounds(cx, cy)) return;
    this.tiles[this.idx(cx, cy)] = v;
    this.dirty = true;
  }

  _fillRect(x, y, w, h, v) {
    for (let j = y; j < y + h; j++) {
      for (let i = x; i < x + w; i++) this._set(i, j, v);
    }
  }

  /** Путевые точки [[cx,cy],...] → плотный список индексов клеток (без диагоналей) */
  _expandPath(points) {
    const out = [];
    for (let k = 0; k < points.length - 1; k++) {
      const [ax, ay] = points[k];
      const [bx, by] = points[k + 1];
      let cx = ax, cy = ay;
      if (k === 0) out.push(this.idx(cx, cy));
      const dx = Math.sign(bx - ax), dy = Math.sign(by - ay);
      let guard = this.cols + this.rows + 4;
      while ((cx !== bx || cy !== by) && guard-- > 0) {
        if (cx !== bx) cx += dx;
        else if (cy !== by) cy += dy;
        out.push(this.idx(cx, cy));
      }
    }
    return out;
  }

  /* --------------------------- строительство --------------------------- */

  /** Можно ли строить в клетке (без учёта связности пути — её проверяет PathfindingSystem) */
  isBuildableCell(cx, cy) {
    if (!this.inBounds(cx, cy)) return false;
    const t = this.tiles[this.idx(cx, cy)];
    if (t !== TILE.EMPTY) return false;
    if (this.towers[this.idx(cx, cy)]) return false;
    return true;
  }

  /** Проходима ли клетка для наземного врага */
  isWalkable(i) {
    if (i < 0 || i >= this.tiles.length) return false;
    if (this.towers[i]) return false;
    const t = this.tiles[i];
    if (this.maze) return t === TILE.EMPTY || t === TILE.ENTRY || t === TILE.EXIT || t === TILE.PATH;
    return t === TILE.PATH || t === TILE.ENTRY || t === TILE.EXIT;
  }

  placeTower(tower) {
    const i = this.idx(tower.cx, tower.cy);
    this.towers[i] = tower;
    this.dirty = true;
    return tower;
  }

  removeTower(tower) {
    const i = this.idx(tower.cx, tower.cy);
    if (this.towers[i] === tower) this.towers[i] = null;
    this.dirty = true;
  }

  /** Список всех башен (без дыр) */
  allTowers() {
    const out = [];
    for (let i = 0; i < this.towers.length; i++) if (this.towers[i]) out.push(this.towers[i]);
    return out;
  }
}

void GridSystem;


/* ==== js/systems/PathfindingSystem.js ==== */
/* ==========================================================================
   PathfindingSystem.js — поиск пути.

   Два инструмента:
     1) A* (Manhattan-эвристика) — для проверки «есть ли путь» и для
        построения наглядного маршрута от входа до выхода.
     2) Flow field (волновой алгоритм от выходов) — кэш направлений для ВСЕХ
        наземных врагов сразу: пересчитывается только при изменении сетки
        (постройка/продажа башни), поэтому враги мгновенно перестраиваются.

   Воздушные юниты flow field игнорируют: они летят по прямой (или по
   воздушному коридору карты) — см. Enemy.updateFlying().
   ========================================================================== */


const INF = 0x3fffffff;

class PathfindingSystem {
  constructor(grid) {
    this.grid = grid;
    const n = grid.cols * grid.rows;
    this.dist = new Int32Array(n);     // расстояние до ближайшего выхода, в клетках
    this.next = new Int32Array(n);     // индекс следующей клетки к выходу
    this.queue = new Int32Array(n);    // кольцевая очередь для BFS
    this.tmpDist = new Int32Array(n);  // временный flow field для проверки стройки
    this.tmpQueue = new Int32Array(n);
    this.version = 0;                  // счётчик пересчётов (для кэшей)
    this.entryRoutes = [];             // наглядные маршруты от каждого входа
    this.reachableEntries = [];        // входы, у которых есть путь
    this.rebuild();
  }

  /* --------------------------- flow field ------------------------------ */

  /** Полный пересчёт: BFS от всех выходов по проходимым клеткам */
  rebuild() {
    const g = this.grid;
    const n = g.cols * g.rows;
    const { dist, next, queue } = this;
    dist.fill(INF);
    next.fill(-1);

    let head = 0, tail = 0;
    for (const e of g.exits) {
      const i = g.idx(e.cx, e.cy);
      if (dist[i] === INF) {
        dist[i] = 0;
        next[i] = -1;          // цель достигнута
        queue[tail++] = i;
      }
    }

    const cols = g.cols;
    while (head < tail) {
      const cur = queue[head++];
      const d = dist[cur] + 1;
      const cx = cur % cols, cy = (cur / cols) | 0;

      // 4-связность (диагонали запрещены — как в оригинале жанра)
      for (let k = 0; k < 4; k++) {
        const nx = cx + (k === 0 ? 1 : k === 1 ? -1 : 0);
        const ny = cy + (k === 2 ? 1 : k === 3 ? -1 : 0);
        if (nx < 0 || ny < 0 || nx >= cols || ny >= g.rows) continue;
        const ni = ny * cols + nx;
        if (dist[ni] !== INF) continue;
        if (!g.isWalkable(ni)) continue;
        dist[ni] = d;
        next[ni] = cur;
        queue[tail++] = ni;
      }
    }

    this.version++;
    this._updateEntryRoutes();
    return this;
  }

  _updateEntryRoutes() {
    const g = this.grid;
    this.entryRoutes = [];
    this.reachableEntries = [];
    for (const e of g.entries) {
      const start = g.idx(e.cx, e.cy);
      const route = this.routeFrom(start);
      this.entryRoutes.push(route);
      if (route && route.length) this.reachableEntries.push(e);
    }
  }

  /** Маршрут от клетки до выхода по flow field (массив индексов) */
  routeFrom(startIdx) {
    const g = this.grid;
    const n = g.cols * g.rows;
    if (startIdx < 0 || startIdx >= n) return null;
    if (this.dist[startIdx] >= INF) return null;
    const out = [startIdx];
    let cur = startIdx;
    let guard = n + 8;
    while (this.next[cur] !== -1 && guard-- > 0) {
      cur = this.next[cur];
      out.push(cur);
    }
    return out;
  }

  /** Сколько клеток осталось пройти от данной клетки (-1 = недостижимо) */
  distToExit(i) {
    return (i < 0 || i >= this.dist.length) ? INF : this.dist[i];
  }

  /** Следующая клетка для движения из i (или -1) */
  nextFrom(i) {
    return (i < 0 || i >= this.next.length) ? -1 : this.next[i];
  }

  /* ------------------------------- A* ---------------------------------- */

  /**
   * Классический A* с Manhattan-эвристикой до ближайшего выхода.
   * Используется для валидации строительства и для «подсказки маршрута».
   * @returns {number[]|null} массив индексов клеток от start до goal
   */
  astar(startIdx, extraBlocked = null) {
    const g = this.grid;
    const cols = g.cols, rows = g.rows;
    const n = cols * rows;
    if (startIdx < 0 || startIdx >= n) return null;
    if (!g.exits.length) return null;

    const gScore = new Int32Array(n).fill(INF);
    const fScore = new Int32Array(n).fill(INF);
    const cameFrom = new Int32Array(n).fill(-1);
    const closed = new Uint8Array(n);

    // цели
    const goalIdx = g.exits.map((e) => g.idx(e.cx, e.cy));
    const isGoal = (i) => goalIdx.indexOf(i) !== -1;

    // эвристика: минимальный Manhattan до любого выхода
    const h = (i) => {
      const cx = i % cols, cy = (i / cols) | 0;
      let best = INF;
      for (const gi of goalIdx) {
        const gx = gi % cols, gy = (gi / cols) | 0;
        const d = Math.abs(cx - gx) + Math.abs(cy - gy);
        if (d < best) best = d;
      }
      return best;
    };

    const walkable = (i) => {
      if (extraBlocked && extraBlocked.has(i)) return false;
      // вход всегда проходим (на нём нельзя строить), выход — тоже
      const t = g.tiles[i];
      if (t === TILE.ENTRY || t === TILE.EXIT) return true;
      return g.isWalkable(i);
    };

    // простая двоичная куча
    const heap = [];
    const push = (i, f) => {
      heap.push({ i, f });
      let c = heap.length - 1;
      while (c > 0) {
        const p = (c - 1) >> 1;
        if (heap[p].f <= heap[c].f) break;
        const t = heap[p]; heap[p] = heap[c]; heap[c] = t;
        c = p;
      }
    };
    const pop = () => {
      const top = heap[0];
      const last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        let p = 0;
        for (;;) {
          const l = p * 2 + 1, r = l + 1;
          let m = p;
          if (l < heap.length && heap[l].f < heap[m].f) m = l;
          if (r < heap.length && heap[r].f < heap[m].f) m = r;
          if (m === p) break;
          const t = heap[p]; heap[p] = heap[m]; heap[m] = t;
          p = m;
        }
      }
      return top;
    };

    gScore[startIdx] = 0;
    fScore[startIdx] = h(startIdx);
    push(startIdx, fScore[startIdx]);

    let guard = n * 4;
    while (heap.length && guard-- > 0) {
      const { i: cur } = pop();
      if (closed[cur]) continue;
      closed[cur] = 1;
      if (isGoal(cur)) {
        // восстановить путь
        const path = [cur];
        let c = cur;
        while (cameFrom[c] !== -1) { c = cameFrom[c]; path.push(c); }
        path.reverse();
        return path;
      }
      const cx = cur % cols, cy = (cur / cols) | 0;
      for (let k = 0; k < 4; k++) {
        const nx = cx + (k === 0 ? 1 : k === 1 ? -1 : 0);
        const ny = cy + (k === 2 ? 1 : k === 3 ? -1 : 0);
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        const ni = ny * cols + nx;
        if (closed[ni] || !walkable(ni)) continue;
        const tentative = gScore[cur] + 1;
        if (tentative < gScore[ni]) {
          gScore[ni] = tentative;
          cameFrom[ni] = cur;
          fScore[ni] = tentative + h(ni);
          push(ni, fScore[ni]);
        }
      }
    }
    return null;
  }

  /**
   * Главная проверка для mazing: можно ли поставить башню в клетку так, чтобы
   *   • ВСЕ входы по-прежнему имели путь к выходу;
   *   • ни один живой враг не оказался замурован (extraSources — их клетки).
   * Без этого враги застревали бы внутри лабиринта.
   *
   * Реализация: один временный волновой проход (BFS) от выходов с учётом
   * «виртуально» занятой клетки — O(клеток) вместо O(A* × источников).
   * На телефоне это микросекунды даже при сотне врагов.
   */
  canBuildAt(cx, cy, extraSources = null) {
    const g = this.grid;
    if (!g.isBuildableCell(cx, cy)) return false;
    if (!g.maze) {
      // на картах с фиксированным путём башни не влияют на маршрут
      return true;
    }
    const blockedIdx = g.idx(cx, cy);
    this._computeTempDist(blockedIdx);

    for (const e of g.entries) {
      if (this.tmpDist[g.idx(e.cx, e.cy)] >= INF) return false;
    }
    if (extraSources) {
      for (let i = 0; i < extraSources.length; i++) {
        const src = extraSources[i];
        if (src < 0 || src === blockedIdx) continue;
        if (this.dist[src] >= INF) continue;      // уже был недостижим — не хуже
        if (this.tmpDist[src] >= INF) return false;
      }
    }
    return true;
  }

  /** Волновой проход от выходов, будто клетка blockedIdx уже занята башней */
  _computeTempDist(blockedIdx) {
    const g = this.grid;
    const cols = g.cols;
    const { tmpDist: dist, tmpQueue: queue } = this;
    dist.fill(INF);
    let head = 0, tail = 0;

    for (const e of g.exits) {
      const i = g.idx(e.cx, e.cy);
      if (i === blockedIdx || dist[i] !== INF) continue;
      dist[i] = 0;
      queue[tail++] = i;
    }

    while (head < tail) {
      const cur = queue[head++];
      const d = dist[cur] + 1;
      const cx = cur % cols, cy = (cur / cols) | 0;
      for (let k = 0; k < 4; k++) {
        const nx = cx + (k === 0 ? 1 : k === 1 ? -1 : 0);
        const ny = cy + (k === 2 ? 1 : k === 3 ? -1 : 0);
        if (nx < 0 || ny < 0 || nx >= cols || ny >= g.rows) continue;
        const ni = ny * cols + nx;
        if (ni === blockedIdx || dist[ni] !== INF) continue;
        if (!g.isWalkable(ni)) continue;
        dist[ni] = d;
        queue[tail++] = ni;
      }
    }
  }

  /** Мировые координаты центра клетки по индексу */
  cellCenter(i, out) {
    const g = this.grid;
    const o = out || { x: 0, y: 0 };
    o.x = (i % g.cols) * CELL + CELL / 2;
    o.y = ((i / g.cols) | 0) * CELL + CELL / 2;
    return o;
  }

  /** Точки маршрута в мировых координатах (для отрисовки подсказки) */
  routePoints(idxRoute) {
    if (!idxRoute) return [];
    const out = [];
    const p = { x: 0, y: 0 };
    for (const i of idxRoute) {
      this.cellCenter(i, p);
      out.push({ x: p.x, y: p.y });
    }
    return out;
  }
}

void PathfindingSystem;


/* ==== js/systems/CollisionSystem.js ==== */
/* ==========================================================================
