   CollisionSystem.js — пространственный хэш для быстрого поиска врагов
   в радиусе башни и для сплэш-урона. Перестраивается раз за игровой шаг
   (O(n)), запросы — O(1) по корзине. Никаких аллокаций в горячем пути:
   корзины переиспользуются между кадрами.
   ========================================================================== */


const CELL_SIZE = CONFIG.SPATIAL_CELL;

class CollisionSystem {
  constructor(worldW, worldH) {
    this.cols = Math.max(1, Math.ceil(worldW / CELL_SIZE));
    this.rows = Math.max(1, Math.ceil(worldH / CELL_SIZE));
    this.buckets = new Array(this.cols * this.rows);
    for (let i = 0; i < this.buckets.length; i++) this.buckets[i] = [];
    this._query = [];          // переиспользуемый массив результата
    this.ground = [];          // отдельно наземные (для башен «ground»)
    this._groundQuery = [];
  }

  _bucket(x, y) {
    let cx = (x / CELL_SIZE) | 0;
    let cy = (y / CELL_SIZE) | 0;
    if (cx < 0) cx = 0; else if (cx >= this.cols) cx = this.cols - 1;
    if (cy < 0) cy = 0; else if (cy >= this.rows) cy = this.rows - 1;
    return cy * this.cols + cx;
  }

  /** Перестроить хэш по списку живых врагов */
  rebuild(enemies) {
    for (let i = 0; i < this.buckets.length; i++) {
      if (this.buckets[i].length) this.buckets[i].length = 0;
    }
    if (this.ground.length) this.ground.length = 0;

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      this.buckets[this._bucket(e.x, e.y)].push(e);
      if (!e.flying) this.ground.push(e);
    }
  }

  /**
   * Все враги, чья позиция попадает в круг (x, y, r).
   * @param {boolean} groundOnly — только наземные
   * @returns {Array} тот же массив каждый раз — не хранить ссылку!
   */
  queryCircle(x, y, r, groundOnly) {
    const out = groundOnly ? this._groundQuery : this._query;
    out.length = 0;
    const r2 = r * r;
    const minCx = Math.max(0, ((x - r) / CELL_SIZE) | 0);
    const maxCx = Math.min(this.cols - 1, ((x + r) / CELL_SIZE) | 0);
    const minCy = Math.max(0, ((y - r) / CELL_SIZE) | 0);
    const maxCy = Math.min(this.rows - 1, ((y + r) / CELL_SIZE) | 0);

    for (let cy = minCy; cy <= maxCy; cy++) {
      const row = cy * this.cols;
      for (let cx = minCx; cx <= maxCx; cx++) {
        const b = this.buckets[row + cx];
        for (let i = 0; i < b.length; i++) {
          const e = b[i];
          if (!e.alive) continue;
          if (groundOnly && e.flying) continue;
          const dx = e.x - x, dy = e.y - y;
          const rr = r + e.radius;
          if (dx * dx + dy * dy <= rr * rr) out.push(e);
        }
      }
    }
    return out;
  }

  /** Все враги в прямоугольнике (для лазера/конуса) */
  queryRect(x, y, w, h, groundOnly) {
    const out = groundOnly ? this._groundQuery : this._query;
    out.length = 0;
    const minCx = Math.max(0, (x / CELL_SIZE) | 0);
    const maxCx = Math.min(this.cols - 1, ((x + w) / CELL_SIZE) | 0);
    const minCy = Math.max(0, (y / CELL_SIZE) | 0);
    const maxCy = Math.min(this.rows - 1, ((y + h) / CELL_SIZE) | 0);
    for (let cy = minCy; cy <= maxCy; cy++) {
      const row = cy * this.cols;
      for (let cx = minCx; cx <= maxCx; cx++) {
        const b = this.buckets[row + cx];
        for (let i = 0; i < b.length; i++) {
          const e = b[i];
          if (!e.alive) continue;
          if (groundOnly && e.flying) continue;
          if (e.x + e.radius >= x && e.x - e.radius <= x + w &&
              e.y + e.radius >= y && e.y - e.radius <= y + h) out.push(e);
        }
      }
    }
    return out;
  }
}

void CollisionSystem;


/* ==== js/systems/AudioSystem.js ==== */
/* ==========================================================================
   AudioSystem.js — весь звук синтезируется Web Audio API.
   Никаких аудиофайлов: осцилляторы + буфер белого шума + фильтры + огибающие.

   Особенности:
     • AudioContext создаётся лениво после первого жеста (требование iOS/Android)
     • лимитер (DynamicsCompressor) спасает от клиппинга при десятках голосов
     • voice cap + минимальный интервал повтора — пулемёт из 10 башен не рвёт звук
     • процедурная музыка: секвенсор с lookahead-планированием
   ========================================================================== */


const VOICE_CAP = 26;              // максимум одновременно звучащих голосов
const MIN_INTERVAL = {             // сек между повторами одного и того же звука
  shot: 0.028, missile: 0.06, zap: 0.05, glue: 0.07, flame: 0.09,
  laser: 0.12, bee: 0.1, kill: 0.03, explosion: 0.05
};

class AudioSystem {
  constructor() {
    this.ctx = null;
    this.ready = false;
    this.enabled = true;
    this.sfxVolume = 0.8;
    this.musicVolume = 0.35;
    this.muted = false;
    this.voices = 0;
    this._last = {};             // время последнего проигрывания по именам
    this._noise = null;
    this.music = { playing: false, step: 0, nextTime: 0, bpm: 92 };
  }

  /* ----------------------------- инициализация -------------------------- */

  /** Вызывать из обработчика пользовательского жеста */
  unlock() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    try {
      this.ctx = new AC();
    } catch (e) {
      this.enabled = false;
      return;
    }

    const c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = this.muted ? 0 : 1;

    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -14;
    this.comp.knee.value = 22;
    this.comp.ratio.value = 8;
    this.comp.attack.value = 0.004;
    this.comp.release.value = 0.22;

    this.sfxBus = c.createGain();
    this.sfxBus.gain.value = this.sfxVolume;
    this.musicBus = c.createGain();
    this.musicBus.gain.value = this.musicVolume;

    this.sfxBus.connect(this.comp);
    this.musicBus.connect(this.comp);
    this.comp.connect(this.master);
    this.master.connect(c.destination);

    // буфер белого шума (1 с) — переиспользуется всеми шумовыми эффектами
    const len = Math.floor(c.sampleRate * 1);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this._noise = buf;

    this.ready = true;
    if (c.state === 'suspended') c.resume();
  }

  get t() { return this.ctx ? this.ctx.currentTime : 0; }

  setVolumes(sfx, music) {
    this.sfxVolume = clamp(sfx, 0, 1);
    this.musicVolume = clamp(music, 0, 1);
    if (this.ready) {
      this.sfxBus.gain.setTargetAtTime(this.sfxVolume, this.t, 0.02);
      this.musicBus.gain.setTargetAtTime(this.musicVolume, this.t, 0.05);
    }
  }

  setMuted(m) {
    this.muted = !!m;
    if (this.ready) this.master.gain.setTargetAtTime(m ? 0 : 1, this.t, 0.03);
  }

  /* ------------------------------- базовые ------------------------------ */

  _ok(name, priority = 1) {
    if (!this.ready || !this.enabled || this.muted) return false;
    const now = this.t;
    const min = MIN_INTERVAL[name] || 0;
    if (min && this._last[name] !== undefined && now - this._last[name] < min) return false;
    if (this.voices > VOICE_CAP && priority < 2) return false;
    this._last[name] = now;
    return true;
  }

  _track(node, dur) {
    this.voices++;
    const stop = () => { this.voices = Math.max(0, this.voices - 1); };
    setTimeout(stop, dur * 1000 + 30);
    return node;
  }

  _tone(o) {
    // o: {type, f0, f1, t, dur, gain, bus, attack, curve}
    const c = this.ctx;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'sine';
    const t0 = o.t ?? this.t;
    const dur = o.dur ?? 0.2;
    osc.frequency.setValueAtTime(Math.max(1, o.f0), t0);
    if (o.f1 !== undefined && o.f1 !== o.f0) {
      if (o.exp !== false) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + dur);
      else osc.frequency.linearRampToValueAtTime(Math.max(1, o.f1), t0 + dur);
    }
    const peak = o.gain ?? 0.25;
    const atk = o.attack ?? 0.005;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    if (o.filter) {
      const f = c.createBiquadFilter();
      f.type = o.filter;
      f.frequency.value = o.fc ?? 1000;
      f.Q.value = o.q ?? 1;
      g.connect(f);
      f.connect(o.bus || this.sfxBus);
    } else {
      g.connect(o.bus || this.sfxBus);
    }
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
    this._track(osc, dur);
    return osc;
  }

  _noiseHit(o) {
    // o: {t, dur, gain, filter, fc, q, fc1, sweep, bus}
    const c = this.ctx;
    const src = c.createBufferSource();
    src.buffer = this._noise;
    src.loop = true;
    src.playbackRate.value = o.rate ?? 1;
    const f = c.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    const t0 = o.t ?? this.t;
    const dur = o.dur ?? 0.15;
    f.frequency.setValueAtTime(o.fc ?? 1200, t0);
    if (o.fc1 !== undefined) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.fc1), t0 + dur);
    f.Q.value = o.q ?? 1;
    const g = c.createGain();
    const peak = o.gain ?? 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack ?? 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(o.bus || this.sfxBus);
    src.start(t0);
    src.stop(t0 + dur + 0.05);
    this._track(src, dur);
    return src;
  }

  /* ------------------------------- звуки -------------------------------- */

  play(name, opts = {}) {
    if (!this._ok(name, opts.priority || 1)) return;
    const fn = SFX[name];
    if (fn) fn(this, opts);
  }

  /* ------------------------------- музыка ------------------------------- */

  startMusic() {
    if (!this.ready || this.music.playing) return;
    this.music.playing = true;
    this.music.nextTime = this.t + 0.1;
    this.music.step = 0;
  }

  stopMusic() { this.music.playing = false; }

  /** Планируем ноты вперёд (вызывается из игрового цикла) */
  updateMusic(intense = 0) {
    if (!this.ready || !this.music.playing) return;
    const spb = 60 / this.music.bpm / 2; // восьмые
    const lookahead = 0.35;
    while (this.music.nextTime < this.t + lookahead) {
      this._scheduleStep(this.music.step, this.music.nextTime, intense);
      this.music.step = (this.music.step + 1) % 32;
      this.music.nextTime += spb;
    }
  }

  _scheduleStep(step, t, intense) {
    // Аккордовая прогрессия: Am – F – C – G (по 8 восьмых)
    const prog = [
      [220.0, 261.63, 329.63],  // Am
      [174.61, 220.0, 261.63],  // F
      [196.0, 246.94, 293.66],  // G (переставлено для плавности)
      [164.81, 196.0, 261.63]   // C/E
    ];
    const bar = (step >> 3) % 4;
    const s = step % 8;
    const chord = prog[bar];

    // пад: один раз в такт
    if (s === 0) {
      for (const f of chord) {
        this._tone({
          type: 'triangle', f0: f, f1: f, t, dur: 60 / this.music.bpm * 1.9,
          gain: 0.045 + intense * 0.012, attack: 0.35, bus: this.musicBus,
          filter: 'lowpass', fc: 900 + intense * 500, q: 0.6
        });
      }
    }
    // бас
    if (s === 0 || s === 3 || s === 6) {
      this._tone({
        type: 'sine', f0: chord[0] / 2, t, dur: 0.24,
        gain: 0.11 + intense * 0.03, bus: this.musicBus, attack: 0.008
      });
    }
    // лёгкий хэт на напряжённых волнах
    if (intense > 0.3 && (s % 2 === 1)) {
      this._noiseHit({
        t, dur: 0.045, gain: 0.028 * intense, filter: 'highpass',
        fc: 7000, bus: this.musicBus
      });
    }
    // редкая мелодическая нота
    if (s === 4 && Math.random() < 0.55) {
      const f = pick(chord) * 2;
      this._tone({
        type: 'square', f0: f, t: t + 0.01, dur: 0.16,
        gain: 0.022, bus: this.musicBus, filter: 'lowpass', fc: 2200, q: 0.7
      });
    }
  }
}

/* ============================ БИБЛИОТЕКА SFX ============================ */

const SFX = {
  // Пулемёт: короткий шумовой выстрел + щелчок
  shot(a, o) {
    const t = a.t + (o.delay || 0);
    a._noiseHit({ t, dur: 0.055, gain: 0.16, filter: 'bandpass', fc: randRange(1500, 2400), fc1: 700, q: 1.4 });
    a._tone({ type: 'square', f0: randRange(320, 420), f1: 90, t, dur: 0.045, gain: 0.06 });
  },

  // Ракета: свист с возрастающим тоном + шум двигателя
  missile(a, o) {
    const t = a.t + (o.delay || 0);
    a._tone({ type: 'sawtooth', f0: 300, f1: 1500, t, dur: 0.45, gain: 0.07, filter: 'bandpass', fc: 1400, q: 2 });
    a._noiseHit({ t, dur: 0.4, gain: 0.08, filter: 'highpass', fc: 900, fc1: 2600 });
  },

  // Взрыв: низкий boom + шумовой удар
  explosion(a, o) {
    const t = a.t + (o.delay || 0);
    const big = o.big ? 1.6 : 1;
    a._tone({ type: 'sine', f0: 150 * big, f1: 32, t, dur: 0.5 * big, gain: 0.42 });
    a._noiseHit({ t, dur: 0.4 * big, gain: 0.3, filter: 'lowpass', fc: 2400, fc1: 180, q: 0.8 });
    a._noiseHit({ t: t + 0.02, dur: 0.16, gain: 0.14, filter: 'highpass', fc: 3000 });
  },

  // Ядерный взрыв: глубоко и долго
  nuke(a) {
    const t = a.t;
    a._tone({ type: 'sine', f0: 90, f1: 22, t, dur: 1.6, gain: 0.6 });
    a._noiseHit({ t, dur: 1.4, gain: 0.4, filter: 'lowpass', fc: 3000, fc1: 90, q: 0.6 });
    a._tone({ type: 'sawtooth', f0: 400, f1: 60, t: t + 0.05, dur: 0.8, gain: 0.12, filter: 'lowpass', fc: 900 });
  },

  // Электрический разряд: высокочастотный треск
  zap(a, o) {
    const t = a.t + (o.delay || 0);
    for (let i = 0; i < 3; i++) {
      a._noiseHit({
        t: t + i * 0.022, dur: 0.05, gain: 0.16,
        filter: 'bandpass', fc: randRange(2600, 5200), q: 6
      });
    }
    a._tone({ type: 'square', f0: randRange(900, 1400), f1: randRange(220, 420), t, dur: 0.14, gain: 0.09 });
  },

  // Клей: «чпок» с падающим тоном
  glue(a) {
    const t = a.t;
    a._tone({ type: 'sine', f0: 520, f1: 130, t, dur: 0.2, gain: 0.16 });
    a._noiseHit({ t, dur: 0.12, gain: 0.08, filter: 'lowpass', fc: 900, fc1: 300 });
  },

  // Огнемёт: шипение фильтрованного шума
  flame(a) {
    const t = a.t;
    a._noiseHit({ t, dur: 0.34, gain: 0.14, filter: 'bandpass', fc: 700, fc1: 1800, q: 0.7 });
    a._tone({ type: 'sawtooth', f0: 90, f1: 60, t, dur: 0.3, gain: 0.05, filter: 'lowpass', fc: 400 });
  },

  // Лазер: непрерывный нарастающий тон
  laser(a) {
    const t = a.t;
    a._tone({ type: 'sawtooth', f0: 780, f1: 1250, t, dur: 0.22, gain: 0.07, filter: 'bandpass', fc: 1600, q: 3 });
  },

  // Пчёлы: жужжание
  bee(a) {
    const t = a.t;
    a._tone({ type: 'sawtooth', f0: randRange(180, 240), f1: randRange(150, 210), t, dur: 0.5, gain: 0.05, filter: 'bandpass', fc: 900, q: 4 });
    a._noiseHit({ t, dur: 0.45, gain: 0.03, filter: 'bandpass', fc: 2200, q: 8 });
  },

  // Постройка: механический звук с нарастающим тоном
  build(a) {
    const t = a.t;
    a._noiseHit({ t, dur: 0.09, gain: 0.18, filter: 'bandpass', fc: 400, fc1: 2200, q: 2 });
    a._tone({ type: 'square', f0: 180, f1: 620, t: t + 0.03, dur: 0.2, gain: 0.1 });
    a._tone({ type: 'triangle', f0: 620, f1: 930, t: t + 0.2, dur: 0.16, gain: 0.09 });
  },

  // Апгрейд: восходящий «динь»
  upgrade(a) {
    const t = a.t;
    [523, 659, 784, 1046].forEach((f, i) => {
      a._tone({ type: 'triangle', f0: f, t: t + i * 0.06, dur: 0.22, gain: 0.13 });
    });
  },

  // Продажа: звон монет
  sell(a) {
    const t = a.t;
    for (let i = 0; i < 5; i++) {
      a._tone({
        type: 'sine', f0: randRange(1500, 2600), t: t + i * 0.045,
        dur: 0.13, gain: 0.09
      });
    }
  },

  // Смерть врага: короткий pop
  kill(a, o) {
    const t = a.t + (o.delay || 0);
    a._tone({ type: 'triangle', f0: o.big ? 240 : randRange(420, 620), f1: o.big ? 60 : 120, t, dur: o.big ? 0.3 : 0.1, gain: o.big ? 0.3 : 0.12 });
    a._noiseHit({ t, dur: 0.08, gain: 0.09, filter: 'lowpass', fc: 1800, fc1: 400 });
  },

  // Потеря жизни: тревожный низкий тон
  leak(a) {
    const t = a.t;
    a._tone({ type: 'sawtooth', f0: 190, f1: 96, t, dur: 0.5, gain: 0.24, filter: 'lowpass', fc: 700, q: 3 });
    a._tone({ type: 'square', f0: 143, f1: 72, t: t + 0.06, dur: 0.5, gain: 0.14 });
  },

  // Клик интерфейса
  ui(a) {
    const t = a.t;
    a._tone({ type: 'sine', f0: 880, f1: 660, t, dur: 0.06, gain: 0.09 });
    a._noiseHit({ t, dur: 0.02, gain: 0.04, filter: 'highpass', fc: 3000 });
  },

  // Ошибка / нельзя построить
  deny(a) {
    const t = a.t;
    a._tone({ type: 'square', f0: 200, f1: 120, t, dur: 0.16, gain: 0.14, filter: 'lowpass', fc: 900 });
  },

  // Начало волны: горн
  horn(a) {
    const t = a.t;
    const notes = [294, 392, 494];
    notes.forEach((f, i) => {
      a._tone({ type: 'sawtooth', f0: f, t: t + i * 0.13, dur: 0.42, gain: 0.13, filter: 'lowpass', fc: 1400, q: 1.2 });
      a._tone({ type: 'triangle', f0: f * 2, t: t + i * 0.13, dur: 0.3, gain: 0.05 });
    });
    a._noiseHit({ t: t + 0.36, dur: 0.5, gain: 0.1, filter: 'bandpass', fc: 900, fc1: 300, q: 1 });
  },

  // Босс на подходе
  boss(a) {
    const t = a.t;
    a._tone({ type: 'sawtooth', f0: 70, f1: 48, t, dur: 1.4, gain: 0.32, filter: 'lowpass', fc: 320, q: 4 });
    a._tone({ type: 'square', f0: 104, f1: 78, t: t + 0.1, dur: 1.2, gain: 0.12, filter: 'lowpass', fc: 500 });
    for (let i = 0; i < 3; i++) {
      a._noiseHit({ t: t + i * 0.4, dur: 0.24, gain: 0.16, filter: 'lowpass', fc: 600, fc1: 120 });
    }
  },

  // Победа: фанфары мажорной последовательностью
  win(a) {
    const t = a.t;
    const seq = [523, 659, 784, 1046, 784, 1046, 1318];
    seq.forEach((f, i) => {
      a._tone({ type: 'triangle', f0: f, t: t + i * 0.14, dur: 0.42, gain: 0.2 });
      a._tone({ type: 'sine', f0: f / 2, t: t + i * 0.14, dur: 0.4, gain: 0.1 });
    });
    a._noiseHit({ t: t + 0.98, dur: 0.7, gain: 0.12, filter: 'highpass', fc: 4000 });
  },

  // Поражение: низкий мрачный тон
  lose(a) {
    const t = a.t;
    const seq = [392, 349, 294, 196];
    seq.forEach((f, i) => {
      a._tone({ type: 'sawtooth', f0: f, t: t + i * 0.34, dur: 0.8, gain: 0.16, filter: 'lowpass', fc: 700, q: 1.4 });
    });
    a._tone({ type: 'sine', f0: 65, f1: 40, t: t + 1.3, dur: 1.6, gain: 0.3 });
  }
};

void AudioSystem;


/* ==== js/systems/SaveSystem.js ==== */
/* ==========================================================================
   SaveSystem.js — сохранение прогресса в localStorage.

   Структура:
   {
     v: 1,
     unlockedMaps: ['grasslands', ...],
     mapStars:  { grasslands: 3, ... },
     mapBest:   { grasslands: { wave: 20, score: 12345 } },
     totalCoins: 120,
     totalKills: 4321,
     unlockedTowers: ['gatling','glue','missile','tesla'],
     settings: { soundVolume, musicVolume, gameSpeed, muted, showFps }
   }
   Всё обёрнуто в try/catch: в приватном режиме браузеров хранилище
   может быть недоступно — игра при этом остаётся играбельной.
   ========================================================================== */


const DEFAULTS = () => ({
  v: 1,
  unlockedMaps: ['grasslands'],
  mapStars: {},
  mapBest: {},
  totalCoins: 0,
  totalKills: 0,
  unlockedTowers: ['gatling', 'glue', 'missile'],
  settings: {
    soundVolume: 0.8,
    musicVolume: 0.35,
    gameSpeed: 1,
    muted: false,
    showFps: false
  }
});

class SaveSystem {
  constructor() {
    this.data = DEFAULTS();
    this.available = true;
    this.load();
  }

  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return this.data;
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return this.data;
      const d = DEFAULTS();
      // аккуратное слияние, чтобы старая/битая запись не ломала игру
      this.data = {
        v: d.v,
        unlockedMaps: Array.isArray(parsed.unlockedMaps) && parsed.unlockedMaps.length
          ? parsed.unlockedMaps : d.unlockedMaps,
        mapStars: (parsed.mapStars && typeof parsed.mapStars === 'object') ? parsed.mapStars : {},
        mapBest: (parsed.mapBest && typeof parsed.mapBest === 'object') ? parsed.mapBest : {},
        totalCoins: Number(parsed.totalCoins) || 0,
        totalKills: Number(parsed.totalKills) || 0,
        unlockedTowers: Array.isArray(parsed.unlockedTowers) && parsed.unlockedTowers.length
          ? parsed.unlockedTowers : d.unlockedTowers,
        settings: Object.assign({}, d.settings, parsed.settings || {})
      };
      return this.data;
    } catch (e) {
      this.available = false;
      return this.data;
    }
  }

  save() {
    if (!this.available) return false;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(this.data));
      return true;
    } catch (e) {
      this.available = false;
      return false;
    }
  }

  reset() {
    this.data = DEFAULTS();
    this.save();
  }

  /* ------------------------------ карты -------------------------------- */

  isMapUnlocked(id) { return this.data.unlockedMaps.includes(id); }

  unlockMap(id) {
    if (!this.data.unlockedMaps.includes(id)) {
      this.data.unlockedMaps.push(id);
      this.save();
      return true;
    }
    return false;
  }

  stars(id) { return this.data.mapStars[id] || 0; }
  totalStars() {
    return Object.values(this.data.mapStars).reduce((a, b) => a + b, 0);
  }

  /** Записать результат: звёзды только улучшаются, рекорд — максимум */
  recordResult(id, stars, wave, score, coins) {
    const prev = this.data.mapStars[id] || 0;
    if (stars > prev) this.data.mapStars[id] = stars;
    const b = this.data.mapBest[id] || { wave: 0, score: 0 };
    this.data.mapBest[id] = {
      wave: Math.max(b.wave || 0, wave || 0),
      score: Math.max(b.score || 0, score || 0)
    };
    if (coins > 0) this.data.totalCoins += coins;
    this.save();
    return this.data.mapStars[id];
  }

  addKills(n) {
    this.data.totalKills += n;
    this.save();
  }

  /* ------------------------------ башни -------------------------------- */

  isTowerUnlocked(id) { return this.data.unlockedTowers.includes(id); }

  unlockTower(id) {
    if (!this.data.unlockedTowers.includes(id)) {
      this.data.unlockedTowers.push(id);
      this.save();
      return true;
    }
    return false;
  }

  /* ----------------------------- настройки ------------------------------ */

  get settings() { return this.data.settings; }

  setSetting(key, value) {
    this.data.settings[key] = value;
    this.save();
  }

  addCoins(n) {
    this.data.totalCoins = Math.max(0, this.data.totalCoins + n);
    this.save();
  }
}

void SaveSystem;


/* ==== js/systems/EconomySystem.js ==== */
/* ==========================================================================
   EconomySystem.js — деньги, награды, бонусы, продажа.
   Валюта боя — «доллары» ($). Отдельная мета-валюта (монеты/звёзды)
   живёт в SaveSystem и тратится на открытие башен и карт.
   ========================================================================== */


class EconomySystem {
  constructor(game, mapDef) {
    this.game = game;
    this.mapDef = mapDef;
    this.money = mapDef.startMoney ?? CONFIG.START_MONEY;
    this.lives = mapDef.lives ?? CONFIG.START_LIVES;
    this.maxLives = this.lives;
    this.leaks = 0;          // сколько врагов дошло до выхода (для звёзд)
    this.kills = 0;
    this.earned = 0;         // всего заработано за бой
    this.spent = 0;          // всего потрачено
    this.score = 0;
    this.combo = 0;          // серия убийств без протечек
    this.comboTimer = 0;
    this.pulse = 0;          // анимация изменения баланса (для HUD)
    this.pulseDir = 1;
    this.floaters = [];      // всплывающие тексты +N
  }

  get gameOver() { return this.lives <= 0; }

  canAfford(v) { return this.money >= v; }

  add(amount, opts) {
    if (!amount) return;
    this.money += amount;
    if (amount > 0) this.earned += amount;
    this.pulse = 1;
    this.pulseDir = amount > 0 ? 1 : -1;
    if (opts?.float && opts.x !== undefined) {
      this.spawnFloater(opts.x, opts.y, (amount > 0 ? '+' : '') + Math.round(amount), amount > 0 ? '#ffd23f' : '#ff8a8a');
    }
  }

  spend(amount) {
    if (amount > this.money) return false;
    this.money -= amount;
    this.spent += amount;
    this.pulse = 1;
    this.pulseDir = -1;
    return true;
  }

  /** Награда за убийство: базовая награда + бонус за волну + комбо */
  killReward(def, wave, x, y) {
    const base = def.reward || 1;
    const waveBonus = 1 + Math.max(0, (wave - 1)) * 0.04;
    this.combo++;
    this.comboTimer = 3;
    const comboBonus = 1 + Math.min(this.combo, 50) * 0.01;
    const total = Math.max(1, Math.round(base * waveBonus * comboBonus));
    this.add(total, { float: true, x, y });
    this.score += total * 10 + (def.isBoss ? 500 : 0);
    return total;
  }

  /** Бонус за зачистку волны */
  waveBonus(wave) {
    const b = 8 + wave * 3;
    this.add(b);
    return b;
  }

  /** Бонус за досрочный вызов волны */
  earlyBonus(seconds) {
    const b = Math.max(0, Math.floor(seconds * CONFIG.EARLY_SEND_RATIO));
    if (b > 0) this.add(b);
    return b;
  }

  /** Потеря жизни */
  leak(cost, x, y) {
    this.lives = Math.max(0, this.lives - cost);
    this.leaks += 1;
    this.combo = 0;
    this.pulse = 1;
    this.pulseDir = -1;
    this.spawnFloater(x, y, '-' + cost + ' ♥', '#ff6b6b');
    return this.lives;
  }

  /** Цена продажи: 75% от вложенного */
  sellPrice(tower) {
    return Math.floor(tower.invested * CONFIG.SELL_RATIO);
  }

  /** Цена постройки/апгрейда */
  buildCost(id) { return towerTotalCost(id, 1); }
  upgradeCost(tower) {
    const d = tower.def;
    return tower.level >= 3 ? Infinity : d.upCost[tower.level - 1];
  }

  spawnFloater(x, y, text, color) {
    this.game?.texts?.spawn(x, y, text, color || '#ffd23f');
  }

  update(dt) {
    if (this.pulse > 0) this.pulse = Math.max(0, this.pulse - dt * 3);
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.combo = 0;
    }
  }
}

void EconomySystem;


/* ==== js/systems/WaveSystem.js ==== */
/* ==========================================================================
   WaveSystem.js — система волн.

   Формат группы спавна:
     { type, count, interval, delay, entry, hpMul, armorMul, speedMul }

   Волна = 1..5 групп. Между волнами пауза (CONFIG.WAVE_BREAK_TIME) либо
   ручной вызов кнопкой «Следующая волна» с бонусом за досрочный старт.
   Каждые 10 волн — босс + эскорт. В бесконечном режиме сложность растёт
   по тем же формулам без ограничения номера волны.
   ========================================================================== */


const WAVE_STATE = {
  BREAK: 'break',       // отсчёт до следующей волны
  SPAWNING: 'spawning', // идёт спавн групп
  FIGHTING: 'fighting', // все заспавнены, ждём зачистки
  DONE: 'done'          // карта пройдена
};

class WaveSystem {
  /**
   * @param {object} game  — контекст игры (нужен game.spawnEnemy, game.grid)
   * @param {object} mapDef
   */
  constructor(game, mapDef) {
    this.game = game;
    this.mapDef = mapDef;
    this.totalWaves = mapDef.waves || CONFIG.TOTAL_WAVES;
    this.endless = !!mapDef.endless;

    this.wave = 0;                       // номер текущей/последней запущенной волны
    this.state = WAVE_STATE.BREAK;
    this.breakTime = mapDef.firstBreak || 22;
    this.breakTimer = this.breakTime;
    this.groups = [];                    // активные группы текущей волны
    this.spawnedInWave = 0;
    this.killedInWave = 0;
    this.leakedInWave = 0;
    this.waveStartAt = 0;
    this.elapsed = 0;
    this.rng = makeRng(mapDef.seed || 12345);
    this.difficulty = mapDef.difficulty || 1;
    this.onWaveStart = null;             // колбэки
    this.onWaveCleared = null;
    this.pending = [];                   // очередь спавна {t, type, entry, ...}
  }

  get alive() { return this.game.enemies.length; }

  /** Есть ли ещё волны */
  get hasNext() { return this.endless || this.wave < this.totalWaves; }

  /** Номер следующей волны */
  get nextWave() { return this.wave + 1; }

  /** Текущая волна — боссовая? */
  isBossWave(n = this.wave) { return n > 0 && n % 10 === 0; }

  /* ------------------------- генерация состава -------------------------- */

  /**
   * Собрать состав волны n (массив групп).
   * Использует WAVE_MIX (веса по диапазонам волн) + ручные оверрайды карты.
   */
  buildWave(n) {
    const map = this.mapDef;
    // Ручной сценарий карты имеет приоритет
    if (map.waveOverrides && map.waveOverrides[n]) {
      return map.waveOverrides[n].map((g) => Object.assign({}, g));
    }

    const rng = this.rng;
    const diff = this.difficulty;
    const groups = [];

    // базовая численность растёт с волной
    let budget = (5 + n * 1.95) * diff;
    if (this.endless && n > this.totalWaves) budget *= 1 + (n - this.totalWaves) * 0.06;

    // Доступные типы на этой волне
    const pool = WAVE_MIX
      .filter(([type, w, from, to]) => n >= from && n <= to && ENEMY_DEFS[type] && w > 0)
      .filter(([type]) => !(map.banTypes || []).includes(type));

    if (!pool.length) pool.push(['soldier', 1, 1, 99]);

    // Нормируем веса
    let totalW = 0;
    for (const [, w] of pool) totalW += w;

    const groupCount = clamp(1 + Math.floor(n / 4), 1, 5);
    const perGroup = budget / groupCount;

    for (let gi = 0; gi < groupCount; gi++) {
      // выбираем тип группы «рулеткой»
      let r = rng() * totalW;
      let type = pool[0][0];
      for (const [t, w] of pool) {
        r -= w;
        if (r <= 0) { type = t; break; }
      }
      const def = ENEMY_DEFS[type];
      // «стоимость» юнита в бюджете — тяжёлые появляются реже, но пачками меньше
      const unitCost = type === 'tank' ? 5 : type === 'transport' ? 6 : type === 'copter' ? 3 : type === 'biker' ? 2.2 : 1;
      const count = clamp(Math.round(perGroup / unitCost), 1, 26);
      const entry = map.entries.length > 1 ? (gi % map.entries.length) | 0 : 0;

      groups.push({
        type,
        count,
        interval: clamp(randRange(0.34, 0.62) * (def.speed > 70 ? 1.25 : 1), 0.2, 1.2),
        delay: gi === 0 ? 0 : gi * randRange(1.6, 3.4),
        entry,
        hpMul: 1,
        armorMul: 1,
        speedMul: 1
      });
    }

    // Босс каждые 10 волн
    if (this.isBossWave(n)) {
      const bossIndex = Math.floor(n / 10);
      groups.unshift({
        type: 'boss',
        count: bossIndex,
        interval: 4.5,
        delay: 0.5,
        entry: 0,
        hpMul: bossIndex,          // HP 500 * номер босса (плюс общий скейл волны)
        armorMul: 1,
        speedMul: 1,
        isBoss: true
      });
      // эскорт к боссу
      groups.push({
        type: n >= 20 ? 'tank' : 'soldier',
        count: Math.round(6 + n * 0.6),
        interval: 0.4,
        delay: 6,
        entry: map.entries.length > 1 ? 1 : 0,
        hpMul: 1, armorMul: 1, speedMul: 1
      });
    }

    return groups;
  }

  /* ----------------------------- запуск -------------------------------- */

  /** Запустить следующую волну немедленно (кнопка «Next Wave») */
  sendNow() {
    if (this.state === WAVE_STATE.DONE) return 0;
    if (this.state !== WAVE_STATE.BREAK) return 0;
    const bonus = this.earlyBonus();
    this._startWave();
    return bonus;
  }

  /** Бонус за досрочный вызов: оставшиеся секунды * 0.5 монет */
  earlyBonus() {
    return Math.max(0, Math.floor(this.breakTimer * CONFIG.EARLY_SEND_RATIO));
  }

  _startWave() {
    this.wave++;
    this.groups = this.buildWave(this.wave);
    this.pending = [];
    this.spawnedInWave = 0;
    this.killedInWave = 0;
    this.leakedInWave = 0;
    this.waveStartAt = this.elapsed;
    this.state = WAVE_STATE.SPAWNING;

    // Разворачиваем группы в плоскую очередь спавна
    for (const gr of this.groups) {
      for (let i = 0; i < gr.count; i++) {
        this.pending.push({
          t: gr.delay + i * gr.interval,
          type: gr.type,
          entry: gr.entry | 0,
          hpMul: gr.hpMul || 1,
          armorMul: gr.armorMul || 1,
          speedMul: gr.speedMul || 1,
          isBoss: !!gr.isBoss,
          wave: this.wave
        });
      }
    }
    this.pending.sort((a, b) => a.t - b.t);
    this.spawnClock = 0;

    this.onWaveStart?.(this.wave);
  }

  /* ------------------------------ апдейт ------------------------------- */

  update(dt) {
    this.elapsed += dt;

    if (this.state === WAVE_STATE.BREAK) {
      this.breakTimer -= dt;
      if (this.breakTimer <= 0) {
        if (!this.hasNext) {
          this.state = WAVE_STATE.DONE;
          this.onWaveCleared?.(this.wave, true);
        } else {
          this._startWave();
        }
      }
      return;
    }

    if (this.state === WAVE_STATE.SPAWNING) {
      this.spawnClock += dt;
      while (this.pending.length && this.pending[0].t <= this.spawnClock) {
        const p = this.pending.shift();
        this.game.spawnEnemy(p);
        this.spawnedInWave++;
      }
      if (!this.pending.length) this.state = WAVE_STATE.FIGHTING;
    }

    if (this.state === WAVE_STATE.FIGHTING) {
      if (this.game.enemies.length === 0) {
        // волна зачищена
        this.game.onWaveCleared(this.wave);
        if (!this.hasNext) {
          this.state = WAVE_STATE.DONE;
        } else {
          this.state = WAVE_STATE.BREAK;
          this.breakTime = CONFIG.WAVE_BREAK_TIME;
          this.breakTimer = this.breakTime;
        }
      }
    }
  }

  /** Прогресс текущей волны 0..1 (для полоски в HUD) */
  progress() {
    if (this.state === WAVE_STATE.BREAK) return 0;
    const total = this.spawnedInWave + this.pending.length;
    if (!total) return 1;
    return clamp(this.killedInWave / Math.max(1, total), 0, 1);
  }

  /** Сводка для HUD */
  hudInfo() {
    return {
      wave: this.wave,
      total: this.totalWaves,
      state: this.state,
      timer: Math.max(0, this.breakTimer),
      alive: this.game.enemies.length,
      progress: this.progress(),
      boss: this.isBossWave(this.wave) || (this.state !== WAVE_STATE.BREAK && this.isBossWave(this.nextWave)),
      nextBoss: this.isBossWave(this.nextWave),
      earlyBonus: this.earlyBonus()
    };
  }

  onEnemyKilled() { this.killedInWave++; }
  onEnemyLeaked() { this.leakedInWave++; this.killedInWave++; }
}

void WaveSystem;


/* ==== js/systems/UpgradeSystem.js ==== */
/* ==========================================================================
   UpgradeSystem.js — улучшение и продажа башен, смена режима прицеливания.
   Все проверки экономики и пути — здесь, чтобы GameScene не толстел.
   ========================================================================== */


class UpgradeSystem {
  constructor(game) {
    this.game = game;
  }

  canUpgrade(tower) {
    if (!tower || tower.level >= 3) return false;
    return this.game.economy.money >= this.upgradeCost(tower);
  }

  upgradeCost(tower) {
    if (!tower || tower.level >= 3) return Infinity;
    return tower.def.upCost[tower.level - 1];
  }

  /** Улучшить башню. Возвращает true при успехе. */
  upgrade(tower) {
    if (!this.canUpgrade(tower)) return false;
    const cost = this.upgradeCost(tower);
    if (!this.game.economy.spend(cost)) return false;

    tower.level++;
    tower.invested += cost;
    tower.applyLevel();
    tower.buildAnim = 1;              // короткая вспышка «прокачки»

    this.game.audio?.play('upgrade');
    this.game.particles?.burst(tower.x, tower.y - 6, {
      count: 16, color: '#ffd23f', speed: [30, 90], life: [0.35, 0.7], size: [1.5, 3.2], gravity: -20
    });
    this.game.texts?.spawn(tower.x, tower.y - 26, 'УРОВЕНЬ ' + tower.level, '#ffd23f');
    return true;
  }

  /** Продать башню: 75% от вложенного, клетка освобождается, путь пересчитывается */
  sell(tower) {
    if (!tower) return 0;
    const price = Math.floor(tower.invested * CONFIG.SELL_RATIO);
    this.game.removeTower(tower);
    this.game.economy.add(price);
    this.game.audio?.play('sell');
    this.game.texts?.spawn(tower.x, tower.y - 22, '+$' + price, '#6ee36e');
    this.game.particles?.burst(tower.x, tower.y, {
      count: 18, color: '#c3ccd8', speed: [20, 80], life: [0.3, 0.6], size: [1.5, 3], gravity: 120
    });
    return price;
  }

  /** Переключить режим выбора цели по кругу */
  cycleTargetMode(tower) {
    if (!tower) return;
    const i = TARGET_MODES.indexOf(tower.targetMode);
    tower.targetMode = TARGET_MODES[(i + 1) % TARGET_MODES.length];
    this.game.audio?.play('ui');
  }

  /** Суммарная стоимость башни (для UI) */
  static totalInvested(id, level) {
    const d = TOWER_DEFS[id];
    let sum = d.cost;
    for (let i = 0; i < level - 1; i++) sum += d.upCost[i];
    return sum;
  }
}

void UpgradeSystem;


/* ==== js/systems/RenderSystem.js ==== */
/* ==========================================================================
   RenderSystem.js — отрисовка мира.

   Оптимизации:
     • статичный фон (тайлы, дорога, зоны, декор, входы/выходы) запекается
       в offscreen-canvas и перерисовывается только по dirty-флагу сетки;
     • culling: объекты вне видимого прямоугольника не рисуются;
     • сортировка по глубине одним проходом (башни + наземные враги);
     • все спрайты — из процедурного кэша Sprites (ленивая генерация).
   ========================================================================== */


const BG_SCALE = 2;   // фон печатаем в 2x — crisp при зуме до 2x

class RenderSystem {
  constructor(game) {
    this.game = game;
    this.grid = game.grid;
    this.bg = null;
    this.bgVersion = -1;
    this.routeVersion = -1;
    this.routePoints = [];
    this.renderList = [];
    this.debugPath = false;
  }

  get pal() { return CONFIG.PALETTES[this.grid.biome] || CONFIG.PALETTES.grass; }

  /* ============================ СТАТИЧНЫЙ ФОН ========================== */

  ensureBackground() {
    const dirty = this.grid.dirty || !this.bg || this.bgVersion !== this.grid.def.seed;
    if (!dirty && this.bg) return;
    this.grid.dirty = false;
    this.bgVersion = this.grid.def.seed;
    this.buildBackground();
  }

  buildBackground() {
    const g = this.grid;
    const W = g.worldW * BG_SCALE;
    const H = g.worldH * BG_SCALE;
    if (!this.bg || this.bg.width !== W || this.bg.height !== H) {
      this.bg = makeCanvas(W, H);
    }
    const c = ctxOf(this.bg);
    c.setTransform(BG_SCALE, 0, 0, BG_SCALE, 0, 0);
    c.clearRect(0, 0, g.worldW, g.worldH);

    const rng = makeRng(g.def.seed || 1);
    const pal = this.pal;

    // ---- 1. тайлы земли ----
    for (let cy = 0; cy < g.rows; cy++) {
      for (let cx = 0; cx < g.cols; cx++) {
        const v = (rng() * 4) | 0;
        const tile = Sprites.get(`tile.${g.biome}.${v}`);
        if (tile) c.drawImage(tile, cx * CELL, cy * CELL, CELL, CELL);
      }
    }

    // ---- 2. зоны (вода / скалы / лава) ----
    for (const z of (g.zones || [])) this._drawZone(c, z);

    // ---- 3. дорога (только для фиксированных карт) ----
    if (!g.maze && g.pathCells.length) this._drawPath(c, g.pathCells);

    // ---- 4. лёгкая сетка ----
    c.save();
    c.strokeStyle = 'rgba(0,0,0,0.06)';
    c.lineWidth = 1;
    for (let i = 0; i <= g.cols; i++) {
      c.beginPath(); c.moveTo(i * CELL, 0); c.lineTo(i * CELL, g.worldH); c.stroke();
    }
    for (let j = 0; j <= g.rows; j++) {
      c.beginPath(); c.moveTo(0, j * CELL); c.lineTo(g.worldW, j * CELL); c.stroke();
    }
    c.restore();

    // ---- 5. декор ----
    const sorted = g.decor.slice().sort((a, b) => a.cy - b.cy);
    for (const d of sorted) {
      const key = `decor.${d.type}` + (d.type === 'building' ? `.${d.variant || 0}` : '');
      const img = Sprites.get(key) || Sprites.get('decor.rock');
      if (!img) continue;
      const x = cx_(d.cx), y = cy_(d.cy);
      const s = d.scale || 1;
      c.drawImage(img, x - img.width * s / 2, y + CELL * 0.32 - img.height * s, img.width * s, img.height * s);
    }

    // ---- 6. входы и выходы ----
    for (const e of g.entries) this._drawEntry(c, e.cx, e.cy);
    for (const e of g.exits) this._drawExit(c, e.cx, e.cy);

    // ---- 7. виньетка карты ----
    const vg = c.createLinearGradient(0, 0, 0, g.worldH);
    vg.addColorStop(0, 'rgba(0,0,0,0.10)');
    vg.addColorStop(0.25, 'rgba(0,0,0,0)');
    vg.addColorStop(0.75, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.12)');
    c.fillStyle = vg;
    c.fillRect(0, 0, g.worldW, g.worldH);
  }

  _drawZone(c, z) {
    const x = z.x * CELL, y = z.y * CELL;
    const w = z.w * CELL, h = z.h * CELL;
    const rng = makeRng(z.x * 71 + z.y * 13 + z.w * 7);

    if (z.kind === 'water') {
      c.save();
      c.beginPath();
      roundRectPath(c, x + 2, y + 2, w - 4, h - 4, 12);
      c.clip();
      const lg = c.createLinearGradient(x, y, x, y + h);
      lg.addColorStop(0, '#4fb6e8');
      lg.addColorStop(0.5, '#2f8fc8');
      lg.addColorStop(1, '#236fa5');
      c.fillStyle = lg;
      c.fillRect(x, y, w, h);
      c.strokeStyle = 'rgba(255,255,255,0.35)';
      c.lineWidth = 2;
      for (let i = 0; i < 7; i++) {
        const wy = y + 8 + rng() * (h - 14);
        const wx = x + 4 + rng() * (w - 24);
        c.beginPath();
        c.moveTo(wx, wy);
        c.quadraticCurveTo(wx + 7, wy - 3, wx + 14, wy);
        c.stroke();
      }
      c.restore();
      // берег
      c.strokeStyle = 'rgba(0,0,0,0.25)';
      c.lineWidth = 3;
      roundRectPath(c, x + 2, y + 2, w - 4, h - 4, 12);
      c.stroke();
    } else if (z.kind === 'lava') {
      c.save();
      c.beginPath();
      roundRectPath(c, x + 1, y + 1, w - 2, h - 2, 10);
      c.clip();
      const tile = Sprites.get('tile.lavaPool');
      if (tile) {
        for (let j = 0; j < z.h; j++) {
          for (let i = 0; i < z.w; i++) {
            c.drawImage(tile, x + i * CELL, y + j * CELL, CELL, CELL);
          }
        }
      }
      c.restore();
      c.strokeStyle = '#3a1a10';
      c.lineWidth = 3;
      roundRectPath(c, x + 1, y + 1, w - 2, h - 2, 10);
      c.stroke();
    } else {
      // скалы: несколько валунов на зону
      c.save();
      c.fillStyle = 'rgba(0,0,0,0.22)';
      roundRectPath(c, x + 4, y + 6, w - 8, h - 8, 14);
      c.fill();
      const n = Math.max(3, Math.round((w * h) / 900));
      for (let i = 0; i < n; i++) {
        const bx = x + 8 + rng() * (w - 16);
        const by = y + 8 + rng() * (h - 16);
        const r = 7 + rng() * 11;
        const base = this.grid.biome === 'desert' ? '#c2a370' : '#8d8f98';
        c.beginPath();
        c.moveTo(bx - r, by + r * 0.6);
        c.lineTo(bx - r * 0.6, by - r * 0.7);
        c.lineTo(bx + r * 0.3, by - r * 0.9);
        c.lineTo(bx + r, by + r * 0.2);
        c.lineTo(bx + r * 0.6, by + r * 0.75);
        c.closePath();
        c.fillStyle = base;
        c.fill();
        c.lineWidth = 2.2;
        c.strokeStyle = 'rgba(0,0,0,0.55)';
        c.stroke();
        c.beginPath();
        c.moveTo(bx - r * 0.6, by - r * 0.7);
        c.lineTo(bx + r * 0.3, by - r * 0.9);
        c.lineTo(bx + r * 0.1, by - r * 0.1);
        c.closePath();
        c.fillStyle = shade(base, 0.22);
        c.fill();
      }
      c.restore();
    }
  }

  /** Дорога: широкая полилиния по центрам клеток пути */
  _drawPath(c, cells) {
    const g = this.grid;
    const pts = [];
    const p = { x: 0, y: 0 };
    for (const i of cells) {
      g.center(i, p);
      pts.push({ x: p.x, y: p.y });
    }
    if (!pts.length) return;

    // продлеваем до краёв карты (вход/выход)
    const first = pts[0], last = pts[pts.length - 1];
    const entry = g.entries[0];
    const exit = g.exits[0];
    if (entry) {
      const ex = g.centerX(entry.cx), ey = g.centerY(entry.cy);
      if (first.x === ex) pts.unshift({ x: ex + (ex < g.worldW / 2 ? -CELL : CELL), y: ey });
      else pts.unshift({ x: ex, y: ey + (ey < g.worldH / 2 ? -CELL : CELL) });
    }
    if (exit) {
      const ex = g.centerX(exit.cx), ey = g.centerY(exit.cy);
      if (last.x === ex) pts.push({ x: ex + (ex > g.worldW / 2 ? CELL : -CELL), y: ey });
      else pts.push({ x: ex, y: ey + (ey > g.worldH / 2 ? CELL : -CELL) });
    }

    const pal = this.pal;
    const trace = (width, color) => {
      c.beginPath();
      c.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
      c.lineJoin = 'round';
      c.lineCap = 'round';
      c.lineWidth = width;
      c.strokeStyle = color;
      c.stroke();
    };

    // тень под дорогой
    c.save();
    c.translate(0, 3);
    trace(CELL * 0.96, 'rgba(0,0,0,0.16)');
    c.restore();

    trace(CELL * 0.94, pal.pathEdge);     // обочина
    trace(CELL * 0.8, pal.path);          // полотно
    // колеи
    c.save();
    c.globalAlpha = 0.16;
    trace(2.5, '#000');
    c.restore();

    // камешки/пыль на полотне
    const rng = makeRng((g.def.seed || 3) + 555);
    c.save();
    for (const cell of cells) {
      g.center(cell, p);
      for (let k = 0; k < 3; k++) {
        const ox = (rng() - 0.5) * CELL * 0.72;
        const oy = (rng() - 0.5) * CELL * 0.72;
        c.globalAlpha = 0.18 + rng() * 0.22;
        c.fillStyle = rng() < 0.5 ? pal.pathSpeck : '#ffffff';
        c.beginPath();
        c.arc(p.x + ox, p.y + oy, 0.8 + rng() * 1.8, 0, Math.PI * 2);
        c.fill();
      }
    }
    c.restore();

    // травка по краям (для grass)
    if (g.biome === 'grass') {
      c.save();
      c.strokeStyle = '#4f9536';
      c.lineWidth = 1.6;
      for (const cell of cells) {
        g.center(cell, p);
        for (let k = 0; k < 5; k++) {
          const a = rng() * Math.PI * 2;
          const r = CELL * 0.44 + rng() * 4;
          const bx = p.x + Math.cos(a) * r;
          const by = p.y + Math.sin(a) * r;
          c.globalAlpha = 0.5;
          c.beginPath();
          c.moveTo(bx, by);
          c.lineTo(bx + (rng() - 0.5) * 4, by - 3 - rng() * 3);
          c.stroke();
        }
      }
      c.restore();
    }
  }

  /** Вход: тёмный тоннель/бункер на границе карты */
  _drawEntry(c, cx, cy) {
    const g = this.grid;
    const x = g.centerX(cx), y = g.centerY(cy);
    const atLeft = cx <= 0, atRight = cx >= g.cols - 1;
    const atTop = cy <= 0, atBottom = cy >= g.rows - 1;
    const dir = atLeft ? 1 : atRight ? -1 : 0;   // куда «смотрит» зев
    c.save();
    c.translate(x, y);
    if (!dir) c.rotate(atTop ? Math.PI / 2 : -Math.PI / 2);
    else if (dir < 0) c.rotate(Math.PI);

    // мешки с песком по краям
    c.fillStyle = 'rgba(0,0,0,0.28)';
    roundRectPath(c, -CELL * 0.72, -CELL * 0.62, CELL * 0.9, CELL * 1.24, 8);
    c.fill();
    for (let i = -1; i <= 1; i += 2) {
      for (let k = 0; k < 3; k++) {
        c.beginPath();
        c.ellipse(-CELL * 0.42, i * (CELL * 0.28 + k * 0.06), 9, 6.5, 0, 0, Math.PI * 2);
        c.fillStyle = k % 2 ? '#9c8a63' : '#8a7853';
        c.fill();
        c.lineWidth = 1.6;
        c.strokeStyle = 'rgba(0,0,0,0.4)';
        c.stroke();
      }
    }
    // зев тоннеля
    const lg = c.createLinearGradient(-CELL * 0.5, 0, CELL * 0.2, 0);
    lg.addColorStop(0, '#0a0d14');
    lg.addColorStop(0.7, '#22283a');
    lg.addColorStop(1, '#3a4258');
    c.fillStyle = lg;
    roundRectPath(c, -CELL * 0.55, -CELL * 0.42, CELL * 0.78, CELL * 0.84, 6);
    c.fill();
    c.lineWidth = 2.4;
    c.strokeStyle = '#1b2130';
    roundRectPath(c, -CELL * 0.55, -CELL * 0.42, CELL * 0.78, CELL * 0.84, 6);
    c.stroke();
    // красный маркер «отсюда идут»
    c.fillStyle = 'rgba(255,90,90,0.85)';
    c.beginPath();
    c.moveTo(-CELL * 0.05, -6);
    c.lineTo(CELL * 0.22, 0);
    c.lineTo(-CELL * 0.05, 6);
    c.closePath();
    c.fill();
    c.restore();
  }

  /** Выход: защищаемая база с флагом */
  _drawExit(c, cx, cy) {
    const g = this.grid;
    const x = g.centerX(cx), y = g.centerY(cy);
    c.save();
    c.translate(x, y + 2);
    // площадка
    c.fillStyle = 'rgba(0,0,0,0.22)';
    c.beginPath();
    c.ellipse(0, 10, 20, 7, 0, 0, Math.PI * 2);
    c.fill();
    // корпус
    const lg = c.createLinearGradient(0, -18, 0, 12);
    lg.addColorStop(0, '#e8eef7');
    lg.addColorStop(1, '#9fb0c8');
    c.fillStyle = lg;
    roundRectPath(c, -16, -14, 32, 26, 5);
    c.fill();
    c.lineWidth = 2.4;
    c.strokeStyle = '#2b3245';
    roundRectPath(c, -16, -14, 32, 26, 5);
    c.stroke();
    // крыша
    c.fillStyle = '#4f8f3a';
    roundRectPath(c, -19, -20, 38, 8, 3);
    c.fill();
    c.strokeStyle = '#2b3245';
    c.lineWidth = 2.2;
    roundRectPath(c, -19, -20, 38, 8, 3);
    c.stroke();
    // ворота
    c.fillStyle = '#3c4a5c';
    roundRectPath(c, -7, -2, 14, 14, 2);
    c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.25)';
    c.lineWidth = 1.4;
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.moveTo(-7, 2 + i * 4);
      c.lineTo(7, 2 + i * 4);
      c.stroke();
    }
    // флагшток + флаг
    c.strokeStyle = '#c3ccd8';
    c.lineWidth = 2;
    c.beginPath(); c.moveTo(12, -18); c.lineTo(12, -36); c.stroke();
    c.fillStyle = '#ffd23f';
    c.beginPath();
    c.moveTo(12, -36);
    c.lineTo(26, -31);
    c.lineTo(12, -26);
    c.closePath();
    c.fill();
    c.strokeStyle = '#2b3245';
    c.lineWidth = 1.6;
    c.stroke();
    c.restore();
  }

  /* =========================== ДИНАМИЧЕСКИЙ РЕНДЕР ====================== */

  /** Главный вызов: рисует мир в трансформации камеры */
  render(g, cam) {
    this.ensureBackground();
    const view = cam.viewRect;

    // ---- фон ----
    if (this.bg) {
      const sx = Math.max(0, view.x) * BG_SCALE;
      const sy = Math.max(0, view.y) * BG_SCALE;
      const sw = Math.min(this.bg.width - sx, view.w * BG_SCALE);
      const sh = Math.min(this.bg.height - sy, view.h * BG_SCALE);
      if (sw > 0 && sh > 0) {
        g.drawImage(this.bg, sx, sy, sw, sh, sx / BG_SCALE, sy / BG_SCALE, sw / BG_SCALE, sh / BG_SCALE);
      }
    }

    // ---- пульсация лавы ----
    const zones = this.grid.zones || [];
    for (const z of zones) {
      if (z.kind !== 'lava') continue;
      const a = 0.12 + 0.08 * Math.sin(this.game.time * 2.4 + z.x);
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.globalAlpha = a;
      g.fillStyle = '#ff6a1f';
      g.fillRect(z.x * CELL, z.y * CELL, z.w * CELL, z.h * CELL);
      g.restore();
    }

    // ---- подсказка маршрута для maze-карт ----
    if (this.grid.maze) this._renderRouteHint(g);

    // ---- сетка в режиме строительства ----
    if (this.game.buildMode) this._renderBuildGrid(g, view);

    // ---- сущности с сортировкой по глубине ----
    this._renderEntities(g, view);
  }

  _renderRouteHint(g) {
    const path = this.game.path;
    if (this.routeVersion !== path.version) {
      this.routeVersion = path.version;
      this.routePoints = path.routePoints(path.entryRoutes[0]);
    }
    const pts = this.routePoints;
    if (pts.length < 2) return;
    g.save();
    g.globalAlpha = 0.5;
    g.setLineDash([9, 9]);
    g.lineDashOffset = -this.game.time * 26;
    g.lineWidth = 3;
    g.strokeStyle = 'rgba(255,240,200,0.55)';
    g.beginPath();
    g.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
    g.stroke();
    g.setLineDash([]);
    g.restore();
  }

  _renderBuildGrid(g, view) {
    const grid = this.grid;
    const minCx = Math.max(0, Math.floor(view.x / CELL));
    const maxCx = Math.min(grid.cols - 1, Math.ceil((view.x + view.w) / CELL));
    const minCy = Math.max(0, Math.floor(view.y / CELL));
    const maxCy = Math.min(grid.rows - 1, Math.ceil((view.y + view.h) / CELL));

    g.save();
    g.lineWidth = 1;
    g.strokeStyle = 'rgba(255,255,255,0.10)';
    g.beginPath();
    for (let cx = minCx; cx <= maxCx + 1; cx++) {
      g.moveTo(cx * CELL, minCy * CELL);
      g.lineTo(cx * CELL, (maxCy + 1) * CELL);
    }
    for (let cy = minCy; cy <= maxCy + 1; cy++) {
      g.moveTo(minCx * CELL, cy * CELL);
      g.lineTo((maxCx + 1) * CELL, cy * CELL);
    }
    g.stroke();

    // подсветка доступных для строительства клеток
    g.fillStyle = 'rgba(120,230,140,0.07)';
    for (let cy = minCy; cy <= maxCy; cy++) {
      for (let cx = minCx; cx <= maxCx; cx++) {
        if (grid.isBuildableCell(cx, cy)) g.fillRect(cx * CELL + 1, cy * CELL + 1, CELL - 2, CELL - 2);
      }
    }
    g.restore();
  }

  _renderEntities(g, view) {
    const game = this.game;
    const list = this.renderList;
    list.length = 0;

    // башни + наземные враги в один список (сортировка по Y)
    const towers = game.towers;
    for (let i = 0; i < towers.length; i++) {
      const t = towers[i];
      if (!inRect(t.x, t.y, view, 40)) continue;
      list.push({ y: t.y + 14, kind: 0, o: t });
    }
    const enemies = game.enemies;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive || !inRect(e.x, e.y, view, 50)) continue;
      list.push({ y: e.y + (e.flying ? -1000 : 0), kind: 1, o: e });
    }
    list.sort(cmpY);

    for (let i = 0; i < list.length; i++) {
      const it = list[i];
      if (it.kind === 0) it.o.render(g, game.time);
      else it.o.render(g);
    }

    // снаряды и эффекты — поверх
    game.projectiles.render(g);
    game.effects.render(g);
    game.particles.render(g);
    game.particles.renderTexts(g, game.camera);
  }

  /* ======================= ПОДСВЕТКА КЛЕТКИ / ПРЕВЬЮ ==================== */

  /** Зелёная/красная подсветка клетки под пальцем */
  renderCellHighlight(g, cx, cy, ok, label) {
    const x = cx * CELL, y = cy * CELL;
    g.save();
    g.lineWidth = 2.5;
    g.strokeStyle = ok ? 'rgba(110,227,110,0.95)' : 'rgba(255,90,90,0.95)';
    g.fillStyle = ok ? 'rgba(110,227,110,0.22)' : 'rgba(255,90,90,0.22)';
    roundRectPath(g, x + 2, y + 2, CELL - 4, CELL - 4, 6);
    g.fill();
    g.stroke();
    if (!ok) {
      // крест
      g.beginPath();
      g.moveTo(x + 9, y + 9); g.lineTo(x + CELL - 9, y + CELL - 9);
      g.moveTo(x + CELL - 9, y + 9); g.lineTo(x + 9, y + CELL - 9);
      g.lineWidth = 3;
      g.stroke();
    }
    if (label) {
      g.font = '900 10px "Trebuchet MS", sans-serif';
      g.textAlign = 'center';
      g.fillStyle = ok ? '#d9ffd9' : '#ffd9d9';
      g.fillText(label, x + CELL / 2, y - 6);
    }
    g.restore();
  }

  /** Призрак башни при выборе места (полупрозрачная + радиус) */
  renderGhost(g, def, cx, cy, ok) {
    const x = cx * CELL + CELL / 2, y = cy * CELL + CELL / 2;
    const range = def.range ? def.range[0] : CELL * 2.5;
    g.save();
    g.globalAlpha = 0.55;
    g.beginPath();
    g.arc(x, y, range, 0, Math.PI * 2);
    g.fillStyle = ok ? 'rgba(110,227,110,0.12)' : 'rgba(255,90,90,0.12)';
    g.fill();
    g.setLineDash([6, 6]);
    g.lineWidth = 2;
    g.strokeStyle = ok ? 'rgba(110,227,110,0.8)' : 'rgba(255,90,90,0.8)';
    g.stroke();
    g.setLineDash([]);

    const base = Sprites.get('tower.base.0');
    const tur = Sprites.get(`tower.${def.behavior}.0`);
    g.globalAlpha = ok ? 0.75 : 0.4;
    if (base) g.drawImage(base, x - base.width / 2, y - base.height / 2);
    if (tur) g.drawImage(tur, x - tur.width / 2, y - tur.height / 2 - 4);
    g.restore();
  }

  /** Маркеры входов/выходов в рантайме (стрелки, пульсация) */
  renderMarkers(g, time) {
    const grid = this.grid;
    const pulse = 0.5 + 0.5 * Math.sin(time * 3);
    g.save();
    for (const e of grid.entries) {
      const x = grid.centerX(e.cx), y = grid.centerY(e.cy);
      g.globalAlpha = 0.35 + pulse * 0.35;
      g.strokeStyle = '#ff6b6b';
      g.lineWidth = 2.5;
      g.beginPath();
      g.arc(x, y, CELL * 0.62 + pulse * 3, 0, Math.PI * 2);
      g.stroke();
    }
    for (const e of grid.exits) {
      const x = grid.centerX(e.cx), y = grid.centerY(e.cy);
      g.globalAlpha = 0.3 + pulse * 0.3;
      g.strokeStyle = '#6ee36e';
      g.lineWidth = 2.5;
      g.beginPath();
      g.arc(x, y, CELL * 0.7 + pulse * 3, 0, Math.PI * 2);
      g.stroke();
    }
    g.restore();
  }
}

/* ------------------------------ хелперы -------------------------------- */

function cx_(cx) { return cx * CELL + CELL / 2; }
function cy_(cy) { return cy * CELL + CELL / 2; }

function inRect(x, y, r, pad) {
  return x > r.x - pad && x < r.x + r.w + pad && y > r.y - pad && y < r.y + r.h + pad;
}

function cmpY(a, b) { return a.y - b.y; }

function roundRectPath(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

void RenderSystem;


/* ==== js/scenes/Scene.js ==== */
/* ==========================================================================
   Scene.js — базовый класс сцены.
   Сцена получает от Game: update(dt) с фиксированным шагом, render(g)
   в экранных CSS-пикселях и все события ввода.
   ========================================================================== */

class Scene {
  constructor(game) {
    this.game = game;
    /** если true — сцена рисуется поверх предыдущей (пауза, game over) */
    this.transparent = false;
    /** множитель скорости симуляции (1/2/3) — только для игровой сцены */
    this.speed = 1;
    /** сцена сама управляет паузой симуляции */
    this.simPaused = false;
    this.time = 0;
  }

  /** @param {object} params */
  enter(params) { void params; }
  exit() {}

  update(dt) { this.time += dt; }
  render(g) { void g; }

  /* ------------------------- события ввода ----------------------------- */
  onDown(x, y) { void x; void y; }
  onUp(x, y) { void x; void y; }
  onTap(x, y, count) { void x; void y; void count; }
  onDragStart(x, y) { void x; void y; }
  onDrag(dx, dy, x, y) { void dx; void dy; void x; void y; }
  onDragEnd() {}
  onPinch(k, cx, cy) { void k; void cx; void cy; }
  onHover(x, y) { void x; void y; }
  onKey(key, e) { void key; void e; }

  /** Вызывается при смене размера окна/ориентации */
  resize(w, h) { void w; void h; }

  get viewW() { return this.game.viewW; }
  get viewH() { return this.game.viewH; }
}

void Scene;


/* ==== js/scenes/GameHud.js ==== */
/* ==========================================================================
   GameHud.js — внутриигровой интерфейс (рисуется в экранных координатах).

   Состав:
     • слева сверху   — деньги и жизни
     • сверху центр   — номер волны, полоса прогресса, таймер перерыва
     • справа сверху  — пауза и скорость x1/x2/x3
     • снизу центр    — «Следующая волна» (пульсирует в перерыве, бонус $)
     • радиальное меню постройки вокруг тапнутой клетки
     • панель выбранной башни: Улучшить / Продать / Режим цели
     • всплывающие подсказки (toast)

   Все тач-цели ≥ 44×44 px.
   ========================================================================== */


const FONT_HUD = '"Trebuchet MS", "Segoe UI", sans-serif';
const TOUCH = 46;   // минимальный размер тач-цели

class GameHud {
  constructor(scene) {
    this.scene = scene;
    this.game = scene.game;
    this.buttons = {};
    this.radial = null;      // { cx, cy, r, items:[{def, x, y, r, enabled, reason}] }
    this.panel = null;       // панель выбранной башни
    this.toastText = '';
    this.toastColor = '#fff';
    this.toastT = 0;
    this.pressedKey = null;
    this.nextWavePulse = 0;
    this.layout(this.game.viewW, this.game.viewH);
  }

  /* ------------------------------- раскладка --------------------------- */

  layout(w, h) {
    const s = this.game.safe;
    const pad = 8;
    const b = this.buttons;

    // деньги / жизни (слева сверху)
    b.money = { x: s.left + pad, y: s.top + pad, w: 116, h: 34 };
    b.lives = { x: s.left + pad, y: s.top + pad + 40, w: 96, h: 32 };

    // волна (сверху по центру)
    const waveW = Math.min(260, w * 0.42);
    b.wave = { x: w / 2 - waveW / 2, y: s.top + pad, w: waveW, h: 46 };

    // пауза и скорость (справа сверху)
    const rr = 21;
    b.speed = { x: w - s.right - pad - rr * 2, y: s.top + pad, r2: rr, icon: 'icon.ff', label: 'x1' };
    b.pause = { x: w - s.right - pad - rr * 2 - rr * 2 - 10, y: s.top + pad, r2: rr, icon: 'icon.pause' };

    // «следующая волна» (снизу по центру)
    const nwW = Math.min(250, w * 0.44);
    const nwH = 50;
    b.nextWave = {
      x: w / 2 - nwW / 2, y: h - s.bottom - pad - nwH, w: nwW, h: nwH,
      label: 'СЛЕДУЮЩАЯ ВОЛНА', accent: true
    };

    // панель башни (снизу; когда она открыта — кнопка волны уезжает выше)
    const pW = Math.min(360, w - 24);
    const pH = 100;
    b.towerPanel = { x: w / 2 - pW / 2, y: h - s.bottom - pad - pH, w: pW, h: pH };

    this.nextWaveHomeY = b.nextWave.y;
    this.viewW = w;
    this.viewH = h;
  }

  toast(text, color = '#ffd9d9') {
    this.toastText = text;
    this.toastColor = color;
    this.toastT = 2.2;
  }

  /* ----------------------------- радиальное меню ------------------------ */

  /**
   * Открыть меню выбора башни вокруг клетки.
   * @param {number} cx, cy — клетка сетки
   * @param {number} sx, sy — её экранные координаты
   */
  openRadial(cx, cy, sx, sy) {
    const scene = this.scene;
    const defs = scene.availableTowers();
    const n = defs.length;
    if (!n) return;

    const r = clamp(Math.min(this.viewW, this.viewH) * 0.19, 62, 92);
    const iconR = TOUCH / 2;

    // центр меню не должен вылезать за экран
    const mx = clamp(sx, r + iconR + 6, this.viewW - r - iconR - 6);
    const my = clamp(sy, r + iconR + 6 + this.game.safe.top, this.viewH - r - iconR - 6 - this.game.safe.bottom);

    const items = [];
    const start = -Math.PI / 2;
    for (let i = 0; i < n; i++) {
      const a = n === 1 ? start : start + (i / n) * Math.PI * 2;
      const def = defs[i];
      const affordable = scene.economy.money >= def.cost;
      const unlocked = scene.isTowerAvailable(def.id);
      items.push({
        def,
        x: mx + Math.cos(a) * r,
        y: my + Math.sin(a) * r,
        r: iconR,
        angle: a,
        enabled: affordable && unlocked,
        reason: !unlocked ? 'Закрыто' : (!affordable ? 'Нет денег' : '')
      });
    }

    this.radial = { cx, cy, mx, my, r, items, open: 0, closing: false };
    scene.buildMode = true;
    this.game.audio?.play('ui');
  }

  closeRadial() {
    if (!this.radial) return;
    this.radial = null;
    this.scene.buildMode = false;
  }

  /** @returns {object|null} пункт меню под точкой (x, y) */
  radialHit(x, y) {
    if (!this.radial) return null;
    for (const it of this.radial.items) {
      const d = Math.hypot(x - it.x, y - it.y);
      if (d <= it.r + 8) return it;
    }
    return null;
  }

  /* ------------------------------- обработка --------------------------- */

  /**
   * @param {number} count — номер повторного тапа (2 = дабл-тап)
   * @returns {boolean} true, если HUD перехватил тап
   */
  onTap(x, y, count = 1) {
    const b = this.buttons;
    const s = this.scene;

    // радиальное меню — приоритет
    if (this.radial) {
      const it = this.radialHit(x, y);
      if (it) {
        if (!it.enabled) {
          this.toast(it.reason || 'Недоступно');
          this.game.audio?.play('deny');
        } else {
          s.buildTower(this.radial.cx, this.radial.cy, it.def.id);
          this.closeRadial();
        }
        return true;
      }
      // дабл-тап мимо иконок отдаём сцене — это быстрая стройка
      if (count >= 2) {
        this.closeRadial();
        return false;
      }
      this.closeRadial();
      return true;
    }

    // панель башни
    if (this.panel && s.selectedTower) {
      const p = this.panel;
      if (hitRect(p.upgrade, x, y)) { s.doUpgrade(); return true; }
      if (hitRect(p.sell, x, y)) { s.doSell(); return true; }
      if (hitRect(p.target, x, y)) { s.doCycleTarget(); return true; }
      if (hitRect(p.close, x, y)) { s.selectTower(null); return true; }
      if (hitRect(p.box, x, y)) return true;   // тап по панели не проходит в мир
    }

    if (hitRound(b.pause, x, y)) { s.openPause(); return true; }
    if (hitRound(b.speed, x, y)) { s.cycleSpeed(); return true; }
    if (hitRect(b.nextWave, x, y)) { s.sendNextWave(); return true; }
    if (hitRect(b.lives, x, y) || hitRect(b.money, x, y)) return true;

    return false;
  }

  onDown(x, y) {
    const b = this.buttons;
    this.pressedKey =
      hitRound(b.pause, x, y) ? 'pause'
        : hitRound(b.speed, x, y) ? 'speed'
          : hitRect(b.nextWave, x, y) ? 'nextWave'
            : this.panel && hitRect(this.panel.upgrade, x, y) ? 'upgrade'
              : this.panel && hitRect(this.panel.sell, x, y) ? 'sell'
                : this.panel && hitRect(this.panel.target, x, y) ? 'target'
                  : null;
  }

  onUp() { this.pressedKey = null; }

  update(dt) {
    if (this.toastT > 0) this.toastT = Math.max(0, this.toastT - dt);
    this.nextWavePulse += dt;
    if (this.radial) this.radial.open = clamp(this.radial.open + dt * 7, 0, 1);

    // панель башни пересобирается каждый кадр (дёшево: только прямоугольники)
    const s = this.scene;
    if (s.selectedTower) {
      this._layoutTowerPanel(s.selectedTower);
      // кнопка «следующая волна» уезжает над панелью, чтобы не перекрываться
      const tp = this.buttons.towerPanel;
      this.buttons.nextWave.y = Math.max(
        this.game.safe.top + 56,
        Math.min(this.nextWaveHomeY, tp.y - 8 - this.buttons.nextWave.h)
      );
    } else {
      this.panel = null;
      this.buttons.nextWave.y = this.nextWaveHomeY;
    }
  }

  _layoutTowerPanel(tower) {
    const b = this.buttons.towerPanel;
    const x = b.x, y = b.y, w = b.w, h = b.h;
    const upCost = tower.level < 3 ? tower.def.upCost[tower.level - 1] : 0;
    const sell = Math.floor(tower.invested * CONFIG.SELL_RATIO);
    const btnH = 46;
    const gap = 8;
    const bw = (w - 24 - gap * 2) / 3;

    this.panel = {
      box: { x, y, w, h },
      btnH,
      upgrade: {
        x: x + 12, y: y + h - btnH - 10, w: bw, h: btnH,
        label: tower.level < 3 ? 'УЛУЧШИТЬ' : 'МАКС',
        sub: tower.level < 3 ? `$${upCost}` : 'уровень 3',
        icon: 'icon.up',
        enabled: tower.level < 3 && this.scene.economy.money >= upCost,
        pressed: this.pressedKey === 'upgrade'
      },
      sell: {
        x: x + 12 + bw + gap, y: y + h - btnH - 10, w: bw, h: btnH,
        label: 'ПРОДАТЬ', sub: `+$${sell}`, icon: 'icon.sell',
        enabled: true, pressed: this.pressedKey === 'sell'
      },
      target: {
        x: x + 12 + (bw + gap) * 2, y: y + h - btnH - 10, w: bw, h: btnH,
        label: 'ЦЕЛЬ', sub: targetLabel(tower.targetMode), icon: 'icon.target',
        enabled: true, pressed: this.pressedKey === 'target'
      },
      close: { x: x + w - 34, y: y + 6, r2: 14, icon: 'icon.close' }
    };
  }

  /* ------------------------------- отрисовка --------------------------- */

  render(g) {
    const s = this.scene;
    const b = this.buttons;
    const eco = s.economy;
    const wave = s.waves.hudInfo();

    // ---- деньги ----
    const pulse = eco.pulse;
    const scale = 1 + pulse * 0.06 * (eco.pulseDir > 0 ? 1 : -1);
    g.save();
    g.translate(b.money.x + b.money.w / 2, b.money.y + b.money.h / 2);
    g.scale(scale, scale);
    g.translate(-(b.money.x + b.money.w / 2), -(b.money.y + b.money.h / 2));
    Draw.panel(g, b.money.x, b.money.y, b.money.w, b.money.h, 17, { shadow: true, blur: 10 });
    Draw.icon(g, 'icon.coin', b.money.x + 19, b.money.y + b.money.h / 2, 24);
    Draw.text(g, '$' + fmtNum(eco.money), b.money.x + 35, b.money.y + b.money.h / 2 + 1, {
      size: 19, color: pulse > 0.2 ? (eco.pulseDir > 0 ? '#ffe98a' : '#ffb0b0') : '#ffffff', align: 'left'
    });
    g.restore();

    // ---- жизни ----
    Draw.panel(g, b.lives.x, b.lives.y, b.lives.w, b.lives.h, 16, { blur: 10 });
    Draw.icon(g, 'icon.heart', b.lives.x + 17, b.lives.y + b.lives.h / 2, 22);
    const livesCol = eco.lives > eco.maxLives * 0.5 ? '#ffffff'
      : eco.lives > eco.maxLives * 0.25 ? '#ffd23f' : '#ff6b6b';
    Draw.text(g, `${eco.lives}/${eco.maxLives}`, b.lives.x + 31, b.lives.y + b.lives.h / 2 + 1, {
      size: 16, color: livesCol, align: 'left'
    });

    // ---- волна ----
    Draw.panel(g, b.wave.x, b.wave.y, b.wave.w, b.wave.h, 14, { blur: 10 });
    const waveLabel = s.endless
      ? `ВОЛНА ${wave.wave}`
      : `ВОЛНА ${wave.wave}/${wave.total}`;
    Draw.text(g, waveLabel, b.wave.x + b.wave.w / 2, b.wave.y + 15, { size: 15, align: 'center' });

    if (wave.state === WAVE_STATE.BREAK) {
      const t = wave.timer;
      Draw.text(g, `следующая через ${Math.ceil(t)} с`, b.wave.x + b.wave.w / 2, b.wave.y + 32, {
        size: 12, color: '#9fd0ff', align: 'center', weight: 700
      });
      Draw.bar(g, b.wave.x + 12, b.wave.y + b.wave.h - 8, b.wave.w - 24, 4,
        1 - t / Math.max(0.001, s.waves.breakTime), { fill: '#4fd1ff', border: false });
    } else if (wave.state === WAVE_STATE.DONE) {
      Draw.text(g, 'все волны отбиты', b.wave.x + b.wave.w / 2, b.wave.y + 32, {
        size: 12, color: '#6ee36e', align: 'center', weight: 700
      });
    } else {
      Draw.text(g, `врагов: ${wave.alive}${wave.nextBoss || wave.boss ? '  ⚠ БОСС' : ''}`,
        b.wave.x + b.wave.w / 2, b.wave.y + 32, {
          size: 12, color: wave.boss ? '#ff9b9b' : '#9fd0ff', align: 'center', weight: 700
        });
      Draw.bar(g, b.wave.x + 12, b.wave.y + b.wave.h - 8, b.wave.w - 24, 4,
        wave.progress ?? 0, { fill: '#ffd23f', border: false });
    }

    // ---- пауза / скорость ----
    b.speed.label = 'x' + (s.gameSpeed || 1);
    Draw.roundButton(g, Object.assign(b.pause, { pressed: this.pressedKey === 'pause' }));
    Draw.roundButton(g, Object.assign(b.speed, {
      pressed: this.pressedKey === 'speed',
      ring: s.gameSpeed > 1 ? 'rgba(255,210,63,0.9)' : CONFIG.UI.panelStroke,
      color: '#ffd23f'
    }));

    // ---- кнопка следующей волны ----
    const canSend = wave.state === WAVE_STATE.BREAK && s.waves.hasNext;
    const nw = b.nextWave;
    if (wave.state === WAVE_STATE.DONE) {
      nw.label = 'ПОБЕДА';
      nw.sub = '';
      nw.enabled = false;
    } else if (canSend) {
      const p = 0.5 + 0.5 * Math.sin(this.nextWavePulse * 4.2);
      nw.label = 'СЛЕДУЮЩАЯ ВОЛНА';
      nw.sub = wave.earlyBonus > 0 ? `бонус +$${wave.earlyBonus}` : 'готово';
      nw.enabled = true;
      nw.pressed = this.pressedKey === 'nextWave';
      // пульсирующее свечение
      g.save();
      g.globalAlpha = 0.25 + p * 0.35;
      g.shadowColor = '#ffd23f';
      g.shadowBlur = 18 + p * 14;
      Draw.roundRect(g, nw.x - 2, nw.y - 2, nw.w + 4, nw.h + 4, 14);
      g.strokeStyle = '#ffd23f';
      g.lineWidth = 2.5;
      g.stroke();
      g.restore();
    } else {
      nw.label = 'ВОЛНА ИДЁТ';
      nw.sub = `осталось ${wave.alive}`;
      nw.enabled = false;
    }
    Draw.button(g, nw, { size: 16 });

    // ---- радиальное меню ----
    if (this.radial) this._renderRadial(g);

    // ---- панель башни ----
    if (this.panel && s.selectedTower) this._renderTowerPanel(g, s.selectedTower);

    // ---- тост ----
    if (this.toastT > 0) {
      const a = clamp(this.toastT / 0.4, 0, 1);
      g.save();
      g.globalAlpha = a;
      g.font = `900 15px ${FONT_HUD}`;
      const tw = g.measureText(this.toastText).width + 28;
      const tx = this.viewW / 2 - tw / 2;
      const ty = this.game.safe.top + 62;
      Draw.panel(g, tx, ty, tw, 32, 16, { fill: 'rgba(40,20,26,0.9)', strokeColor: 'rgba(255,120,120,0.5)' });
      Draw.text(g, this.toastText, this.viewW / 2, ty + 17, { size: 14, color: this.toastColor, align: 'center' });
      g.restore();
    }

    // ---- подсказка карты (первые секунды) ----
    if (s.time < 7 && !s.demo) {
      const a = clamp((7 - s.time) / 2, 0, 1) * clamp(s.time / 0.6, 0, 1);
      g.save();
      g.globalAlpha = a;
      const tip = s.mapDef.tips || 'Тапните по свободной клетке, чтобы построить башню';
      g.font = `700 14px ${FONT_HUD}`;
      const w = g.measureText(tip).width + 28;
      Draw.panel(g, this.viewW / 2 - w / 2, this.game.safe.top + 96, w, 30, 15,
        { fill: 'rgba(18,26,48,0.85)' });
      Draw.text(g, tip, this.viewW / 2, this.game.safe.top + 111, {
        size: 13, align: 'center', color: '#cfe4ff', weight: 700
      });
      g.restore();
    }
  }

  _renderRadial(g) {
    const r = this.radial;
    const k = r.open;
    g.save();
    // затемнение вокруг + кольцо
    g.globalAlpha = 0.35 * k;
    g.fillStyle = '#000';
    g.beginPath();
    g.arc(r.mx, r.my, r.r + 46, 0, Math.PI * 2);
    g.fill();
    g.globalAlpha = k;
    g.strokeStyle = 'rgba(140,180,255,0.45)';
    g.lineWidth = 2;
    g.setLineDash([5, 5]);
    g.beginPath();
    g.arc(r.mx, r.my, r.r, 0, Math.PI * 2);
    g.stroke();
    g.setLineDash([]);

    for (const it of r.items) {
      const ix = r.mx + (it.x - r.mx) * k;
      const iy = r.my + (it.y - r.my) * k;
      const pressed = this.pressedRadial === it;
      g.save();
      g.globalAlpha = k;
      // круг-подложка
      g.beginPath();
      g.arc(ix, iy, it.r + (pressed ? 1 : 0), 0, Math.PI * 2);
      const grad = g.createLinearGradient(ix, iy - it.r, ix, iy + it.r);
      if (!it.enabled) { grad.addColorStop(0, '#2a2f3d'); grad.addColorStop(1, '#1c202b'); }
      else { grad.addColorStop(0, '#3a5490'); grad.addColorStop(1, '#22304f'); }
      g.fillStyle = grad;
      g.shadowColor = 'rgba(0,0,0,0.5)';
      g.shadowBlur = 8;
      g.fill();
      g.shadowBlur = 0;
      g.lineWidth = 2.2;
      g.strokeStyle = it.enabled ? 'rgba(255,210,63,0.75)' : 'rgba(255,255,255,0.12)';
      g.stroke();

      // миниатюра башни
      const base = Sprites.get('tower.base.0');
      const tur = Sprites.get(`tower.${it.def.behavior}.0`);
      g.globalAlpha = k * (it.enabled ? 1 : 0.38);
      if (base) g.drawImage(base, ix - 15, iy - 17, 30, 30);
      if (tur) g.drawImage(tur, ix - tur.width * 0.42, iy - 14 - tur.height * 0.42, tur.width * 0.84, tur.height * 0.84);
      g.globalAlpha = k;

      // цена
      const costTxt = '$' + it.def.cost;
      g.font = `900 12px ${FONT_HUD}`;
      const cw = g.measureText(costTxt).width + 10;
      Draw.panel(g, ix - cw / 2, iy + it.r - 8, cw, 17, 8, {
        fill: it.enabled ? 'rgba(20,28,48,0.95)' : 'rgba(20,20,26,0.9)',
        strokeColor: it.enabled ? 'rgba(255,210,63,0.5)' : 'rgba(255,255,255,0.1)',
        shadow: false, lineWidth: 1.4
      });
      Draw.text(g, costTxt, ix, iy + it.r + 1, {
        size: 11, align: 'center', color: it.enabled ? '#ffd23f' : '#8a8f9c', weight: 900, stroke: false
      });

      if (!it.enabled && it.reason) {
        Draw.text(g, it.reason, ix, iy - it.r - 8, {
          size: 10, align: 'center', color: '#ff9b9b', weight: 700
        });
      }
      g.restore();
    }

    // подпись клетки в центре
    g.globalAlpha = k;
    Draw.text(g, 'СТРОИТЬ', r.mx, r.my, { size: 11, align: 'center', color: '#9fd0ff', weight: 700 });
    g.restore();
    g.globalAlpha = 1;
  }

  _renderTowerPanel(g, tower) {
    const p = this.panel;
    const d = tower.def;
    Draw.panel(g, p.box.x, p.box.y, p.box.w, p.box.h, 16);

    // иконка
    const base = Sprites.get(`tower.base.${tower.level - 1}`);
    const tur = Sprites.get(`tower.${d.behavior}.${tower.level - 1}`);
    const ix = p.box.x + 30, iy = p.box.y + 30;
    if (base) g.drawImage(base, ix - 20, iy - 20, 40, 40);
    if (tur) g.drawImage(tur, ix - tur.width * 0.55, iy - tur.height * 0.55 - 3, tur.width * 1.1, tur.height * 1.1);

    // название + уровень
    Draw.text(g, d.name.toUpperCase(), ix + 30, p.box.y + 18, { size: 15, align: 'left' });
    // звёздочки уровня
    for (let i = 0; i < 3; i++) {
      Draw.star(g, ix + 34 + i * 17, p.box.y + 36, 7, i < tower.level, i < tower.level ? 1 : 0.35);
    }

    // статы (две строки справа)
    const stats = towerStats(tower).slice(0, 2);
    const sx = p.box.x + p.box.w - 14;
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    for (let i = 0; i < stats.length; i++) {
      const yy = p.box.y + 18 + i * 17;
      g.font = `700 11px ${FONT_HUD}`;
      g.fillStyle = '#9fd0ff';
      g.fillText(stats[i][0], sx - 46, yy);
      g.font = `900 12px ${FONT_HUD}`;
      g.fillStyle = '#ffffff';
      g.fillText(stats[i][1], sx, yy);
    }
    g.textAlign = 'left';

    // кнопки
    Draw.button(g, p.upgrade, { size: 13 });
    Draw.button(g, p.sell, { size: 13 });
    Draw.button(g, p.target, { size: 13 });
    Draw.roundButton(g, Object.assign(p.close, { ring: 'rgba(255,255,255,0.2)' }));
  }
}

/* ------------------------------ хелперы -------------------------------- */

function hitRect(r, x, y) {
  return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

function hitRound(r, x, y) {
  if (!r) return false;
  const cx = r.x + r.r2, cy = r.y + r.r2;
  return Math.hypot(x - cx, y - cy) <= r.r2 + 4;
}

function targetLabel(mode) {
  switch (mode) {
    case TARGET_MODE.LAST: return 'последний';
    case TARGET_MODE.STRONGEST: return 'сильный';
    case TARGET_MODE.WEAKEST: return 'слабый';
    case TARGET_MODE.CLOSEST: return 'ближний';
    case TARGET_MODE.FIRST:
    default: return 'первый';
  }
}

/** Краткие статы башни для панели */
function towerStats(tower) {
  const d = tower.def;
  const out = [];
  if (d.dps) out.push(['DPS', fmtNum(tower.dpsRef)]);
  else out.push(['Урон', fmtNum(tower.damage)]);
  out.push(['Радиус', (tower.range / 40).toFixed(1) + ' кл']);
  if (d.slow) out.push(['Замедл.', Math.round(tower.slow * 100) + '%']);
  if (d.splash) out.push(['Сплэш', (tower.splash / 40).toFixed(1) + ' кл']);
  if (d.chain) out.push(['Цепь', tower.chain + ' цели']);
  out.push(['Цели', d.targets === 'both' ? 'земля+воздух' : 'только земля']);
  return out.slice(0, 4);
}
