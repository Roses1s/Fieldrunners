/* ==== js/scenes/GameOverScene.js ==== */
/* ==========================================================================
   GameOverScene.js — экран победы/поражения (прозрачный оверлей).
   Показывает звёзды рейтинга, статистику боя и начисленные монеты,
   предлагает переиграть, выбрать карту или выйти в меню.
   ========================================================================== */


class GameOverScene extends Scene {
  constructor(game, params = {}) {
    super(game);
    this.transparent = true;
    this.speed = 0;
    this.p = params;
    this.anim = 0;
    this.starAnim = [0, 0, 0];
    this.buttons = {};
    this.pressed = null;
    this.confetti = [];
  }

  enter() {
    this.layout();
    if (this.p.won) this._makeConfetti();
  }

  _makeConfetti() {
    for (let i = 0; i < 70; i++) {
      this.confetti.push({
        x: Math.random() * this.viewW,
        y: -20 - Math.random() * this.viewH * 0.6,
        vy: 60 + Math.random() * 140,
        vx: (Math.random() - 0.5) * 40,
        r: 2 + Math.random() * 4,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 8,
        c: ['#ffd23f', '#4fd1ff', '#6ee36e', '#ff8a5a', '#ffffff'][(Math.random() * 5) | 0]
      });
    }
  }

  layout() {
    const w = this.viewW, h = this.viewH;
    const pw = Math.min(440, w - 28);
    const ph = Math.min(360, h - 20);
    const px = (w - pw) / 2, py = (h - ph) / 2;
    this.panelBox = { x: px, y: py, w: pw, h: ph };

    const bw = (pw - 24 * 2 - 12 * 2) / 3;
    const bh = 48;
    const by = py + ph - bh - 18;
    this.buttons.retry = { x: px + 24, y: by, w: bw, h: bh, label: 'ЕЩЁ РАЗ', icon: 'icon.restart', accent: true };
    this.buttons.maps = { x: px + 24 + bw + 12, y: by, w: bw, h: bh, label: 'КАРТЫ', icon: 'icon.home' };
    this.buttons.menu = { x: px + 24 + (bw + 12) * 2, y: by, w: bw, h: bh, label: 'МЕНЮ', icon: 'icon.gear' };
  }

  resize() { this.layout(); }

  update(dt) {
    this.anim = clamp(this.anim + dt * 3.4, 0, 1);
    const stars = this.p.stars || 0;
    for (let i = 0; i < 3; i++) {
      const target = i < stars ? 1 : 0;
      const delay = 0.25 + i * 0.22;
      if (this.anim > delay && this.starAnim[i] < target) {
        const prev = this.starAnim[i];
        this.starAnim[i] = clamp((this.anim - delay) * 4, 0, 1);
        if (prev === 0 && target === 1) this.game.audio?.play('upgrade');
      }
    }
    for (const c of this.confetti) {
      c.y += c.vy * dt;
      c.x += c.vx * dt;
      c.rot += c.vr * dt;
      if (c.y > this.viewH + 20) {
        c.y = -20;
        c.x = Math.random() * this.viewW;
      }
    }
  }

  render(g) {
    const w = this.viewW, h = this.viewH;
    const p = this.p;

    g.save();
    g.globalAlpha = 0.72 * this.anim;
    g.fillStyle = p.won ? '#04121a' : '#12060a';
    g.fillRect(0, 0, w, h);
    g.restore();

    // конфетти при победе
    if (p.won) {
      g.save();
      g.globalAlpha = 0.9 * this.anim;
      for (const c of this.confetti) {
        g.save();
        g.translate(c.x, c.y);
        g.rotate(c.rot);
        g.fillStyle = c.c;
        g.fillRect(-c.r, -c.r * 0.5, c.r * 2, c.r);
        g.restore();
      }
      g.restore();
    }

    const k = 0.9 + 0.1 * this.anim;
    g.save();
    g.translate(w / 2, h / 2);
    g.scale(k, k);
    g.translate(-w / 2, -h / 2);

    const box = this.panelBox;
    Draw.panel(g, box.x, box.y, box.w, box.h, 22);

    // заголовок
    const title = p.won ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ';
    Draw.text(g, title, w / 2, box.y + 40, {
      size: 34, align: 'center', color: p.won ? '#ffd23f' : '#ff6b6b'
    });
    Draw.text(g, p.won ? 'Все волны отбиты, база устояла' : 'База пала — враги прорвались',
      w / 2, box.y + 64, { size: 13, align: 'center', color: '#9fd0ff', weight: 700 });

    // звёзды
    const starY = box.y + 100;
    for (let i = 0; i < 3; i++) {
      const a = this.starAnim[i];
      const s = 20 * (0.4 + 0.6 * a) + (a >= 1 ? Math.sin(this.anim * 6 + i) * 0.8 : 0);
      Draw.star(g, w / 2 + (i - 1) * 52, starY, s, i < (p.stars || 0), clamp(a * 1.4, 0, 1));
    }

    // статистика
    const rows = [
      ['Карта', mapName(p.mapId)],
      ['Волна', String(p.wave || 0)],
      ['Убито врагов', String(p.kills || 0)],
      ['Пропущено', String(p.leaks || 0)],
      ['Очки', String(Math.round(p.score || 0))]
    ];
    let ry = starY + 38;
    g.save();
    for (const [k1, v1] of rows) {
      Draw.text(g, k1, box.x + 34, ry, { size: 13, align: 'left', color: '#9fd0ff', weight: 700, stroke: false });
      Draw.text(g, v1, box.x + box.w - 34, ry, { size: 14, align: 'right', color: '#ffffff', stroke: false });
      ry += 21;
    }
    g.restore();

    // монеты
    if (p.coins > 0) {
      const cy = ry + 6;
      Draw.icon(g, 'icon.coin', w / 2 - 34, cy, 22);
      Draw.text(g, `+${p.coins} монет`, w / 2 + 6, cy, {
        size: 17, align: 'left', color: '#ffd23f', stroke: false
      });
    }

    Draw.button(g, Object.assign(this.buttons.retry, { pressed: this.pressed === 'retry' }));
    Draw.button(g, Object.assign(this.buttons.maps, { pressed: this.pressed === 'maps' }));
    Draw.button(g, Object.assign(this.buttons.menu, { pressed: this.pressed === 'menu' }));

    g.restore();
  }

  onTap(x, y) {
    const b = this.buttons;
    if (hit(b.retry, x, y)) {
      this.game.audio?.play('ui');
      this.game.replaceScene(new GameScene(this.game, {
        mapId: this.p.mapId, endless: this.p.endless
      }));
      return;
    }
    if (hit(b.maps, x, y)) {
      this.game.audio?.play('ui');
      this.game.replaceScene(new MapSelectScene(this.game));
      return;
    }
    if (hit(b.menu, x, y)) {
      this.game.audio?.play('ui');
      this.game.replaceScene(new MenuScene(this.game));
    }
  }

  onDown(x, y) {
    const b = this.buttons;
    this.pressed = Object.keys(b).find((k) => hit(b[k], x, y)) || null;
  }

  onUp() { this.pressed = null; }
  onKey(key) { if (key === 'Enter' || key === ' ') this.onTap(this.buttons.retry.x + 4, this.buttons.retry.y + 4); }
}

function mapName(id) {
  const names = { grasslands: 'Зелёная долина', desert: 'Песчаный карьер' };
  return names[id] || id;
}

void GameOverScene;


/* ==== js/scenes/PauseScene.js ==== */
/* ==========================================================================
   PauseScene.js — оверлей паузы поверх GameScene.
   Симуляция снизу заморожена (speed = 0), сцена прозрачная: сначала
   рисуется игровая сцена, затем затемнение и панель.
   ========================================================================== */


class PauseScene extends Scene {
  constructor(game, params = {}) {
    super(game);
    this.transparent = true;
    this.speed = 0;            // нижняя сцена не обновляется
    this.scene = params.scene;
    this.auto = !!params.auto; // пауза из-за сворачивания браузера
    this.anim = 0;
    this.buttons = {};
    this.pressed = null;
  }

  enter() {
    this.layout();
    if (this.scene) this.scene.simPaused = true;
    this.game.audio?.play('ui');
  }

  exit() {
    if (this.scene) this.scene.simPaused = false;
  }

  layout() {
    const w = this.viewW, h = this.viewH;
    const s = this.game.safe;
    const pw = Math.min(420, w - 32);
    const ph = Math.min(340, h - 24);
    const px = (w - pw) / 2;
    const py = (h - ph) / 2;
    const bw = pw - 48;
    const bh = 50;
    let by = py + 74;

    this.panelBox = { x: px, y: py, w: pw, h: ph };
    this.buttons.resume = { x: px + 24, y: by, w: bw, h: bh, label: 'ПРОДОЛЖИТЬ', icon: 'icon.play', accent: true };
    by += bh + 12;
    this.buttons.restart = { x: px + 24, y: by, w: bw, h: bh, label: 'НАЧАТЬ ЗАНОВО', icon: 'icon.restart' };
    by += bh + 12;
    this.buttons.menu = { x: px + 24, y: by, w: bw, h: bh, label: 'ВЫБОР КАРТЫ', icon: 'icon.home' };
    by += bh + 18;

    // настройки звука — две компактные кнопки в ряд
    const sw = (bw - 10) / 2;
    this.buttons.sound = { x: px + 24, y: by, w: sw, h: 44, label: '', icon: 'icon.sound' };
    this.buttons.music = { x: px + 34 + sw, y: by, w: sw, h: 44, label: '', icon: 'icon.sound' };

    void s;
  }

  resize() { this.layout(); }

  update(dt) {
    this.anim = Math.min(1, this.anim + dt * 5);
  }

  render(g) {
    const w = this.viewW, h = this.viewH;
    // затемнение
    g.save();
    g.globalAlpha = 0.62 * this.anim;
    g.fillStyle = '#05080f';
    g.fillRect(0, 0, w, h);
    g.restore();

    const k = 0.86 + 0.14 * this.anim;
    g.save();
    g.translate(w / 2, h / 2);
    g.scale(k, k);
    g.translate(-w / 2, -h / 2);

    const p = this.panelBox;
    Draw.panel(g, p.x, p.y, p.w, p.h, 20);
    Draw.text(g, this.auto ? 'ПАУЗА' : 'ПАУЗА', w / 2, p.y + 36, { size: 26, align: 'center', color: '#ffd23f' });

    // текущая статистика боя
    if (this.scene) {
      const eco = this.scene.economy;
      const wv = this.scene.waves;
      const info = `Волна ${wv.wave}   •   Убито ${eco.kills}   •   Пропущено ${eco.leaks}`;
      Draw.text(g, info, w / 2, p.y + 58, { size: 12, align: 'center', color: '#9fd0ff', weight: 700 });
    }

    Draw.button(g, Object.assign(this.buttons.resume, { pressed: this.pressed === 'resume' }));
    Draw.button(g, Object.assign(this.buttons.restart, { pressed: this.pressed === 'restart' }));
    Draw.button(g, Object.assign(this.buttons.menu, { pressed: this.pressed === 'menu' }));

    // звук / музыка
    const st = this.game.save.settings;
    const sb = this.buttons.sound;
    sb.icon = st.muted ? 'icon.mute' : 'icon.sound';
    sb.label = st.muted ? 'Звук выкл' : 'Звук вкл';
    sb.size = 13;
    Draw.button(g, Object.assign(sb, { pressed: this.pressed === 'sound' }));

    const mb = this.buttons.music;
    mb.icon = st.musicVolume > 0 ? 'icon.sound' : 'icon.mute';
    mb.label = st.musicVolume > 0 ? 'Музыка вкл' : 'Музыка выкл';
    mb.size = 13;
    Draw.button(g, Object.assign(mb, { pressed: this.pressed === 'music' }));

    Draw.text(g, 'Жесты: тап — строить, два пальца — зум, свайп — двигать карту',
      w / 2, p.y + p.h - 16, { size: 11, align: 'center', color: 'rgba(234,241,255,0.5)', weight: 700, stroke: false });

    g.restore();
  }

  onTap(x, y) {
    const b = this.buttons;
    if (hit(b.resume, x, y)) { this.game.audio?.play('ui'); this.game.popScene(); return; }
    if (hit(b.restart, x, y)) {
      this.game.audio?.play('ui');
      this.game.replaceScene(new GameScene(this.game, {
        mapId: this.scene?.mapId || 'grasslands',
        endless: this.scene?.endless
      }));
      return;
    }
    if (hit(b.menu, x, y)) {
      this.game.audio?.play('ui');
      this.game.replaceScene(new MapSelectScene(this.game));
      return;
    }
    if (hit(b.sound, x, y)) {
      const st = this.game.save.settings;
      st.muted = !st.muted;
      this.game.save.save();
      this.game.audio?.setMuted(st.muted);
      if (!st.muted) this.game.audio?.play('ui');
      return;
    }
    if (hit(b.music, x, y)) {
      const st = this.game.save.settings;
      st.musicVolume = st.musicVolume > 0 ? 0 : 0.35;
      this.game.save.save();
      this.game.audio?.setVolumes(st.soundVolume, st.musicVolume);
      this.game.audio?.play('ui');
      return;
    }
    // тап вне панели — тоже выход из паузы
    if (!hit(this.panelBox, x, y)) this.game.popScene();
  }

  onDown(x, y) {
    const b = this.buttons;
    this.pressed = Object.keys(b).find((k) => hit(b[k], x, y)) || null;
  }

  onUp() { this.pressed = null; }

  onKey(key) {
    if (key === 'Escape' || key === 'p') this.game.popScene();
  }
}

void PauseScene;


/* ==== js/scenes/MapSelectScene.js ==== */
/* ==========================================================================
   MapSelectScene.js — выбор карты.
   Горизонтальная лента карточек: процедурное превью карты, название,
   звёзды, рекорд, замок для неоткрытых. Отдельная кнопка — бесконечный режим.
   ========================================================================== */


class MapSelectScene extends Scene {
  constructor(game) {
    super(game);
    this.scroll = 0;
    this.targetScroll = 0;
    this.vel = 0;
    this.cards = [];
    this.pressed = null;
    this.buttons = {};
    this.anim = 0;
  }

  enter() {
    this.layout();
    // по умолчанию выбираем первую ещё не пройденную открытую карту
    this.selected = this._defaultSelected();
    this._centerOn(this.selected, true);
  }

  resize() {
    this.layout();
    this._centerOn(this.selected, true);
  }

  _defaultSelected() {
    const save = this.game.save;
    let idx = MAP_ORDER.findIndex((id) => save.isMapUnlocked(id) && !save.stars(id));
    if (idx < 0) idx = MAP_ORDER.findIndex((id) => save.isMapUnlocked(id));
    if (idx < 0) idx = 0;
    return idx;
  }

  layout() {
    const w = this.viewW, h = this.viewH;
    const s = this.game.safe;
    this.buttons.back = { x: s.left + 10, y: s.top + 10, r2: 21, icon: 'icon.home' };

    // карточки
    const cardW = clamp(Math.min(w * 0.34, 250), 150, 250);
    const cardH = clamp(h - s.top - s.bottom - 108, 150, 300);
    const gap = 18;
    const total = MAP_ORDER.length * (cardW + gap) - gap;
    this.cardW = cardW;
    this.cardH = cardH;
    this.gap = gap;
    this.cards = MAP_ORDER.map((id, i) => ({
      id,
      x: i * (cardW + gap),
      y: s.top + 62,
      w: cardW,
      h: cardH
    }));
    this.contentW = total;
    this.maxScroll = Math.max(0, total - (w - 40));
    this.scroll = clamp(this.scroll, 0, this.maxScroll);
    this.playBtn = {
      x: w / 2 - 130, y: h - s.bottom - 58, w: 122, h: 48,
      label: 'ИГРАТЬ', icon: 'icon.play', accent: true
    };
    this.endlessBtn = {
      x: w / 2 + 8, y: h - s.bottom - 58, w: 122, h: 48,
      label: 'БЕСКОНЕЧНО', icon: 'icon.wave'
    };
    this.selected = clamp(this.selected ?? 0, 0, MAP_ORDER.length - 1);
  }

  update(dt) {
    this.anim = Math.min(1, this.anim + dt * 3);
    if (this.dragging) {
      this.targetScroll = this.scroll;
      return;
    }
    // инерция после броска
    if (Math.abs(this.vel) > 2) {
      this.targetScroll = clamp(this.targetScroll + this.vel * dt, 0, this.maxScroll);
      this.vel *= Math.exp(-5 * dt);
      // во время инерции выбираем карточку под центром
      this.selected = this._nearestToCenter();
    } else {
      this.vel = 0;
      this.targetScroll = this._scrollForIndex(this.selected);
    }
    // плавный доезд к выбранной карточке
    const k = Math.min(1, dt * 11);
    this.scroll += (this.targetScroll - this.scroll) * k;
    if (Math.abs(this.targetScroll - this.scroll) < 0.4) this.scroll = this.targetScroll;
    this.scroll = clamp(this.scroll, 0, this.maxScroll);
  }

  _scrollForIndex(i) {
    const c = this.cards[clamp(i, 0, this.cards.length - 1)];
    if (!c) return 0;
    return clamp(c.x + c.w / 2 - (this.viewW - 40) / 2, 0, this.maxScroll);
  }

  _nearestToCenter() {
    const center = this.scroll + (this.viewW - 40) / 2;
    let best = 0, bd = Infinity;
    this.cards.forEach((c, i) => {
      const d = Math.abs(c.x + c.w / 2 - center);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }

  render(g) {
    const w = this.viewW, h = this.viewH;
    const s = this.game.safe;

    // фон
    const bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#16233f');
    bg.addColorStop(1, '#0a1020');
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
    // декоративные «холмы»
    g.save();
    g.globalAlpha = 0.16;
    for (let i = 0; i < 3; i++) {
      g.fillStyle = ['#4fd1ff', '#6ee36e', '#ffd23f'][i];
      g.beginPath();
      g.ellipse(w * (0.2 + i * 0.3), h * 1.05, w * 0.42, h * 0.42, 0, 0, Math.PI * 2);
      g.fill();
    }
    g.restore();

    Draw.text(g, 'ВЫБОР КАРТЫ', w / 2, s.top + 32, { size: 24, align: 'center', color: '#ffd23f' });
    Draw.text(g, `Звёзд собрано: ${this.game.save.totalStars()}   •   Монет: ${this.game.save.data.totalCoins}`,
      w / 2, s.top + 52, { size: 12, align: 'center', color: '#9fd0ff', weight: 700 });

    // лента карточек
    g.save();
    g.translate(20 - this.scroll, 0);
    this.cards.forEach((c, i) => {
      if (c.x - this.scroll > w + 40 || c.x - this.scroll + c.w < -40) return;
      this._renderCard(g, c, i, i === this.selected);
    });
    g.restore();

    // индикаторы прокрутки
    if (this.maxScroll > 0) {
      const n = this.cards.length;
      for (let i = 0; i < n; i++) {
        const dx = w / 2 + (i - (n - 1) / 2) * 16;
        g.beginPath();
        g.arc(dx, this.cards[0].y + this.cardH + 16, i === this.selected ? 5 : 3.4, 0, Math.PI * 2);
        g.fillStyle = i === this.selected ? '#ffd23f' : 'rgba(255,255,255,0.3)';
        g.fill();
      }
    }

    // кнопки запуска
    const id = MAP_ORDER[this.selected];
    const unlocked = this.game.save.isMapUnlocked(id);
    this.playBtn.enabled = unlocked;
    this.playBtn.sub = unlocked ? '' : 'закрыто';
    this.endlessBtn.enabled = unlocked && (this.game.save.stars(id) || 0) > 0;
    this.endlessBtn.sub = this.endlessBtn.enabled ? '' : 'нужна 1 звезда';
    Draw.button(g, Object.assign(this.playBtn, { pressed: this.pressed === 'play' }));
    Draw.button(g, Object.assign(this.endlessBtn, { pressed: this.pressed === 'endless' }));

    Draw.roundButton(g, Object.assign(this.buttons.back, { pressed: this.pressed === 'back' }));
  }

  _renderCard(g, c, index, selected) {
    const def = getMap(c.id);
    const save = this.game.save;
    const unlocked = save.isMapUnlocked(c.id);
    const stars = save.stars(c.id);
    const best = save.data.mapBest[c.id];

    g.save();
    // лёгкий «подскок» выбранной карточки
    const lift = selected ? -6 : 0;
    g.translate(0, lift);

    Draw.panel(g, c.x, c.y, c.w, c.h, 16, {
      fill: selected ? 'rgba(30,44,78,0.95)' : 'rgba(20,29,54,0.9)',
      strokeColor: selected ? 'rgba(255,210,63,0.85)' : CONFIG.UI.panelStroke,
      lineWidth: selected ? 3 : 2
    });

    // превью карты
    const pw = c.w - 20, ph = Math.min(c.h * 0.46, 130);
    const px = c.x + 10, py = c.y + 10;
    g.save();
    g.beginPath();
    g.rect(px, py, pw, ph);
    g.clip();
    drawMapPreview(g, def, px, py, pw, ph);
    g.restore();
    g.strokeStyle = 'rgba(0,0,0,0.4)';
    g.lineWidth = 2;
    g.strokeRect(px, py, pw, ph);

    // название
    Draw.text(g, def.name.toUpperCase(), c.x + c.w / 2, py + ph + 22, {
      size: clamp(c.w * 0.075, 13, 17), align: 'center'
    });
    Draw.text(g, `${def.cols}×${def.rows}  •  ${def.maze ? 'лабиринт' : 'путь фикс.'}`,
      c.x + c.w / 2, py + ph + 40, { size: 11, align: 'center', color: '#9fd0ff', weight: 700, stroke: false });

    // звёзды
    const sy = py + ph + 62;
    for (let i = 0; i < 3; i++) {
      Draw.star(g, c.x + c.w / 2 + (i - 1) * 26, sy, 11, i < stars, 1);
    }

    // рекорд
    if (best && best.wave) {
      Draw.text(g, `рекорд: волна ${best.wave}  •  ${Math.round(best.score)} очк.`,
        c.x + c.w / 2, c.y + c.h - 14, { size: 10, align: 'center', color: 'rgba(234,241,255,0.55)', weight: 700, stroke: false });
    }

    // замок
    if (!unlocked) {
      g.fillStyle = 'rgba(6,10,20,0.72)';
      g.fillRect(c.x, c.y, c.w, c.h);
      const img = Sprites.get('icon.lock');
      const isz = 40;
      if (img) g.drawImage(img, c.x + c.w / 2 - isz / 2, c.y + c.h / 2 - isz / 2 - 10, isz, isz);
      Draw.text(g, 'ПРОЙДИТЕ ПРЕДЫДУЩУЮ', c.x + c.w / 2, c.y + c.h / 2 + 26, {
        size: 11, align: 'center', color: '#cfe4ff', weight: 700
      });
    }
    g.restore();
    void index;
  }

  /* -------------------------------- ввод -------------------------------- */

  onTap(x, y) {
    if (hit(this.buttons.back, x, y)) {
      this.game.audio?.play('ui');
      this.game.replaceScene(new MenuScene(this.game));
      return;
    }
    if (hit(this.playBtn, x, y)) { this._start(false); return; }
    if (hit(this.endlessBtn, x, y)) { this._start(true); return; }

    // тап по карточке — выбрать/прокрутить
    const cx = x - 20 + this.scroll;
    for (let i = 0; i < this.cards.length; i++) {
      const c = this.cards[i];
      if (cx >= c.x && cx <= c.x + c.w && y >= c.y && y <= c.y + c.h + 8) {
        if (i !== this.selected) {
          this.selected = i;
          this._centerOn(i);
          this.game.audio?.play('ui');
        } else {
          this._start(false);
        }
        return;
      }
    }
  }

  _start(endless) {
    const id = MAP_ORDER[this.selected];
    if (!this.game.save.isMapUnlocked(id)) {
      this.game.audio?.play('deny');
      return;
    }
    if (endless && !(this.game.save.stars(id) > 0)) {
      this.game.audio?.play('deny');
      return;
    }
    this.game.audio?.play('build');
    this.game.replaceScene(new GameScene(this.game, { mapId: id, endless }));
  }

  _centerOn(i, instant = false) {
    this.selected = clamp(i, 0, this.cards.length - 1);
    this.targetScroll = this._scrollForIndex(this.selected);
    if (instant) this.scroll = this.targetScroll;
    this.vel = 0;
  }

  onDown(x, y) {
    this.pressed =
      hit(this.buttons.back, x, y) ? 'back'
        : hit(this.playBtn, x, y) ? 'play'
          : hit(this.endlessBtn, x, y) ? 'endless' : null;
    this.dragging = true;
    this.dragX = x;
    this.vel = 0;
  }

  onDrag(dx) {
    if (!this.dragging) return;
    this.scroll = clamp(this.scroll - dx, 0, this.maxScroll);
    this.vel = -dx * 60;
  }

  onDragEnd() {
    this.dragging = false;
    // «магнитим» ближайшую карточку к центру
    this._centerOn(this._nearestToCenter());
  }
  onUp() { this.pressed = null; }

  onPinch() { /* зум на экране выбора карты не нужен */ }

  onKey(key) {
    if (key === 'ArrowRight' && this.selected < this.cards.length - 1) { this.selected++; this._centerOn(this.selected); }
    if (key === 'ArrowLeft' && this.selected > 0) { this.selected--; this._centerOn(this.selected); }
    if (key === 'Enter') this._start(false);
    if (key === 'Escape') this.game.replaceScene(new MenuScene(this.game));
  }
}

/* ==========================================================================
   Процедурное превью карты (миниатюра для карточки выбора)
   ========================================================================== */

function drawMapPreview(g, def, x, y, w, h) {
  const pal = CONFIG.PALETTES[def.biome] || CONFIG.PALETTES.grass;
  const cw = w / def.cols, ch = h / def.rows;

  // земля
  g.fillStyle = pal.ground[0];
  g.fillRect(x, y, w, h);
  for (let i = 0; i < def.cols * def.rows * 0.35; i++) {
    g.fillStyle = pal.ground[(Math.random() * pal.ground.length) | 0];
    g.globalAlpha = 0.5;
    const px = x + Math.random() * w, py = y + Math.random() * h;
    g.fillRect(px, py, cw * 0.8, ch * 0.8);
  }
  g.globalAlpha = 1;

  // зоны
  for (const z of (def.zones || [])) {
    g.fillStyle = z.kind === 'water' ? '#2f8fc8' : (z.kind === 'lava' ? '#ff6a1f' : '#8d8f98');
    g.fillRect(x + z.x * cw, y + z.y * ch, z.w * cw, z.h * ch);
  }

  // дорога
  if (def.path && def.path.length) {
    g.beginPath();
    g.moveTo(x + (def.path[0][0] + 0.5) * cw, y + (def.path[0][1] + 0.5) * ch);
    for (let i = 1; i < def.path.length; i++) {
      g.lineTo(x + (def.path[i][0] + 0.5) * cw, y + (def.path[i][1] + 0.5) * ch);
    }
    g.lineJoin = 'round';
    g.lineCap = 'round';
    g.strokeStyle = pal.pathEdge;
    g.lineWidth = Math.min(cw, ch) * 1.05;
    g.stroke();
    g.strokeStyle = pal.path;
    g.lineWidth = Math.min(cw, ch) * 0.82;
    g.stroke();
  } else {
    // maze-карта: пунктир «как пойдут враги»
    g.setLineDash([4, 4]);
    g.strokeStyle = 'rgba(255,255,255,0.5)';
    g.lineWidth = 2;
    const e0 = def.entries[0], e1 = def.exits[0];
    g.beginPath();
    g.moveTo(x + (e0[0] + 0.5) * cw, y + (e0[1] + 0.5) * ch);
    g.lineTo(x + (e1[0] + 0.5) * cw, y + (e1[1] + 0.5) * ch);
    g.stroke();
    g.setLineDash([]);
  }

  // декор точками
  for (const d of (def.decor || [])) {
    g.fillStyle = d.type === 'rock' ? '#9a9aa2' : (def.biome === 'desert' ? '#3f9e4a' : '#2f7a34');
    g.beginPath();
    g.arc(x + (d.cx + 0.5) * cw, y + (d.cy + 0.5) * ch, Math.min(cw, ch) * 0.3, 0, Math.PI * 2);
    g.fill();
  }

  // вход / выход
  for (const e of (def.entries || [])) {
    g.fillStyle = '#ff5a5a';
    g.beginPath();
    g.arc(x + (e[0] + 0.5) * cw, y + (e[1] + 0.5) * ch, Math.min(cw, ch) * 0.42, 0, Math.PI * 2);
    g.fill();
  }
  for (const e of (def.exits || [])) {
    g.fillStyle = '#6ee36e';
    g.beginPath();
    g.arc(x + (e[0] + 0.5) * cw, y + (e[1] + 0.5) * ch, Math.min(cw, ch) * 0.42, 0, Math.PI * 2);
    g.fill();
  }

  // виньетка
  const vg = g.createLinearGradient(x, y, x, y + h);
  vg.addColorStop(0, 'rgba(0,0,0,0.18)');
  vg.addColorStop(0.5, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.2)');
  g.fillStyle = vg;
  g.fillRect(x, y, w, h);
}

void MapSelectScene;
void MAPS;


/* ==== js/scenes/MenuScene.js ==== */
/* ==========================================================================
   MenuScene.js — главное меню.

   Фон — живая карта в демо-режиме (GameScene с флагом demo: башни строятся
   сами, волны идут бесконечно, ввод отключён), поверх неё затемнение,
   логотип и кнопки. Если демо по какой-то причине не запустилось —
   рисуется запасной градиентный фон.
   ========================================================================== */


class MenuScene extends Scene {
  constructor(game) {
    super(game);
    this.buttons = {};
    this.pressed = null;
    this.overlay = null;      // 'settings' | 'credits' | null
    this.anim = 0;
    this.demo = null;
    this.demoOk = false;
  }

  enter() {
    this.layout();
    this._startDemo();
    this.game.audio?.startMusic();
  }

  exit() {
    this.demo = null;
    this.demoOk = false;
  }

  _startDemo() {
    try {
      this.demo = new GameScene(this.game, { mapId: 'grasslands', demo: true });
      this.demo.enter();
      this.demoOk = true;
    } catch (e) {
      // запасной вариант — просто фон
      this.demo = null;
      this.demoOk = false;
      if (typeof console !== 'undefined') console.warn('[menu] demo failed:', e);
    }
  }

  resize(w, h) {
    this.layout();
    if (this.demo) this.demo.resize(w, h);
  }

  layout() {
    const w = this.viewW, h = this.viewH;
    const s = this.game.safe;
    const bw = Math.min(260, w * 0.42);
    const bh = 52;
    const gap = 12;
    const x = w - s.right - bw - Math.max(18, w * 0.06);
    let y = h / 2 - (bh * 3 + gap * 2) / 2 + 12;

    this.buttons.play = { x, y, w: bw, h: bh + 8, label: 'ИГРАТЬ', icon: 'icon.play', accent: true, size: 22 };
    y += bh + 8 + gap;
    this.buttons.maps = { x, y, w: bw, h: bh, label: 'ВЫБОР КАРТЫ', icon: 'icon.home' };
    y += bh + gap;
    this.buttons.settings = { x, y, w: bw, h: bh, label: 'НАСТРОЙКИ', icon: 'icon.gear' };
    y += bh + gap;
    this.buttons.credits = { x, y, w: bw, h: bh, label: 'ОБ ИГРЕ', icon: 'icon.skull' };

    // кнопки внутри оверлеев
    const pw = Math.min(420, w - 28);
    const ph = Math.min(330, h - 20);
    const px = (w - pw) / 2, py = (h - ph) / 2;
    this.overlayBox = { x: px, y: py, w: pw, h: ph };
    this.ovButtons = {
      close: { x: px + pw - 40, y: py + 8, r2: 15, icon: 'icon.close' },
      sound: { x: px + 24, y: py + 74, w: pw - 48, h: 48, label: '', icon: 'icon.sound' },
      music: { x: px + 24, y: py + 130, w: pw - 48, h: 48, label: '', icon: 'icon.sound' },
      fps: { x: px + 24, y: py + 186, w: pw - 48, h: 48, label: '', icon: 'icon.gear' },
      reset: { x: px + 24, y: py + 244, w: pw - 48, h: 44, label: 'СБРОСИТЬ ПРОГРЕСС', icon: 'icon.restart' }
    };
  }

  update(dt) {
    this.anim = Math.min(1, this.anim + dt * 2.2);
    if (this.demo) {
      try { this.demo.update(dt); } catch (e) { this.demoOk = false; }
    }
    if (!this.overlay) this.game.audio?.updateMusic(0.1);
  }

  render(g) {
    const w = this.viewW, h = this.viewH;
    const s = this.game.safe;

    // ---- фон ----
    if (this.demoOk && this.demo) {
      try { this.demo.render(g); } catch (e) { this.demoOk = false; }
    }
    if (!this.demoOk) {
      const bg = g.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#1d3a5f');
      bg.addColorStop(0.6, '#16233f');
      bg.addColorStop(1, '#0a1020');
      g.fillStyle = bg;
      g.fillRect(0, 0, w, h);
    }

    // затемнение слева (под логотипом) и общее
    const lg = g.createLinearGradient(0, 0, w, 0);
    lg.addColorStop(0, 'rgba(5,9,20,0.82)');
    lg.addColorStop(0.55, 'rgba(5,9,20,0.35)');
    lg.addColorStop(1, 'rgba(5,9,20,0.62)');
    g.fillStyle = lg;
    g.fillRect(0, 0, w, h);

    // ---- логотип ----
    const logoSize = clamp(Math.min(w * 0.085, h * 0.17), 26, 54);
    const lx = s.left + Math.max(24, w * 0.06) + logoSize * 2.1;
    const ly = h * 0.3;
    g.save();
    g.globalAlpha = this.anim;
    Draw.logo(g, lx, ly, logoSize);
    g.restore();

    Draw.text(g, 'Tower Defense • построено на Canvas 2D, без единого файла ассетов',
      lx, ly + logoSize * 1.25, {
        size: clamp(logoSize * 0.24, 11, 15), align: 'center',
        color: 'rgba(207,228,255,0.75)', weight: 700
      });

    // ---- прогресс ----
    const save = this.game.save;
    const stars = save.totalStars();
    g.save();
    g.globalAlpha = this.anim;
    const py = ly + logoSize * 1.85;
    Draw.panel(g, lx - 120, py, 240, 40, 14, { fill: 'rgba(14,22,42,0.8)' });
    for (let i = 0; i < 3; i++) {
      Draw.star(g, lx - 78 + i * 20, py + 20, 9, i < Math.min(3, stars));
    }
    Draw.text(g, `${stars} / ${this.game.mapCountTotal() * 3}`, lx - 34, py + 21, {
      size: 13, align: 'left', color: '#cfe4ff', stroke: false
    });
    Draw.icon(g, 'icon.coin', lx + 44, py + 20, 20);
    Draw.text(g, String(save.data.totalCoins), lx + 58, py + 21, {
      size: 14, align: 'left', color: '#ffd23f', stroke: false
    });
    g.restore();

    // ---- кнопки ----
    for (const k of ['play', 'maps', 'settings', 'credits']) {
      const b = this.buttons[k];
      b.pressed = this.pressed === k;
      g.save();
      g.globalAlpha = this.anim;
      Draw.button(g, b);
      g.restore();
    }

    // версия
    Draw.text(g, 'v0.9 prototype', w - s.right - 12, h - s.bottom - 12, {
      size: 10, align: 'right', color: 'rgba(234,241,255,0.35)', weight: 700, stroke: false
    });

    // ---- оверлей ----
    if (this.overlay === 'settings') this._renderSettings(g);
    else if (this.overlay === 'credits') this._renderCredits(g);
  }

  _renderSettings(g) {
    const w = this.viewW, h = this.viewH;
    g.save();
    g.globalAlpha = 0.66;
    g.fillStyle = '#05080f';
    g.fillRect(0, 0, w, h);
    g.restore();

    const b = this.overlayBox;
    Draw.panel(g, b.x, b.y, b.w, b.h, 20);
    Draw.text(g, 'НАСТРОЙКИ', w / 2, b.y + 34, { size: 22, align: 'center', color: '#ffd23f' });

    const st = this.game.save.settings;
    const ob = this.ovButtons;

    ob.sound.label = st.muted ? 'ЗВУК: ВЫКЛ' : `ЗВУК: ${Math.round(st.soundVolume * 100)}%`;
    ob.sound.icon = st.muted ? 'icon.mute' : 'icon.sound';
    ob.sound.sub = 'тап — переключить';
    Draw.button(g, ob.sound, { size: 15 });

    ob.music.label = st.musicVolume > 0 ? 'МУЗЫКА: ВКЛ' : 'МУЗЫКА: ВЫКЛ';
    ob.music.icon = st.musicVolume > 0 ? 'icon.sound' : 'icon.mute';
    ob.music.sub = 'процедурный саундтрек';
    Draw.button(g, ob.music, { size: 15 });

    ob.fps.label = st.showFps ? 'СЧЁТЧИК FPS: ВКЛ' : 'СЧЁТЧИК FPS: ВЫКЛ';
    ob.fps.sub = 'отладочная информация';
    Draw.button(g, ob.fps, { size: 15 });

    ob.reset.sub = 'звёзды, монеты и открытые карты';
    Draw.button(g, ob.reset, { size: 14 });

    Draw.roundButton(g, Object.assign(ob.close, { ring: 'rgba(255,255,255,0.2)' }));
  }

  _renderCredits(g) {
    const w = this.viewW, h = this.viewH;
    g.save();
    g.globalAlpha = 0.66;
    g.fillStyle = '#05080f';
    g.fillRect(0, 0, w, h);
    g.restore();

    const b = this.overlayBox;
    Draw.panel(g, b.x, b.y, b.w, b.h, 20);
    Draw.text(g, 'ОБ ИГРЕ', w / 2, b.y + 34, { size: 22, align: 'center', color: '#ffd23f' });

    const lines = [
      'FIELD DEFENSE — оригинальная браузерная tower defense,',
      'сделанная в жанровой традиции классических TD-хитов.',
      '',
      '• Вся графика генерируется кодом на Canvas 2D — ни одного',
      '  файла картинок: тайлы, башни, юниты, эффекты и иконки.',
      '• Весь звук синтезируется Web Audio API: осцилляторы,',
      '  буфер шума, фильтры и огибающие. Файлов аудио тоже нет.',
      '• Гибридные карты: фиксированная дорога и лабиринт',
      '  (A* + flow field, пересчёт маршрута у всех врагов сразу).',
      '• Баланс башен опирается на публичные гайды жанра:',
      '  Gatling $5 / 35-70-105 DPS, Glue 40-60-75% замедления,',
      '  Missile $20, Tesla $70 / 700-1400-2100 DPS.',
      '',
      'Управление: тап по клетке — стройка, тап по башне — меню,',
      'свайп — панорама, щипок — зум, x1/x2/x3 — скорость боя.'
    ];
    let y = b.y + 62;
    for (const line of lines) {
      Draw.text(g, line, b.x + 22, y, {
        size: 11.5, align: 'left', color: line.startsWith('•') ? '#cfe4ff' : 'rgba(234,241,255,0.78)',
        weight: 700, stroke: false
      });
      y += 16;
    }
    Draw.roundButton(g, Object.assign(this.ovButtons.close, { ring: 'rgba(255,255,255,0.2)' }));
    void CONFIG;
  }

  /* -------------------------------- ввод -------------------------------- */

  onTap(x, y) {
    if (this.overlay) {
      const ob = this.ovButtons;
      const st = this.game.save.settings;
      if (hit(ob.close, x, y) || !hit(this.overlayBox, x, y)) {
        this.game.audio?.play('ui');
        this.overlay = null;
        return;
      }
      if (hit(ob.sound, x, y)) {
        st.muted = !st.muted;
        this.game.save.save();
        this.game.audio?.setMuted(st.muted);
        if (!st.muted) this.game.audio?.play('ui');
        return;
      }
      if (hit(ob.music, x, y)) {
        st.musicVolume = st.musicVolume > 0 ? 0 : 0.35;
        this.game.save.save();
        this.game.audio?.setVolumes(st.soundVolume, st.musicVolume);
        this.game.audio?.play('ui');
        return;
      }
      if (hit(ob.fps, x, y)) {
        st.showFps = !st.showFps;
        this.game.save.save();
        this.game.setDebug(st.showFps);
        this.game.audio?.play('ui');
        return;
      }
      if (hit(ob.reset, x, y)) {
        this.game.save.reset();
        this.game.audio?.play('sell');
        return;
      }
      return;
    }

    const b = this.buttons;
    if (hit(b.play, x, y) || hit(b.maps, x, y)) {
      this.game.audio?.play('build');
      this.game.replaceScene(new MapSelectScene(this.game));
      return;
    }
    if (hit(b.settings, x, y)) {
      this.game.audio?.play('ui');
      this.overlay = 'settings';
      return;
    }
    if (hit(b.credits, x, y)) {
      this.game.audio?.play('ui');
      this.overlay = 'credits';
    }
  }

  onDown(x, y) {
    if (this.overlay) return;
    const b = this.buttons;
    this.pressed = Object.keys(b).find((k) => hit(b[k], x, y)) || null;
  }

  onUp() { this.pressed = null; }

  onKey(key) {
    if (key === 'Escape' && this.overlay) { this.overlay = null; return; }
    if (key === 'Enter') {
      this.game.audio?.unlock();
      this.game.replaceScene(new MapSelectScene(this.game));
    }
  }
}

void MenuScene;


/* ==== js/scenes/GameScene.js ==== */
/* ==========================================================================
   GameScene.js — основной геймплей.

   Сцена владеет всеми системами боя и является «контекстом» (game) для
   сущностей: башни, враги, снаряды и системы обращаются к ней за
   damageEnemy / spawnEnemy / particles / audio / camera и т.д.

   Управление (touch):
     • TAP по пустой клетке      → радиальное меню стройки
     • TAP по башне              → выделение: радиус + панель «улучшить/продать/цель»
     • DOUBLE-TAP по пустой      → быстрая стройка последней башни
     • DRAG                      → панорама карты
     • PINCH                     → зум 0.6x…2.6x
   ========================================================================== */






class GameScene extends Scene {
  constructor(game, params = {}) {
    super(game);
    this.params = params;
    this.mapId = params.mapId || 'grasslands';
    this.endless = !!params.endless;
    this.demo = !!params.demo;
  }

  /* ============================== ЖИЗНЕННЫЙ ЦИКЛ ======================= */

  enter() {
    const G = this.game;
    this.mapDef = Object.assign({}, getMap(this.mapId));
    if (this.endless) {
      this.mapDef.endless = true;
      this.mapDef.waves = 9999;
    }

    // ---- мир ----
    this.grid = new GridSystem(this.mapDef);
    this.path = new PathfindingSystem(this.grid);
    this.worldW = this.grid.worldW;
    this.worldH = this.grid.worldH;

    // ---- системы ----
    this.collision = new CollisionSystem(this.worldW, this.worldH);
    this.particles = new ParticleSystem();
    this.effects = new EffectPool();
    this.projectiles = new ProjectilePool(this);
    this.economy = new EconomySystem(this, this.mapDef);
    this.waves = new WaveSystem(this, this.mapDef);
    this.upgrades = new UpgradeSystem(this);
    this.renderer = new RenderSystem(this);

    /** псевдоним для всплывающих текстов (используется EconomySystem) */
    this.texts = {
      spawn: (x, y, text, color, size, life) =>
        this.particles.spawnText(x, y, text, color, size, life)
    };

    // ---- сущности ----
    this.enemies = [];
    this.towers = [];
    this.selectedTower = null;
    this.hoverCell = null;
    this.buildMode = false;
    this.lastBuiltId = 'gatling';

    // ---- прогрессия ----
    this.hpScale = CONFIG.HP_SCALE_PER_WAVE * (this.mapDef.hpScale || 1);
    this.armorScale = CONFIG.ARMOR_SCALE_PER_WAVE;
    this.speedScale = this.mapDef.speedScale || 1;

    // ---- состояние ----
    this.state = 'playing';      // playing | won | lost
    this.gameSpeed = clamp(G.save.settings.gameSpeed || 1, 1, 3);
    this.speed = this.demo ? 1 : this.gameSpeed;
    this.simPaused = false;
    this.time = 0;
    this.stats = { kills: 0, built: 0, sold: 0, damage: 0, leaked: 0 };

    // ---- камера ----
    G.camera.resize(G.viewW, G.viewH, this.worldW, this.worldH);
    G.camera.setUserZoom(this.demo ? 1 : 1);

    // ---- HUD ----
    this.hud = new GameHud(this);
    this.hud.layout(G.viewW, G.viewH);

    // ---- колбэки волн ----
    this.waves.onWaveStart = (n) => this._onWaveStart(n);

    // ---- демо-режим для фона главного меню ----
    if (this.demo) this._setupDemo();

    G.audio?.startMusic();
  }

  exit() {
    this.enemies.length = 0;
    this.towers.length = 0;
    this.particles.clear();
    this.effects.clear();
    this.projectiles.clear();
  }

  resize(w, h) {
    this.game.camera.resize(w, h, this.worldW, this.worldH);
    this.hud.layout(w, h);
  }

  get audio() { return this.game.audio; }
  get camera() { return this.game.camera; }
  get save() { return this.game.save; }

  /* ================================ ДЕМО =============================== */

  /** Фон главного меню: карта играет сама, без ввода и без проигрыша */
  _setupDemo() {
    this.mapDef.endless = true;
    this.waves.endless = true;
    this.waves.totalWaves = 9999;
    this.economy.money = 400;
    const spots = this._demoSpots();
    for (const [id, cx, cy] of spots) {
      if (!this.grid.isBuildableCell(cx, cy)) continue;
      const def = TOWER_DEFS[id];
      if (!def) continue;
      const t = createTower(this, def, cx, cy);
      t.level = 3;
      t.invested = 200;
      t.applyLevel();
      t.buildAnim = 0;
      this.grid.placeTower(t);
      this.towers.push(t);
    }
    this.path.rebuild();
    this.waves.breakTimer = 1.5;
  }

  _demoSpots() {
    const g = this.grid;
    const out = [];
    // ставим башни вдоль дороги (или в центре для maze-карты)
    const ids = ['gatling', 'missile', 'glue', 'tesla', 'gatling', 'missile'];
    let k = 0;
    for (const cellIdx of g.pathCells) {
      const cx = cellIdx % g.cols, cy = (cellIdx / g.cols) | 0;
      const around = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
      for (const [ax, ay] of around) {
        if (!g.isBuildableCell(ax, ay)) continue;
        if (out.some((o) => o[1] === ax && o[2] === ay)) continue;
        if (k % 3 === 0) out.push([ids[(k / 3 | 0) % ids.length], ax, ay]);
        k++;
        if (out.length >= 9) return out;
      }
    }
    if (!out.length) {
      // maze-карта: стройка вокруг линии входа-выхода
      const midY = (g.rows / 2) | 0;
      for (let cx = 3; cx < g.cols - 4 && out.length < 8; cx += 3) {
        out.push([ids[out.length % ids.length], cx, midY - 2]);
        out.push([ids[(out.length + 2) % ids.length], cx, midY + 2]);
      }
    }
    return out;
  }

  /* ================================ АПДЕЙТ ============================= */

  update(dt) {
    this.time += dt;

    if (this.state !== 'playing') return;

    // 1) волны: спавн
    this.waves.update(dt);

    // 2) башни: прицеливание и выстрелы
    const towers = this.towers;
    for (let i = 0; i < towers.length; i++) towers[i].update(dt);

    // 3) враги: движение и статусы
    const enemies = this.enemies;
    for (let i = 0; i < enemies.length; i++) enemies[i].update(dt);

    // 4) уборка мёртвых (swap-pop, без аллокаций)
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (!enemies[i].alive) {
        enemies[i] = enemies[enemies.length - 1];
        enemies.pop();
      }
    }

    // 5) пространственный хэш — свежий для снарядов
    this.collision.rebuild(enemies);

    // 6) снаряды
    this.projectiles.update(dt);

    // 7) эффекты
    this.effects.update(dt);
    this.particles.update(dt);
    this.economy.update(dt);
    this.camera.update(dt);
    this.hud.update(dt);

    // 8) условия победы/поражения
    this._checkEnd();
  }

  _checkEnd() {
    if (this.demo) {
      // демо не заканчивается: жизни не кончаются, волны бесконечные
      if (this.economy.lives <= 3) this.economy.lives = this.economy.maxLives;
      return;
    }

    if (this.economy.gameOver) {
      this._finish(false);
      return;
    }

    if (!this.endless && this.waves.state === WAVE_STATE.DONE && this.enemies.length === 0) {
      this._finish(true);
    }
  }

  _finish(won) {
    if (this.state !== 'playing') return;
    this.state = won ? 'won' : 'lost';
    this.speed = 0;
    this.audio?.stopMusic();
    this.audio?.play(won ? 'win' : 'lose', { priority: 3 });

    // звёзды и награда
    const leaks = this.economy.leaks;
    let stars = 0;
    if (won) {
      stars = leaks <= CONFIG.STAR_PERFECT_MAX_LEAKS ? 3
        : leaks < CONFIG.STAR_GOOD_MAX_LEAKS ? 2 : 1;
    }
    const coins = Math.round(
      (won ? 20 : 4) + stars * 12 + this.waves.wave * 1.5 + this.economy.kills * 0.05
    );

    if (!this.demo) {
      this.save.addKills(this.economy.kills);
      const best = this.save.recordResult(this.mapId, stars, this.waves.wave, this.economy.score, coins);
      // открываем следующую карту
      if (won) {
        const next = this.game.nextMapAfter(this.mapId);
        if (next) this.save.unlockMap(next);
      }
      this.result = { won, stars, coins, leaks, best };
    }

    this.game.pushScene(new GameOverScene(this.game, {
      scene: this,
      won,
      stars,
      coins,
      wave: this.waves.wave,
      score: this.economy.score,
      kills: this.economy.kills,
      leaks,
      mapId: this.mapId,
      demo: this.demo
    }));
  }

  /* ============================== СПАВН ВРАГОВ ========================== */

  /** Вызывается WaveSystem для каждой записи очереди спавна */
  spawnEnemy(p) {
    const def = ENEMY_DEFS[p.type] || ENEMY_DEFS.soldier;
    const e = createEnemy(this, def, p.entry | 0, p.wave || this.waves.wave, {
      hpMul: p.hpMul, armorMul: p.armorMul, speedMul: p.speedMul, isBoss: p.isBoss
    });
    this.enemies.push(e);
    if (p.isBoss || def.isBoss) {
      this.audio?.play('boss', { priority: 3 });
      this.camera.shake(5, 0.5);
      this.texts.spawn(e.x, e.y - 40, '⚠ БОСС ⚠', '#ff6b6b', 20, 2);
    }
    return e;
  }

  /** Десант из транспорта: пачка врагов в точке гибели носителя */
  spawnSquad(o) {
    const def = ENEMY_DEFS[o.type] || ENEMY_DEFS.soldier;
    const n = o.count || 1;
    for (let i = 0; i < n; i++) {
      const e = createEnemy(this, def, 0, o.wave || this.waves.wave, {
        hpMul: 1, armorMul: 1, speedMul: 1
      });
      const a = (i / n) * Math.PI * 2;
      const r = (o.spread || 6) * (0.4 + (i % 3) * 0.3);
      e.placeAt(o.at.x + Math.cos(a) * r, o.at.y + Math.sin(a) * r * 0.6);
      e.spawnAnim = 0.6;
      this.enemies.push(e);
    }
    this.particles.burst(o.at.x, o.at.y, {
      count: 10, colors: ['#d8d8d8', '#ffd23f'], speed: [20, 70],
      life: [0.3, 0.6], size: [1.5, 3], gravity: 60
    });
  }

  /** Единая точка нанесения урона (башни, снаряды, DoT) */
  damageEnemy(e, amount, type = 'physical', o = {}) {
    if (!e || !e.alive) return 0;
    const dealt = e.takeDamage(amount, type, o);
    this.stats.damage += dealt;
    if (e.hp <= 0) e.die();
    return dealt;
  }

  onEnemyRemoved(e) {
    void e;
    if (this.selectedTower && this.selectedTower.target === e) this.selectedTower.target = null;
  }

  /* ================================ БАШНИ ============================== */

  /** Какие башни доступны игроку на этой карте */
  availableTowers() {
    const allowed = this.mapDef.towers || PROTOTYPE_TOWERS;
    return allowed
      .map((id) => TOWER_DEFS[id])
      .filter((d) => d && this.isTowerAvailable(d.id));
  }

  isTowerAvailable(id) {
    const def = TOWER_DEFS[id];
    if (!def) return false;
    // прототип: доступны все заявленные в PROTOTYPE_TOWERS
    if (PROTOTYPE_TOWERS.includes(id)) return true;
    // остальные — по сумме звёзд
    const stars = this.save.totalStars();
    return stars >= (def.unlock || 0) && this.save.isTowerUnlocked(id);
  }

  /** Клетка занята врагом (строить поверх нельзя) */
  isCellOccupied(cx, cy) {
    if (!this.grid.inBounds(cx, cy)) return true;
    const idx = this.grid.idx(cx, cy);
    const buf = [];
    for (let i = 0; i < this.enemies.length; i++) {
      const e = this.enemies[i];
      if (!e.alive || e.flying) continue;
      e.occupiedCells(buf);
      for (let k = 0; k < buf.length; k++) if (buf[k] === idx) return true;
    }
    return false;
  }

  /** Причина, почему здесь нельзя строить (для подсказки) */
  buildBlockReason(cx, cy) {
    if (!this.grid.inBounds(cx, cy)) return 'Вне карты';
    const t = this.grid.tileAt(cx, cy);
    if (t === TILE.PATH) return 'На дороге';
    if (t === TILE.BLOCKED) return 'Занято';
    if (t === TILE.ENTRY || t === TILE.EXIT) return 'Нельзя';
    if (t === TILE.TOWER || this.grid.towerAt(cx, cy)) return 'Уже занято';
    if (this.isCellOccupied(cx, cy)) return 'Враг в клетке';
    return '';
  }

  canBuildAt(cx, cy) {
    if (!this.grid.isBuildableCell(cx, cy)) return false;
    if (this.isCellOccupied(cx, cy)) return false;
    // проверка связности: входы и все живые враги должны иметь путь к выходу
    const extra = this._srcBuf || (this._srcBuf = []);
    extra.length = 0;
    for (const e of this.enemies) {
      if (!e.alive || e.flying) continue;
      if (e.cellIdx >= 0) extra.push(e.cellIdx);
      if (e.anchorIdx >= 0) extra.push(e.anchorIdx);
    }
    return this.path.canBuildAt(cx, cy, extra);
  }

  buildTower(cx, cy, id) {
    const def = TOWER_DEFS[id];
    if (!def) return false;
    if (!this.isTowerAvailable(id)) {
      this.hud.toast('Башня ещё не открыта');
      this.audio?.play('deny');
      return false;
    }
    if (!this.canBuildAt(cx, cy)) {
      this.hud.toast(this.buildBlockReason(cx, cy) || 'Здесь нельзя строить');
      this.audio?.play('deny');
      return false;
    }
    if (!this.economy.spend(def.cost)) {
      this.hud.toast(`Нужно $${def.cost}`);
      this.audio?.play('deny');
      return false;
    }

    const t = createTower(this, def, cx, cy);
    this.grid.placeTower(t);
    this.towers.push(t);
    this.lastBuiltId = id;
    this.stats.built++;

    // путь пересчитывается — все враги сразу перестроятся
    this.path.rebuild();

    // эффект материализации
    const x = t.x, y = t.y;
    this.effects.spawn(FX.BUILD, { x, y, size: 22, size2: 62, life: 0.5, color: '#8ce8ff' });
    this.effects.spawn(FX.SHOCKWAVE, {
      x, y: y + 8, size: 4, size2: 34, life: 0.34, color: 'rgba(140,232,255,0.9)', width: 3
    });
    this.particles.burst(x, y + 8, {
      count: 16, colors: ['#8ce8ff', '#ffffff', '#4fd1ff'],
      speed: [20, 90], life: [0.3, 0.7], size: [1.2, 3], gravity: -40, drag: 2
    });
    this.audio?.play('build');

    if (!this.demo) this.selectTower(t);
    return true;
  }

  removeTower(tower) {
    const i = this.towers.indexOf(tower);
    if (i >= 0) {
      this.towers[i] = this.towers[this.towers.length - 1];
      this.towers.pop();
    }
    this.grid.removeTower(tower);
    if (this.selectedTower === tower) this.selectTower(null);
    this.path.rebuild();
    this.stats.sold++;
  }

  selectTower(tower) {
    if (this.selectedTower && this.selectedTower !== tower) this.selectedTower.selected = false;
    this.selectedTower = tower || null;
    if (tower) {
      tower.selected = true;
      this.hud.closeRadial();
      this.audio?.play('ui');
    }
  }

  doUpgrade() {
    const t = this.selectedTower;
    if (!t) return;
    if (!this.upgrades.canUpgrade(t)) {
      if (t.level >= 3) this.hud.toast('Максимальный уровень');
      else this.hud.toast(`Нужно $${this.upgrades.upgradeCost(t)}`);
      this.audio?.play('deny');
      return;
    }
    this.upgrades.upgrade(t);
  }

  doSell() {
    const t = this.selectedTower;
    if (!t) return;
    this.upgrades.sell(t);
  }

  doCycleTarget() {
    if (!this.selectedTower) return;
    this.upgrades.cycleTargetMode(this.selectedTower);
    this.hud.toast('Приоритет: ' + this.selectedTower.targetMode, '#cfe4ff');
  }

  /* ================================ ВОЛНЫ ============================== */

  _onWaveStart(n) {
    this.audio?.play('horn', { priority: 3 });
    this.camera.shake(1.5, 0.2);
    if (this.waves.isBossWave(n)) {
      this.texts.spawn(this.worldW / 2, this.worldH / 2, `ВОЛНА ${n}`, '#ff9b9b', 26, 2);
    } else {
      this.texts.spawn(this.worldW / 2, this.worldH / 2 - 20, `ВОЛНА ${n}`, '#ffd23f', 22, 1.4);
    }
  }

  onWaveCleared(wave) {
    const bonus = this.economy.waveBonus(wave);
    this.texts.spawn(this.worldW / 2, this.worldH / 2 + 16, `ВОЛНА ${wave} ОТБИТА  +$${bonus}`, '#6ee36e', 16, 1.6);
    this.audio?.play('upgrade');
    this.economy.score += 100 * wave;
  }

  sendNextWave() {
    if (this.demo) return;
    if (this.waves.state !== WAVE_STATE.BREAK || !this.waves.hasNext) {
      this.audio?.play('deny');
      return;
    }
    const bonus = this.waves.earlyBonus();
    if (bonus > 0) {
      this.economy.earlyBonus(bonus > 0 ? this.waves.breakTimer : 0);
      this.texts.spawn(this.worldW / 2, this.worldH / 2 - 40, `БЫСТРЫЙ СТАРТ +$${bonus}`, '#ffd23f', 16, 1.4);
    }
    this.waves.sendNow();
  }

  cycleSpeed() {
    const list = CONFIG.SPEEDS;
    const i = list.indexOf(this.gameSpeed);
    this.gameSpeed = list[(i + 1) % list.length];
    this.speed = this.gameSpeed;
    this.save.setSetting('gameSpeed', this.gameSpeed);
    this.audio?.play('ui');
  }

  openPause() {
    if (this.demo) return;
    this.game.pushScene(new PauseScene(this.game, { scene: this }));
  }

  restart() {
    this.game.replaceScene(new GameScene(this.game, {
      mapId: this.mapId, endless: this.endless
    }));
  }

  /* ================================ РЕНДЕР ============================= */

  render(g) {
    const cam = this.camera;
    const dpr = this.game.dpr;

    // ---- мир ----
    cam.applyTransform(g, dpr);
    this.renderer.render(g, cam);
    this.renderer.renderMarkers(g, this.time);

    // подсветка клетки под курсором/пальцем
    if (this.hoverCell && !this.demo) {
      const { cx, cy } = this.hoverCell;
      const ok = this.canBuildAt(cx, cy);
      const ghost = this.hud.radial ? null : (this.grid.isBuildableCell(cx, cy) ? this.lastBuiltId : null);
      if (ghost && TOWER_DEFS[ghost]) {
        this.renderer.renderGhost(g, TOWER_DEFS[ghost], cx, cy, ok);
      } else {
        this.renderer.renderCellHighlight(g, cx, cy, ok, ok ? '' : this.buildBlockReason(cx, cy));
      }
    }

    // выделенная башня — радиус и подсветка
    if (this.selectedTower) {
      const t = this.selectedTower;
      t.renderRange(g);
      g.save();
      g.strokeStyle = 'rgba(255,210,63,0.9)';
      g.lineWidth = 2.5;
      g.setLineDash([4, 4]);
      g.lineDashOffset = -this.time * 20;
      g.strokeRect(t.cx * CELL + 2, t.cy * CELL + 2, CELL - 4, CELL - 4);
      g.restore();
    }

    // маркер цели выбранной башни
    if (this.selectedTower?.target?.alive) {
      const t = this.selectedTower.target;
      g.save();
      g.strokeStyle = 'rgba(255,90,90,0.85)';
      g.lineWidth = 1.8;
      const r = t.radius + 5 + Math.sin(this.time * 8) * 1.2;
      g.beginPath();
      g.arc(t.x, t.y - t.altitude, r, 0, Math.PI * 2);
      g.stroke();
      g.beginPath();
      g.moveTo(t.x - r - 4, t.y - t.altitude); g.lineTo(t.x - r + 2, t.y - t.altitude);
      g.moveTo(t.x + r - 2, t.y - t.altitude); g.lineTo(t.x + r + 4, t.y - t.altitude);
      g.stroke();
      g.restore();
    }

    // ---- HUD (экранные координаты) ----
    cam.applyScreen(g, dpr);
    if (!this.demo) this.hud.render(g);
    else this._renderDemoVignette(g);
  }

  _renderDemoVignette(g) {
    const w = this.viewW, h = this.viewH;
    const lg = g.createLinearGradient(0, 0, 0, h);
    lg.addColorStop(0, 'rgba(6,10,22,0.72)');
    lg.addColorStop(0.45, 'rgba(6,10,22,0.30)');
    lg.addColorStop(1, 'rgba(6,10,22,0.86)');
    g.fillStyle = lg;
    g.fillRect(0, 0, w, h);
  }

  /* ================================= ВВОД ============================== */

  onTap(x, y, count = 1) {
    if (this.demo || this.state !== 'playing') return;

    // 1) HUD
    if (this.hud.onTap(x, y, count)) return;

    // 2) мир
    const w = this.camera.screenToWorld(x, y, { x: 0, y: 0 });
    const cell = this.grid.cellFromWorld(w.x, w.y);
    if (!this.grid.inBounds(cell.cx, cell.cy)) {
      this.selectTower(null);
      return;
    }

    const tower = this.grid.towerAt(cell.cx, cell.cy);
    if (tower) {
      this.selectTower(tower === this.selectedTower ? null : tower);
      return;
    }

    // двойной тап — быстрая стройка последней башни
    if (count >= 2 && this.grid.isBuildableCell(cell.cx, cell.cy)) {
      const def = TOWER_DEFS[this.lastBuiltId] || TOWER_DEFS.gatling;
      if (this.economy.money >= def.cost && this.canBuildAt(cell.cx, cell.cy)) {
        this.buildTower(cell.cx, cell.cy, def.id);
        return;
      }
    }

    this.selectTower(null);

    if (this.grid.isBuildableCell(cell.cx, cell.cy)) {
      if (!this.canBuildAt(cell.cx, cell.cy)) {
        this.hud.toast('Нельзя полностью перекрыть путь');
        this.audio?.play('deny');
        return;
      }
      // центр меню — экранная позиция клетки
      const s = this.camera.worldToScreen(
        this.grid.centerX(cell.cx), this.grid.centerY(cell.cy), { x: 0, y: 0 }
      );
      this.hud.openRadial(cell.cx, cell.cy, s.x, s.y);
    } else {
      const reason = this.buildBlockReason(cell.cx, cell.cy);
      if (reason) this.hud.toast(reason);
    }
  }

  onDown(x, y) {
    if (this.demo) return;
    this.hud.onDown(x, y);
  }

  onUp(x, y) {
    this.hud.onUp(x, y);
    void x; void y;
  }

  onDragStart() {
    if (this.demo) return;
    this.hud.closeRadial();
    this.dragging = true;
  }

  onDrag(dx, dy) {
    if (this.demo) return;
    this.camera.pan(dx, dy);
  }

  onDragEnd() { this.dragging = false; }

  onPinch(k, cx, cy) {
    if (this.demo) return;
    this.camera.zoomAt(k, cx, cy);
  }

  onHover(x, y) {
    if (this.demo) return;
    const w = this.camera.screenToWorld(x, y, { x: 0, y: 0 });
    const cell = this.grid.cellFromWorld(w.x, w.y);
    if (this.grid.inBounds(cell.cx, cell.cy)) this.hoverCell = cell;
    else this.hoverCell = null;
  }

  onKey(key) {
    if (this.demo) return;
    switch (key) {
      case ' ': this.sendNextWave(); break;
      case 'Escape':
      case 'p': this.openPause(); break;
      case '1': this.gameSpeed = 1; this.speed = 1; break;
      case '2': this.gameSpeed = 2; this.speed = 2; break;
      case '3': this.gameSpeed = 3; this.speed = 3; break;
      case 'u': this.doUpgrade(); break;
      case 's': this.doSell(); break;
      case 't': this.doCycleTarget(); break;
      case 'g': this.game.debugGrid = !this.game.debugGrid; break;
      default: break;
    }
  }
}

void GameScene;


/* ==== js/game.js ==== */
/* ==========================================================================
   Game.js — ядро: canvas, игровой цикл с фиксированным шагом, стек сцен,
   ввод, звук, сохранения, адаптация под экран и DPR.

   Цикл:
     • requestAnimationFrame → накапливаем реальное время
     • логика обновляется фиксированными шагами 1/60 с (детерминизм)
     • множитель скорости x1/x2/x3 просто «наматывает» время быстрее
     • рендер — один раз за кадр, независимо от числа шагов
   ========================================================================== */


class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    this.scenes = [];
    this.camera = new Camera();
    this.save = new SaveSystem();
    this.audio = new AudioSystem();
    this.input = new TouchInput(canvas);

    this.viewW = 1;
    this.viewH = 1;
    this.dpr = 1;
    this.safe = { top: 0, right: 0, bottom: 0, left: 0 };

    this.acc = 0;
    this.lastTs = 0;
    this.time = 0;
    this.frames = 0;
    this.fps = 60;
    this.fpsAcc = 0;
    this.fpsFrames = 0;
    this.debug = false;
    this.debugGrid = false;
    this.paused = false;          // вкладка скрыта
    this.frameDiv = 1;            // «батарейный» режим: рендер каждый N-й кадр
    this.gestureArmed = false;
    this.booted = false;
  }

  /* ------------------------------- старт ------------------------------- */

  init() {
    this.measureSafeAreas();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 220));

    // звук разблокируется только после жеста пользователя
    const unlock = () => {
      this.audio.unlock();
      const st = this.save.settings;
      this.audio.setVolumes(st.soundVolume, st.musicVolume);
      this.audio.setMuted(st.muted);
      this.tryLockOrientation();
      if (!this.gestureArmed) {
        this.gestureArmed = true;
      }
    };
    window.addEventListener('pointerdown', unlock, { once: false });
    window.addEventListener('keydown', unlock, { once: false });

    // пауза при сворачивании вкладки
    document.addEventListener('visibilitychange', () => this.onVisibility());

    this.setDebug(!!this.save.settings.showFps);
    this.replaceScene(new MenuScene(this));
    this.booted = true;
    return this;
  }

  /** Читаем safe-area-inset через probe-элемент (вырез камеры и т.п.) */
  measureSafeAreas() {
    if (typeof document === 'undefined') return;
    try {
      const d = document.createElement('div');
      d.style.cssText = [
        'position:fixed', 'left:0', 'top:0', 'width:0', 'height:0',
        'pointer-events:none', 'visibility:hidden',
        'padding-top:env(safe-area-inset-top,0px)',
        'padding-right:env(safe-area-inset-right,0px)',
        'padding-bottom:env(safe-area-inset-bottom,0px)',
        'padding-left:env(safe-area-inset-left,0px)'
      ].join(';');
      document.body.appendChild(d);
      const cs = getComputedStyle(d);
      const px = (v) => parseFloat(v) || 0;
      this.safe = {
        top: px(cs.paddingTop),
        right: px(cs.paddingRight),
        bottom: px(cs.paddingBottom),
        left: px(cs.paddingLeft)
      };
      document.body.removeChild(d);
    } catch (e) {
      this.safe = { top: 0, right: 0, bottom: 0, left: 0 };
    }
  }

  /** Пробуем залочить ландшафт (сработает только в fullscreen на Android) */
  tryLockOrientation() {
    try {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      const ori = screen.orientation;
      if (ori && typeof ori.lock === 'function' && document.fullscreenElement) {
        ori.lock('landscape').catch(() => { /* не критично */ });
      } else if (req && window.matchMedia('(pointer: coarse)').matches && !document.fullscreenElement) {
        const p = req.call(el);
        if (p && p.then) {
          p.then(() => {
            if (ori && ori.lock) ori.lock('landscape').catch(() => {});
          }).catch(() => {});
        }
      }
    } catch (e) { /* ignore */ }
  }

  resize() {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    this.dpr = clamp(window.devicePixelRatio || 1, 1, CONFIG.MAX_DPR);
    this.viewW = w;
    this.viewH = h;
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(h * this.dpr);
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.ctx.imageSmoothingEnabled = true;
    this.ctx.imageSmoothingQuality = 'high';

    // пересчитываем раскладку у всех сцен стека: под оверлеем паузы
    // игровая сцена тоже должна получить новый размер экрана
    for (const s of this.scenes) s.resize?.(w, h);
  }

  onVisibility() {
    if (document.hidden) {
      this.paused = true;
      const top = this.topScene;
      if (top instanceof GameScene && !top.demo) {
        // авто-пауза, чтобы волны не шли без игрока
        if (!(this.scenes[this.scenes.length - 1] instanceof PauseScene)) {
          this.pushScene(new PauseScene(this, { scene: top, auto: true }));
        }
      }
      if (this.audio.ready && this.audio.ctx.state === 'running') {
        this.audio.ctx.suspend();
      }
    } else {
      this.paused = false;
      this.lastTs = 0;
      if (this.audio.ready && this.audio.ctx.state === 'suspended') {
        this.audio.ctx.resume();
      }
    }
  }

  setDebug(on) {
    this.debug = !!on;
    const el = typeof document !== 'undefined' ? document.getElementById('debug') : null;
    if (el) el.classList.toggle('visible', this.debug);
  }

  /* ------------------------------- сцены ------------------------------- */

  get topScene() { return this.scenes[this.scenes.length - 1] || null; }

  pushScene(scene) {
    this.scenes.push(scene);
    this.input.setTarget(scene);
    scene.enter?.();
    return scene;
  }

  replaceScene(scene) {
    const old = this.scenes.pop();
    old?.exit?.();
    this.scenes.length = 0;
    this.scenes.push(scene);
    this.input.setTarget(scene);
    scene.enter?.();
    return scene;
  }

  popScene() {
    const s = this.scenes.pop();
    s?.exit?.();
    const top = this.topScene;
    if (top) this.input.setTarget(top);
    return top;
  }

  nextMapAfter(id) { return nextMapId(id); }
  mapCountTotal() { return mapCount(); }

  /* ----------------------------- игровой цикл --------------------------- */

  start() {
    this.lastTs = 0;
    const step = (ts) => {
      this.raf = requestAnimationFrame(step);
      this.frame(ts);
    };
    this.raf = requestAnimationFrame(step);
  }

  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
  }

  frame(ts) {
    // ---- время кадра ----
    if (!this.lastTs) this.lastTs = ts;
    let frameTime = (ts - this.lastTs) / 1000;
    this.lastTs = ts;
    if (frameTime > 0.25) frameTime = 0.25;      // защита от «спирали смерти»
    if (frameTime < 0) frameTime = 0;

    // ---- FPS ----
    this.fpsAcc += frameTime;
    this.fpsFrames++;
    if (this.fpsAcc >= 0.5) {
      this.fps = this.fpsFrames / this.fpsAcc;
      this.fpsAcc = 0;
      this.fpsFrames = 0;
      this._updateDebug();
    }

    // ---- «батарейный» режим: 30 FPS, если пользователь давно не трогал экран
    const idle = this.input.idleSeconds() > CONFIG.IDLE_DELAY;
    const top = this.topScene;
    const busy = top instanceof GameScene && !top.demo && top.enemies?.length > 0;
    this.frameDiv = (idle && !busy) ? 2 : 1;
    this.frames++;
    const shouldRender = (this.frames % this.frameDiv) === 0;

    // ---- логика (фиксированный шаг) ----
    if (!this.paused && top) {
      const speed = clamp(top.speed ?? 1, 0, 4);
      if (speed > 0) {
        this.acc += frameTime * speed;
        const dt = CONFIG.FIXED_DT;
        let steps = 0;
        const maxSteps = CONFIG.MAX_STEPS_PER_FRAME * Math.max(1, speed);
        while (this.acc >= dt && steps < maxSteps) {
          top.update(dt);
          this.acc -= dt;
          steps++;
          this.time += dt;
        }
        if (steps >= maxSteps) this.acc = 0;
      } else {
        // сцена на паузе — время всё равно идёт (для анимаций оверлея)
        top.update(frameTime);
        this.time += frameTime;
      }
    }

    // ---- рендер ----
    if (shouldRender) this.render();
  }

  render() {
    const g = this.ctx;
    const dpr = this.dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#0a0f1e';
    g.fillRect(0, 0, this.viewW, this.viewH);

    // находим нижнюю «непрозрачную» сцену и рисуем от неё вверх
    let start = this.scenes.length - 1;
    while (start > 0 && this.scenes[start].transparent) start--;
    for (let i = start; i < this.scenes.length; i++) {
      const s = this.scenes[i];
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      try {
        s.render(g);
      } catch (e) {
        if (typeof console !== 'undefined') console.error('[render]', e);
      }
    }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  _updateDebug() {
    if (!this.debug) return;
    const el = typeof document !== 'undefined' ? document.getElementById('debug') : null;
    if (!el) return;
    const top = this.topScene;
    const parts = [
      `FPS ${this.fps.toFixed(0)}`,
      `zoom ${this.camera.zoom.toFixed(2)}`,
      `scene ${top?.constructor?.name || '-'}`
    ];
    if (top instanceof GameScene) {
      parts.push(`enemies ${top.enemies.length}`);
      parts.push(`towers ${top.towers.length}`);
      parts.push(`proj ${top.projectiles.count}`);
      parts.push(`parts ${top.particles.count}`);
      parts.push(`fx ${top.effects.count}`);
      parts.push(`wave ${top.waves.wave} ${top.waves.state}`);
      parts.push(`speed x${top.gameSpeed}`);
      parts.push(`path v${top.path.version}`);
    }
    el.textContent = parts.join('\n');
  }
}

void Game;


/* ==== js/main.js ==== */
/* ==========================================================================
   main.js — точка входа.

   Порядок:
     1) ждём DOM;
     2) создаём Game (canvas, ввод, звук, сохранения);
     3) решаем вопрос с ориентацией (подсказка «поверните телефон»);
     4) запускаем цикл и убираем загрузочный экран;
     5) регистрируем service worker для офлайн-работы (если отдаёмся по http).
   ========================================================================== */


function isTouch() {
  return typeof window !== 'undefined' &&
    (window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window);
}

function updateRotateHint() {
  const el = document.getElementById('rotate');
  if (!el) return;
  const portrait = window.innerHeight > window.innerWidth;
  // подсказка нужна только на реальном телефоне в портретной ориентации
  el.classList.toggle('visible', portrait && isTouch() && window.innerWidth < 820);
}

function boot() {
  const canvas = document.getElementById('game');
  if (!canvas) return;

  const game = new Game(canvas);
  game.init();

  // отладочная плашка: ?debug=1 или клавиша F
  const params = new URLSearchParams(location.search);
  if (params.get('debug') === '1') game.setDebug(true);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'F' || e.key === 'f') game.setDebug(!game.debug);
    if (e.key === 'd') game.camera.userZoom = game.camera.userZoom; // no-op, чтобы не оптимизировалось
  });

  updateRotateHint();
  window.addEventListener('resize', updateRotateHint);
  window.addEventListener('orientationchange', () => setTimeout(updateRotateHint, 250));

  game.start();

  // прячем загрузочный экран после первого кадра
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const boot = document.getElementById('boot');
      if (boot) {
        boot.style.transition = 'opacity .35s ease';
        boot.style.opacity = '0';
        setTimeout(() => boot.classList.remove('visible'), 360);
      }
    });
  });

  // офлайн-режим (работает только при отдаче по http/https, не с file://)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* не критично */ });
    });
  }

  // удобно для отладки в консоли
  window.__game = game;
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
